plugins { id 'java-library' }
repositories { mavenCentral() }
java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }
dependencies {
    api project(':renderer')
    implementation 'org.lwjgl:lwjgl:3.4.1'
    implementation 'org.lwjgl:lwjgl-opengl:3.4.1'
    implementation 'org.lwjgl:lwjgl-glfw:3.4.1'
}
// The application context owner supplies platform natives; validation uses its own explicit configuration below.

// Native bundles belong only to the explicitly invoked GPU contract task.
configurations { gpuContractNatives { canBeConsumed = false; canBeResolved = true } }
dependencies {
    for (module in ['lwjgl', 'lwjgl-glfw', 'lwjgl-opengl']) {
        gpuContractNatives "org.lwjgl:${module}:3.4.1:natives-windows"
    }
}
// No contract executes during normal builds; renderer-stage execution is explicit.
tasks.named('test') { enabled = false }
tasks.register('gpuContracts', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath + configurations.gpuContractNatives
    mainClass = 'dev.irisvisualizer.renderer.gl.GlGpuContracts'
    maxHeapSize = '1024m'
    doFirst {
        def destination = providers.gradleProperty('gpuReport').orNull
        if (!destination) throw new GradleException('Supply -PgpuReport=<new report path> for explicit GPU execution')
        args = [file(destination).absolutePath]
    }
}
