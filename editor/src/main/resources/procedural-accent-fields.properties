decorators.target.type=IrisTreeDecoratorTarget
decorators.target.description=Where this decorator is placed on the tree.
decorators.target.default=BRANCH_TIP
decorators.target.choices=BRANCH_TIP,TRUNK_SURFACE,CANOPY_TOP,CANOPY_BOTTOM,TRUNK_BASE,LEAF_SURFACE,CANOPY_HANG,BRANCH_SURFACE,TRUNK_TOP,GROUND_SCATTER
decorators.target.BRANCH_TIP.description=At the tip of each generated branch (vines, fruit, lanterns).
decorators.target.TRUNK_SURFACE.description=On air-facing sides of trunk and branch blocks (vines, moss).
decorators.target.CANOPY_TOP.description=On top of the highest block in each column (snow, sculk).
decorators.target.CANOPY_BOTTOM.description=One block below the lowest leaf in each column (glowing underside).
decorators.target.TRUNK_BASE.description=Around the y=0 ring at the base of the trunk (roots, mushrooms).
decorators.target.LEAF_SURFACE.description=On air-facing sides of leaf blocks (berries, lights nestled in the foliage).
decorators.target.CANOPY_HANG.description=Hanging strands of up to 'length' blocks below the lowest leaf in each column (vines, icicles).
decorators.target.BRANCH_SURFACE.description=On the top face of trunk and branch blocks (moss, snow on limbs).
decorators.target.TRUNK_TOP.description=One block above the very top of the trunk (nest, beehive, beacon).
decorators.target.GROUND_SCATTER.description=Scattered across the ground footprint around the base, wider than the trunk-base ring.
decorators.block.type=String
decorators.block.description=The block id to place, e.g. minecraft:magma_block. Ignored when palette is set.
decorators.block.default=
decorators.palette.type=IrisMaterialPalette
decorators.palette.description=A noise-driven palette for this decorator. When set this overrides the single block.
decorators.palette.default=null
decorators.chance.type=double
decorators.chance.description=The chance per candidate position for this decorator to place.
decorators.chance.default=0.5
decorators.chance.minimum=0
decorators.chance.maximum=1
decorators.length.type=int
decorators.length.description=Maximum strand length downward for the CANOPY_HANG target (random 1..length per column).
decorators.length.default=1
decorators.length.minimum=1
decorators.axisAware.type=boolean
decorators.axisAware.description=If true the block's facing is oriented away from the trunk (for trunk-mounted fences/gates/banners).
decorators.axisAware.default=false
weightedSecondaryLeaves.block.type=String
weightedSecondaryLeaves.block.description=The block id to scatter, e.g. minecraft:shroomlight
weightedSecondaryLeaves.block.default=
weightedSecondaryLeaves.weight.type=int
weightedSecondaryLeaves.weight.description=The relative weight of this block among the secondary leaves.
weightedSecondaryLeaves.weight.default=1
weightedSecondaryLeaves.weight.minimum=0
accents.target.type=IrisRuinDecoratorTarget
accents.target.description=Where on the ruin this accent is placed. TOP sits on the highest block of each column, SURFACE clings to air-facing vertical faces, BASE_SCATTER rings the ground footprint around the base.
accents.target.default=TOP
accents.target.choices=TOP,SURFACE,BASE_SCATTER
accents.target.TOP.description=On top of the highest surviving block in each column (moss carpets, snow, sculk, lanterns on broken tops).
accents.target.SURFACE.description=On air-facing vertical sides of any surviving block (vines, glow lichen, climbing growth on the ruin faces).
accents.target.BASE_SCATTER.description=Scattered across the ground footprint around the y=0 base ring, wider than the structure itself (loose rubble, mushrooms, grass tufts ringing the ruin).
accents.block.type=String
accents.block.description=The block id to place, e.g. minecraft:moss_carpet or minecraft:vine. Ignored when palette is set.
accents.block.default=
accents.palette.type=IrisMaterialPalette
accents.palette.description=A noise-driven palette for this decorator. When set this overrides the single block, letting the accent mix blocks by noise. Resolved through IrisProceduralBlocks.resolve so the palette wins over the string.
accents.palette.default=null
accents.chance.type=double
accents.chance.description=The chance (0-1) per candidate position for this decorator to actually place. 1 covers every candidate, lower values leave sparse, patchy accents.
accents.chance.default=0.4
accents.chance.minimum=0
accents.chance.maximum=1
accents.scatterRadius.type=int
accents.scatterRadius.description=For the BASE_SCATTER target, how many blocks beyond the ruin footprint the scatter ring extends outward in each direction. Higher values fling rubble and growth further from the structure.
accents.scatterRadius.default=2
accents.scatterRadius.minimum=1
weight.policy=longSumNonnegative
secondary.policy=secondaryPaletteThenWeightedThenSingle
allZero.policy=primaryLeafFallback
lists.null=empty
palette.policy=sharedClassDefault
execution.policy=disabled
