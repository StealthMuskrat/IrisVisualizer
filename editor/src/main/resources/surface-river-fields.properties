channel.sink.type=int
channel.sink.description=Blocks the water surface sinks below the shaped bank top; 0 keeps the water flush with its banks.
channel.sink.default=0
channel.sink.minimum=0
channel.sink.maximum=3
channel.maximumIncision.type=int
channel.maximumIncision.description=Maximum channel cut below natural terrain. Also caps bank fill, together with banks.excavation.maximumDepth; courses exceeding containment or terrain limits are rejected.
channel.maximumIncision.default=10
channel.maximumIncision.minimum=1
channel.maximumIncision.maximum=32
channel.roughness.type=double
channel.roughness.description=Coherent variation of the wet outline and bed as a fraction of the channel size.
channel.roughness.default=0.25
channel.roughness.minimum=0
channel.roughness.maximum=1
channel.roughnessWavelength.type=int
channel.roughnessWavelength.description=Wavelength in blocks of the outline and bed variation.
channel.roughnessWavelength.default=16
channel.roughnessWavelength.minimum=4
channel.roughnessWavelength.maximum=64
channel.springWidthRatio.type=double
channel.springWidthRatio.description=Peak width of the spring pool relative to the channel width, reached near the first quarter of springLength; 1 keeps the source at normal channel width.
channel.springWidthRatio.default=2.5
channel.springWidthRatio.minimum=1
channel.springWidthRatio.maximum=4
channel.springLength.type=int
channel.springLength.description=Blocks over which the source widens into its spring pool and narrows back to the channel width.
channel.springLength.default=24
channel.springLength.minimum=4
channel.springLength.maximum=96
channel.smoothingRadius.type=int
channel.smoothingRadius.description=Stations along the course the varied width and sampled depth are averaged over; 0 retains their unsmoothed values at each station.
channel.smoothingRadius.default=16
channel.smoothingRadius.minimum=0
channel.smoothingRadius.maximum=64
channel.outlineMinimumRatio.type=double
channel.outlineMinimumRatio.description=Narrowest the roughened waterline may pinch, as a fraction of the channel half-width; 1 stops the outline from ever narrowing below the nominal width.
channel.outlineMinimumRatio.default=0.6
channel.outlineMinimumRatio.minimum=0.2
channel.outlineMinimumRatio.maximum=1
channel.outlineMaximumRatio.type=double
channel.outlineMaximumRatio.description=Widest the roughened waterline may bulge, as a fraction of the channel half-width; 1 stops the outline from ever widening beyond the nominal width.
channel.outlineMaximumRatio.default=1.4
channel.outlineMaximumRatio.minimum=1
channel.outlineMaximumRatio.maximum=3
channel.springExtraDepth.type=double
channel.springExtraDepth.description=Extra bed depth in blocks at the headwater spring, fading to nothing over springLength; 0 keeps the spring pool as deep as the channel.
channel.springExtraDepth.default=1
channel.springExtraDepth.minimum=0
channel.springExtraDepth.maximum=8
banks.shoreWidth.type=double
banks.shoreWidth.description=Width in blocks of the flattened shore bench beside the water, the geometric beach cut level with the bank top, and the default width of the shore biome band. 0 removes the bench so the eroded valley side begins at the waterline; riverPolicy.shoreWidth overrides it per area.
banks.shoreWidth.default=1.5
banks.shoreWidth.minimum=0
banks.shoreWidth.maximum=16
banks.blendSlope.type=double
banks.blendSlope.description=Horizontal bank blend in blocks per block of terrain cut or fill.
banks.blendSlope.default=3
banks.blendSlope.minimum=0.5
banks.blendSlope.maximum=12
banks.minimumBlendWidth.type=int
banks.minimumBlendWidth.description=Narrowest eroded band outside the shore, in blocks.
banks.minimumBlendWidth.default=4
banks.minimumBlendWidth.minimum=1
banks.minimumBlendWidth.maximum=64
banks.maximumBlendWidth.type=int
banks.maximumBlendWidth.description=Widest eroded band outside the shore, in blocks.
banks.maximumBlendWidth.default=32
banks.maximumBlendWidth.minimum=1
banks.maximumBlendWidth.maximum=64
banks.exposeCutStrata.type=boolean
banks.exposeCutStrata.description=Show the biome's deeper layers on eroded banks instead of the surface layer.
banks.exposeCutStrata.default=true
banks.shoreRise.type=double
banks.shoreRise.description=Blocks the shore bench rises from the waterline to its landward edge, so the beach climbs instead of lying level; 0 keeps a flat bench. The eroded valley side starts from the raised edge.
banks.shoreRise.default=0
banks.shoreRise.minimum=0
banks.shoreRise.maximum=4
banks.blendBaseWidth.type=double
banks.blendBaseWidth.description=Blocks added to every eroded valley width before the blend width limits apply, so even a shallow cut erodes at least this far beyond the shore; 0 leaves the width proportional to the cut alone.
banks.blendBaseWidth.default=0
banks.blendBaseWidth.minimum=0
banks.blendBaseWidth.maximum=32
flow.cascadeRun.type=int
flow.cascadeRun.description=Shortest level run in blocks between one-block steps before consecutive steps are labelled a cascade.
flow.cascadeRun.default=2
flow.cascadeRun.minimum=1
flow.cascadeRun.maximum=8
flow.waterfallMinimumDrop.type=int
flow.waterfallMinimumDrop.description=Smallest natural cliff in blocks that becomes a waterfall instead of a cascade.
flow.waterfallMinimumDrop.default=6
flow.waterfallMinimumDrop.minimum=2
flow.waterfallMinimumDrop.maximum=32
flow.waterfallThalwegFraction.type=double
flow.waterfallThalwegFraction.description=Share of the half-width that stays at full bed depth in the carved throat of a waterfall or cascade before the bed rises to the edge; higher is a flatter, broader throat.
flow.waterfallThalwegFraction.default=0.65
flow.waterfallThalwegFraction.minimum=0
flow.waterfallThalwegFraction.maximum=0.95
flow.plungeBasinMinimumDrop.type=int
flow.plungeBasinMinimumDrop.description=Smallest drop in blocks that scours a plunge basin into the bed below it; drops shorter than this leave the bed untouched.
flow.plungeBasinMinimumDrop.default=2
flow.plungeBasinMinimumDrop.minimum=1
flow.plungeBasinMinimumDrop.maximum=8
flow.plungeBasinLengthRatio.type=double
flow.plungeBasinLengthRatio.description=Length of the plunge basin downstream of a drop as a multiple of the channel half-width, never shorter than two stations; 0 gives the shortest basin.
flow.plungeBasinLengthRatio.default=2
flow.plungeBasinLengthRatio.minimum=0
flow.plungeBasinLengthRatio.maximum=8
flow.plungeBasinDepth.type=int
flow.plungeBasinDepth.description=Extra bed depth in blocks scoured inside a plunge basin; 0 marks the basin without deepening it.
flow.plungeBasinDepth.default=1
flow.plungeBasinDepth.minimum=0
flow.plungeBasinDepth.maximum=8
mouths.flareRatio.type=double
mouths.flareRatio.description=Width multiplier reached at the coastline over the final stretch of the river.
mouths.flareRatio.default=1.6
mouths.flareRatio.minimum=1
mouths.flareRatio.maximum=4
mouths.maximumOceanApron.type=int
mouths.maximumOceanApron.description=Maximum number of blocks the recorded mouth footprint may enter the ocean before terminating.
mouths.maximumOceanApron.default=8
mouths.maximumOceanApron.minimum=0
mouths.maximumOceanApron.maximum=32
mouths.inletLength.type=int
mouths.inletLength.description=Blocks of river before the coast held at sea level as a drowned inlet, widened toward flareRatio over that reach. Zero ends the river at the shoreline with no inlet.
mouths.inletLength.default=64
mouths.inletLength.minimum=0
mouths.inletLength.maximum=256
mouths.inletDepth.type=int
mouths.inletDepth.description=Extra bed depth reached at the shoreline over the inlet, so the estuary is deeper than the river above it.
mouths.inletDepth.default=3
mouths.inletDepth.minimum=0
mouths.inletDepth.maximum=16
mouths.maximumIncision.type=int
mouths.maximumIncision.description=Deepest cut allowed in the inlet and its approach ramp, replacing channel.maximumIncision there, so the coast may be cut down to sea level through a rise of this height.
mouths.maximumIncision.default=32
mouths.maximumIncision.minimum=0
mouths.maximumIncision.maximum=128
mouths.inletCourseFraction.type=double
mouths.inletCourseFraction.description=Largest share of the river's exposed course the drowned inlet may occupy, so a short river keeps most of its length above sea level; the inlet is the shorter of inletLength and this share.
mouths.inletCourseFraction.default=0.5
mouths.inletCourseFraction.minimum=0.05
mouths.inletCourseFraction.maximum=1
mouths.inletRampSlope.type=double
mouths.inletRampSlope.description=Blocks of head gained per station on the approach ramp climbing from the inlet back to the river's natural profile; 1 climbs one block per station, higher values grade the approach faster.
mouths.inletRampSlope.default=1
mouths.inletRampSlope.minimum=0.1
mouths.inletRampSlope.maximum=4
