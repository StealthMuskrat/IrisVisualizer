trees.trunkCurve.description=How the lean accumulates over height.
trees.trunkCurve.default=LINEAR
trees.trunkCurve.choices=CONSTANT,LINEAR,SIGMOID,LOG,SINE,PARABOLIC,EXPONENTIAL,SQRT,STEP,BELL,EASE_IN_OUT
trees.trunkCurve.CONSTANT.description=Same value at every height.
trees.trunkCurve.LINEAR.description=Ramps straight from start to end.
trees.trunkCurve.SIGMOID.description=S-curve transition controlled by steepness.
trees.trunkCurve.LOG.description=Logarithmic falloff controlled by base.
trees.trunkCurve.SINE.description=Sine ripple controlled by period and amplitude.
trees.trunkCurve.PARABOLIC.description=Parabolic pinch, narrowest at peakOffset.
trees.trunkCurve.EXPONENTIAL.description=Geometric (exponential) interpolation from start to end.
trees.trunkCurve.SQRT.description=Square-root ease: fast change low, slow high.
trees.trunkCurve.STEP.description=Hard step that jumps from start to end at the threshold (peakOffset).
trees.trunkCurve.BELL.description=Bell bulge peaking in the middle of the height range.
trees.trunkCurve.EASE_IN_OUT.description=Smoothstep ease-in-out (3t^2 - 2t^3).
trees.curveSteepness.type=double
trees.curveSteepness.description=Steepness for the SIGMOID trunk curve.
trees.curveSteepness.default=8
trees.leanAzimuthMode.type=IrisTreeAzimuthMode
trees.leanAzimuthMode.description=How the lean azimuth itself changes over height (for spiraling or wandering trunks).
trees.leanAzimuthMode.default=CONSTANT
trees.leanAzimuthMode.choices=CONSTANT,LINEAR,SPIRAL,SINE,NOISE,RANDOM,GOLDEN_ANGLE,ALTERNATING,WHORL,ZIGZAG
trees.leanAzimuthMode.CONSTANT.description=A single fixed azimuth.
trees.leanAzimuthMode.LINEAR.description=Azimuth ramps straight from start to end with height.
trees.leanAzimuthMode.SPIRAL.description=Azimuth winds around the trunk a number of turns (corkscrew).
trees.leanAzimuthMode.SINE.description=Azimuth oscillates with a sine wave.
trees.leanAzimuthMode.NOISE.description=Azimuth wanders using deterministic noise.
trees.leanAzimuthMode.RANDOM.description=Each branch picks a uniformly random azimuth (falls back to constant for trunk lean).
trees.leanAzimuthMode.GOLDEN_ANGLE.description=Phyllotaxis: each successive branch is offset by the 137.5 degree golden angle for the most natural spiral packing (branches).
trees.leanAzimuthMode.ALTERNATING.description=Each successive branch is thrown to the opposite side (180 degrees apart).
trees.leanAzimuthMode.WHORL.description=Branches are grouped into evenly spaced whorls of azimuthWhorlCount around each ring.
trees.leanAzimuthMode.ZIGZAG.description=Azimuth zigzags by +/- amplitude on alternating branches.
trees.azimuthStart.type=double
trees.azimuthStart.description=Azimuth at the base for the LINEAR azimuth mode.
trees.azimuthStart.default=0
trees.azimuthEnd.type=double
trees.azimuthEnd.description=Azimuth at the top for the LINEAR azimuth mode.
trees.azimuthEnd.default=0
trees.azimuthTurns.type=double
trees.azimuthTurns.description=Number of full turns for the SPIRAL azimuth mode.
trees.azimuthTurns.default=1
trees.azimuthAmplitude.type=double
trees.azimuthAmplitude.description=Amplitude for the SINE azimuth mode.
trees.azimuthAmplitude.default=90
trees.azimuthPeriod.type=double
trees.azimuthPeriod.description=Period for the SINE azimuth mode.
trees.azimuthPeriod.default=1
trees.azimuthOffset.type=double
trees.azimuthOffset.description=Offset for the SINE azimuth mode.
trees.azimuthOffset.default=0
trees.azimuthScale.type=double
trees.azimuthScale.description=Scale for the NOISE azimuth mode.
trees.azimuthScale.default=1
trees.azimuthWhorlCount.type=int
trees.azimuthWhorlCount.description=Number of branches per whorl ring for the WHORL branch azimuth mode.
trees.azimuthWhorlCount.default=5
trees.azimuthWhorlCount.minimum=1
