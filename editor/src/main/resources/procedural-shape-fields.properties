trees.profile.type=IrisTreeProfile
trees.profile.description=The named canopy profile that drives default crown radii and shape.
trees.profile.default=OAK
trees.profile.choices=OAK,BIRCH,POPLAR,SPRUCE,JUNGLE,ACACIA,DARK_OAK,DARK_OAK_FLAT,DARK_OAK_FLAT_WIDE,CHERRY,PALM,WILLOW,COLUMNAR,BUSH,MEGA_SPRUCE
trees.profile.OAK.description=Rounded broadleaf crown.
trees.profile.BIRCH.description=Slim upright broadleaf crown.
trees.profile.POPLAR.description=Upright broadleaf crown with a rounded upper canopy and a tapered top.
trees.profile.SPRUCE.description=Narrow conifer cone.
trees.profile.JUNGLE.description=Tall thin crown concentrated near the very top.
trees.profile.ACACIA.description=Flat shallow umbrella crown.
trees.profile.DARK_OAK.description=Dense rounded broadleaf crown.
trees.profile.DARK_OAK_FLAT.description=Flat wide umbrella crown compressed into the top quarter (vanilla dark oak look).
trees.profile.DARK_OAK_FLAT_WIDE.description=Extra wide flat umbrella that overlaps into a continuous roofed canopy.
trees.profile.CHERRY.description=Broad rounded blossom crown.
trees.profile.PALM.description=Bare trunk with a small tuft of fronds only at the very top.
trees.profile.WILLOW.description=Broad crown with wide drooping radii, ideal with a low startAngle to make a weeping skirt.
trees.profile.COLUMNAR.description=Very narrow tall crown hugging the trunk (cypress / lombardy poplar).
trees.profile.BUSH.description=Squat, wide, low crown for shrubs and saplings.
trees.profile.MEGA_SPRUCE.description=Giant conifer cone for 2x2 mega spruce trunks.
trees.heightMin.type=int
trees.heightMin.description=Minimum trunk height in blocks.
trees.heightMin.default=8
trees.heightMin.minimum=1
trees.heightMax.type=int
trees.heightMax.description=Maximum trunk height in blocks.
trees.heightMax.default=12
trees.heightMax.minimum=1
trees.trunkWidth.type=int
trees.trunkWidth.description=Base trunk width in blocks. 1 is a single column, 2 is a 2x2 trunk, etc.
trees.trunkWidth.default=1
trees.trunkWidth.minimum=1
trees.trunkShape.type=IrisTreeFunction
trees.trunkShape.description=The function used to shape trunk width over height.
trees.trunkShape.default=CONSTANT
trees.trunkShape.choices=CONSTANT,LINEAR,SIGMOID,LOG,SINE,PARABOLIC,EXPONENTIAL,SQRT,STEP,BELL,EASE_IN_OUT
trees.trunkShape.CONSTANT.description=Same value at every height.
trees.trunkShape.LINEAR.description=Ramps straight from start to end.
trees.trunkShape.SIGMOID.description=S-curve transition controlled by steepness.
trees.trunkShape.LOG.description=Logarithmic falloff controlled by base.
trees.trunkShape.SINE.description=Sine ripple controlled by period and amplitude.
trees.trunkShape.PARABOLIC.description=Parabolic pinch, narrowest at peakOffset.
trees.trunkShape.EXPONENTIAL.description=Geometric (exponential) interpolation from start to end.
trees.trunkShape.SQRT.description=Square-root ease: fast change low, slow high.
trees.trunkShape.STEP.description=Hard step that jumps from start to end at the threshold (peakOffset).
trees.trunkShape.BELL.description=Bell bulge peaking in the middle of the height range.
trees.trunkShape.EASE_IN_OUT.description=Smoothstep ease-in-out (3t^2 - 2t^3).
trees.shapeStart.type=double
trees.shapeStart.description=Width multiplier at the base for the LINEAR trunk shape.
trees.shapeStart.default=1
trees.shapeEnd.type=double
trees.shapeEnd.description=Width multiplier at the top for the LINEAR trunk shape.
trees.shapeEnd.default=1
trees.shapeSteepness.type=double
trees.shapeSteepness.description=Steepness for the SIGMOID trunk shape.
trees.shapeSteepness.default=5
trees.shapeBase.type=double
trees.shapeBase.description=Base for the LOG trunk shape.
trees.shapeBase.default=2.718281828
trees.shapePeriod.type=double
trees.shapePeriod.description=Period for the SINE trunk shape.
trees.shapePeriod.default=1
trees.shapeAmplitude.type=double
trees.shapeAmplitude.description=Amplitude for the SINE trunk shape.
trees.shapeAmplitude.default=0.2
trees.shapePeakOffset.type=double
trees.shapePeakOffset.description=Pinch position (0-1) for the PARABOLIC trunk shape.
trees.shapePeakOffset.default=0.5
trees.shapeFloor.type=double
trees.shapeFloor.description=Minimum width fraction at the waist for the PARABOLIC trunk shape.
trees.shapeFloor.default=0.5
trees.leanAzimuth.type=double
trees.leanAzimuth.description=Compass direction in degrees the trunk leans toward.
trees.leanAzimuth.default=0
trees.leanAngle.type=double
trees.leanAngle.description=How far the trunk leans, in degrees from vertical. 0 is perfectly upright.
trees.leanAngle.default=0
