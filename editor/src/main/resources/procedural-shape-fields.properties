coral.fields=waterlogged,form,tipChance,heightMin,heightMax,spread,sway,branchCount,branchLength,branchElevation,branchAzimuth,subBranches,subBranchCount,subBranchScale,tipClusterRadius,brainRadius,brainRoughness,pillarRadius,fanWidth,tendrilCount
coral.waterlogged.type=boolean
coral.waterlogged.description=If true (default), every resolved coral block that is waterloggable is forced waterlogged so the coral does not die in water (coral fans, sea pickles and kelp also waterlog). Set false to place dead/dry coral.
coral.waterlogged.default=true
coral.form.type=IrisCoralForm
coral.form.description=The overall silhouette this coral grows into (branching, fan, brain, pillar, tendril). Each form runs a different generation routine.
coral.form.default=BRANCHING
coral.form.choices=BRANCHING,FAN,BRAIN,PILLAR,TENDRIL
coral.form.BRANCHING.description=A tree-like coral built from a stout central stalk that sprouts several upward-leaning arms (distributed by golden angle or randomly), each optionally splitting once into sub-arms, with small coral tip clusters (fans / sea pickles) at the ends. The most structurally complex form and the closest analogue to a procedural tree.
coral.form.FAN.description=A thin, single-block-thick vertical fan plane that rises and widens with height like a sheet of fire or horn coral. Reads as a flat decorative blade rather than a volume.
coral.form.BRAIN.description=A rounded, noise-perturbed ellipsoid blob of brain coral that bulges out of the seafloor like a boulder, with an irregular wrinkled surface driven by 3D value noise.
coral.form.PILLAR.description=A stout, thick vertical column of coral block topped with a dense tip cluster. Wider and blunter than a tendril, reading as a solid coral pillar or stack.
coral.form.TENDRIL.description=Several very thin (one block wide) wavy stalks that rise upward and wander laterally using value noise, like a clump of swaying coral whips or kelp-thin growths.
coral.tipChance.type=double
coral.tipChance.description=The chance per eligible tip position to place a tip block (coral fan / sea pickle).
coral.tipChance.default=0.6
coral.tipChance.minimum=0
coral.tipChance.maximum=1
coral.heightMin.type=int
coral.heightMin.description=Minimum overall height of the coral in blocks.
coral.heightMin.default=4
coral.heightMin.minimum=1
coral.heightMax.type=int
coral.heightMax.description=Maximum overall height of the coral in blocks.
coral.heightMax.default=8
coral.heightMax.minimum=1
coral.spread.type=double
coral.spread.description=Horizontal spread of the structure in blocks. For BRANCHING this is how far arms reach out, for BRAIN/PILLAR/FAN it widens the base footprint.
coral.spread.default=3
coral.spread.minimum=0
coral.sway.type=double
coral.sway.description=Lateral noise wobble (0-1) applied to branches and tendrils so they are not ruler-straight. 0 is perfectly straight, 1 is heavily wandering.
coral.sway.default=0.5
coral.sway.minimum=0
coral.sway.maximum=1
coral.branchCount.type=int
coral.branchCount.description=BRANCHING only: how many arms sprout from the central stalk.
coral.branchCount.default=4
coral.branchCount.minimum=1
coral.branchCount.maximum=12
coral.branchLength.type=double
coral.branchLength.description=BRANCHING only: the length of each arm in blocks before reaching its tip.
coral.branchLength.default=3
coral.branchLength.minimum=1
coral.branchElevation.type=double
coral.branchElevation.description=BRANCHING only: the upward elevation in degrees of each arm from horizontal. 90 is straight up, 0 is flat out.
coral.branchElevation.default=55
coral.branchElevation.minimum=0
coral.branchElevation.maximum=90
coral.branchAzimuth.type=IrisCoralBranchAzimuth
coral.branchAzimuth.description=BRANCHING only: how the arms are distributed around the stalk by azimuth.
coral.branchAzimuth.default=GOLDEN_ANGLE
coral.branchAzimuth.choices=GOLDEN_ANGLE,EVEN,RANDOM
coral.branchAzimuth.GOLDEN_ANGLE.description=Distribute arms by the golden angle (about 137.5 degrees per arm) for a natural phyllotactic spiral where no two arms overlap.
coral.branchAzimuth.EVEN.description=Distribute arms in evenly spaced spokes, dividing 360 degrees equally between them like a radial whorl.
coral.branchAzimuth.RANDOM.description=Place each arm at a fully random azimuth using the deterministic per-variant RNG, for an irregular wild reef.
coral.subBranches.type=boolean
coral.subBranches.description=BRANCHING only: if true, each arm splits once into a small fan of sub-arms for a bushier reef.
coral.subBranches.default=true
coral.subBranchCount.type=int
coral.subBranchCount.description=BRANCHING only: how many sub-arms each arm splits into when subBranches is true.
coral.subBranchCount.default=2
coral.subBranchCount.minimum=1
coral.subBranchCount.maximum=5
coral.subBranchScale.type=double
coral.subBranchScale.description=BRANCHING only: the length of each sub-arm as a fraction of its parent arm.
coral.subBranchScale.default=0.5
coral.subBranchScale.minimum=0
coral.subBranchScale.maximum=1
coral.tipClusterRadius.type=int
coral.tipClusterRadius.description=BRANCHING and PILLAR only: the radius of the small coral tip cluster grown at each tip.
coral.tipClusterRadius.default=1
coral.tipClusterRadius.minimum=0
coral.tipClusterRadius.maximum=4
coral.brainRadius.type=int
coral.brainRadius.description=BRAIN only: the horizontal radius of the brain-coral blob in blocks.
coral.brainRadius.default=3
coral.brainRadius.minimum=1
coral.brainRadius.maximum=8
coral.brainRoughness.type=double
coral.brainRoughness.description=BRAIN only: how strongly 3D value noise perturbs the ellipsoid surface, for a wrinkled organic blob. 0 is a smooth dome.
coral.brainRoughness.default=0.35
coral.brainRoughness.minimum=0
coral.brainRoughness.maximum=1
coral.pillarRadius.type=int
coral.pillarRadius.description=PILLAR only: the radius of the stout vertical column in blocks.
coral.pillarRadius.default=1
coral.pillarRadius.minimum=1
coral.pillarRadius.maximum=12
coral.fanWidth.type=int
coral.fanWidth.description=FAN only: the half-width of the upright fan plane in blocks (the disc widens toward its mid-height).
coral.fanWidth.default=3
coral.fanWidth.minimum=1
coral.fanWidth.maximum=8
coral.tendrilCount.type=int
coral.tendrilCount.description=TENDRIL only: how many thin wavy stalks rise from the base.
coral.tendrilCount.default=4
coral.tendrilCount.minimum=1
coral.tendrilCount.maximum=12
