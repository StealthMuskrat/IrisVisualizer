trees.roots.type=boolean
trees.roots.description=If true, a root system extends below (and around) the base so the tree connects to the ground on uneven terrain.
trees.roots.default=true
trees.rootStyle.type=IrisTreeRootStyle
trees.rootStyle.description=How the root system is built when roots is true.
trees.rootStyle.default=BUTTRESS
trees.rootStyle.choices=TAPROOT,BUTTRESS,STILT
trees.rootStyle.TAPROOT.description=A single tapering taproot straight down from the base.
trees.rootStyle.BUTTRESS.description=A taproot plus a ring of flared buttress legs that splay outward as they descend (default).
trees.rootStyle.STILT.description=Visible above-ground prop roots that arch out and down from the lower trunk to the ground (mangrove style).
trees.rootDepth.type=int
trees.rootDepth.description=Root depth in blocks, also used for ground-contact extension up to 16 blocks. 0 scales with tree height.
trees.rootDepth.default=0
trees.rootDepth.minimum=0
trees.rootFlare.type=double
trees.rootFlare.description=Horizontal reach of buttress and stilt roots. 0 uses a compact radius based on trunk width. Taproots ignore this field.
trees.rootFlare.default=0
trees.rootFlare.minimum=0
trees.trunkForks.type=int
trees.trunkForks.description=How many separate trunks the tree splits into above forkHeight. 1 is a single trunk.
trees.trunkForks.default=1
trees.trunkForks.minimum=1
trees.trunkForks.maximum=6
trees.forkHeight.type=double
trees.forkHeight.description=The normalized height where the trunk splits into forks.
trees.forkHeight.default=0.5
trees.forkHeight.minimum=0
trees.forkHeight.maximum=1
trees.forkAngle.type=double
trees.forkAngle.description=The outward lean angle in degrees of each fork.
trees.forkAngle.default=25
ruins.fields=form,heightMin,heightMax,widthMin,widthMax,lengthMin,lengthMax,mossiness,weatheringScale,erosion,erosionScale,buriedFraction
ruins.form.type=IrisRuinForm
ruins.form.description=The overall silhouette of the ruin: PILLAR (broken column), WALL (gapped segment), ARCH (two legs plus a curved span), FLOOR_SLAB (foundation patch), or RUBBLE (low scattered pile).
ruins.form.default=PILLAR
ruins.form.choices=PILLAR,WALL,ARCH,FLOOR_SLAB,RUBBLE
ruins.form.PILLAR.description=A broken vertical column. A square trunk (widthMin..widthMax footprint) rises to a randomized height then snaps off with a jagged crown, leaving a toppled stub. Use for ancient pillars and obelisk stumps.
ruins.form.WALL.description=A standing wall segment. A flat slab spanning lengthMin..lengthMax long and heightMin..heightMax tall, thickness widthMin..widthMax, punched through with noise-driven gaps and a ragged top edge. Use for collapsed building sides and fortifications.
ruins.form.ARCH.description=A freestanding arch. Two legs spaced by lengthMin..lengthMax joined at the top by a rasterized semicircular span (the lintel), so the structure literally arches. Use for gateways, aqueduct bays, and ruined doorways.
ruins.form.FLOOR_SLAB.description=A flat foundation patch. A single (or few) block-thick slab covering a widthMin..lengthMax footprint at ground level, heavily eroded into an irregular outline. Use for floor remnants, plazas, and building foundations.
ruins.form.RUBBLE.description=A low scattered debris pile. A noise blob of partial blocks mounded near the ground, tallest at the center and thinning toward the edges. Use for collapsed-structure rubble and scree.
ruins.heightMin.type=int
ruins.heightMin.description=Minimum structure height in blocks (PILLAR/WALL/ARCH height, slab thickness for FLOOR_SLAB, mound height for RUBBLE). Variants interpolate between this and heightMax.
ruins.heightMin.default=4
ruins.heightMin.minimum=1
ruins.heightMax.type=int
ruins.heightMax.description=Maximum structure height in blocks. Variants interpolate between heightMin and this so taller and shorter ruins coexist.
ruins.heightMax.default=9
ruins.heightMax.minimum=1
ruins.widthMin.type=int
ruins.widthMin.description=Minimum footprint width (X axis) in blocks: column/leg thickness for PILLAR/ARCH, wall thickness for WALL, slab width for FLOOR_SLAB, blob width for RUBBLE.
ruins.widthMin.default=1
ruins.widthMin.minimum=1
ruins.widthMax.type=int
ruins.widthMax.description=Maximum footprint width (X axis) in blocks. Variants interpolate between widthMin and this.
ruins.widthMax.default=3
ruins.widthMax.minimum=1
ruins.lengthMin.type=int
ruins.lengthMin.description=Minimum footprint length (Z axis) in blocks: wall run length, arch leg spacing, slab length, rubble blob length.
ruins.lengthMin.default=3
ruins.lengthMin.minimum=1
ruins.lengthMax.type=int
ruins.lengthMax.description=Maximum footprint length (Z axis) in blocks. Variants interpolate between lengthMin and this.
ruins.lengthMax.default=7
ruins.lengthMax.minimum=1
ruins.mossiness.type=double
ruins.mossiness.description=How much of the structure is replaced by weathered blocks (0 none, 1 nearly all). The replacement mask is value-noise driven and weighted so lower rows weather more than upper rows, mimicking moss climbing from the ground.
ruins.mossiness.default=0.45
ruins.mossiness.minimum=0
ruins.mossiness.maximum=1
ruins.weatheringScale.type=double
ruins.weatheringScale.description=The scale of the weathering noise. Higher values produce smaller, busier moss/crack patches; lower values produce broad continuous weathered zones.
ruins.weatheringScale.default=1.0
ruins.weatheringScale.minimum=0
ruins.weatheringScale.maximum=8
ruins.erosion.type=double
ruins.erosion.description=How crumbled the ruin is (0 intact, 1 mostly gone). Blocks whose value-noise falls below this threshold are deleted, so the shape reads as collapsed. Structural integrity is preserved: the bottom row and core legs are never eroded away.
ruins.erosion.default=0.25
ruins.erosion.minimum=0
ruins.erosion.maximum=1
ruins.erosionScale.type=double
ruins.erosionScale.description=The scale of the erosion noise. Higher values knock out small speckled holes; lower values carve larger missing chunks out of the silhouette.
ruins.erosionScale.default=1.5
ruins.erosionScale.minimum=0
ruins.erosionScale.maximum=8
ruins.buriedFraction.type=double
ruins.buriedFraction.description=How far the structure extends below the surface as a fraction of its height (0 sits fully on top, 1 sinks it a full height into the ground). The buried rows live at negative y so the ruin reads as settled and partly swallowed by the terrain.
ruins.buriedFraction.default=0.2
ruins.buriedFraction.minimum=0
ruins.buriedFraction.maximum=1
formations.fields=form,strataThickness,heightMin,heightMax,baseWidthMin,baseWidthMax,topWidth,profile,profileWaist,profileWaistFloor,lean,leanAzimuth,roughness,jitter,hoodooCapRadius,hoodooCapHeight,archSpan,archThickness,archAsymmetry,basaltColumns,basaltColumnRadius,basaltHeightVariance,icebergPeaks,fractureCount,fractureSeparation,spiralTurns,spiralRadius,spiralThickness,overhangReach,overhangDrop,roomHeightFraction
formations.form.type=IrisFormationForm
formations.form.description=The overall silhouette of the formation. Drives which sculpting routine the generator uses.
formations.form.default=SPIRE
formations.form.choices=SPIRE,HOODOO,ARCH,SEA_STACK,BOULDER,BASALT_COLUMN,ICEBERG,FISSURE,SPIRAL,OVERHANG
formations.form.SPIRE.description=A tall, slender needle of rock that tapers smoothly to a point at the top (a sharp pinnacle or stone spire).
formations.form.HOODOO.description=A column with a pinched, eroded waist and a wide overhanging caprock balanced on top (the classic desert hoodoo / mushroom rock).
formations.form.ARCH.description=Two stout legs joined by a spanning curved bridge of rock overhead (a natural stone arch).
formations.form.SEA_STACK.description=A chunky, blocky stack that tapers gently as it rises, like an isolated pillar of rock standing in water (a sea stack).
formations.form.BOULDER.description=A rounded, lumpy boulder formed from a noise-perturbed ellipsoid that sits low on the terrain.
formations.form.BASALT_COLUMN.description=A tightly packed cluster of several vertical, near-hexagonal columns of varying height (a basalt column formation / giant's causeway).
formations.form.ICEBERG.description=A broad, faceted mound crowned by several irregular tapered peaks, suitable for icebergs and glacial outcrops.
formations.form.FISSURE.description=Several separated, outward-leaning shards divided by open cracks.
formations.form.SPIRAL.description=A tapered tube swept around a tightening helix, leaving open air through its curled center.
formations.form.OVERHANG.description=A grounded pillar that bends into a long hooked cantilever and curls downward at its tip.
formations.strataThickness.type=int
formations.strataThickness.description=The thickness in blocks of each horizontal strata band when strataPalette is set.
formations.strataThickness.default=3
formations.strataThickness.minimum=1
formations.strataThickness.maximum=32
formations.heightMin.type=int
formations.heightMin.description=Minimum total height of the formation in blocks.
formations.heightMin.default=14
formations.heightMin.minimum=1
formations.heightMax.type=int
formations.heightMax.description=Maximum total height of the formation in blocks.
formations.heightMax.default=26
formations.heightMax.minimum=1
formations.baseWidthMin.type=int
formations.baseWidthMin.description=Minimum base radius (half-width) of the formation in blocks.
formations.baseWidthMin.default=3
formations.baseWidthMin.minimum=1
formations.baseWidthMax.type=int
formations.baseWidthMax.description=Maximum base radius (half-width) of the formation in blocks.
formations.baseWidthMax.default=6
formations.baseWidthMax.minimum=1
formations.topWidth.type=int
formations.topWidth.description=The target radius (half-width) at the very top of the formation in blocks, before the profile is applied. 0 means taper to a point.
formations.topWidth.default=0
formations.topWidth.minimum=0
formations.profile.type=IrisFormationProfile
formations.profile.description=The function used to shape the formation radius over its height.
formations.profile.default=TAPER
formations.profile.choices=CONSTANT,LINEAR,TAPER,PARABOLIC,BULGE
formations.profile.CONSTANT.description=Same radius at every height (a straight cylinder of constant baseWidth).
formations.profile.LINEAR.description=Radius ramps straight from baseWidth at the bottom to topWidth at the top.
formations.profile.TAPER.description=Radius shrinks smoothly toward a point as height increases (an ease that drives the SPIRE needle and gentle SEA_STACK taper).
formations.profile.PARABOLIC.description=Radius pinches to a narrow waist near profileWaist then widens again toward the top (the eroded waist used by HOODOO columns).
formations.profile.BULGE.description=Radius bulges out to its maximum in the middle of the height range and narrows at both ends (a barrel / bulged column).
formations.profileWaist.type=double
formations.profileWaist.description=The normalized height (0 base, 1 top) of the pinched waist for the PARABOLIC profile (used by HOODOO).
formations.profileWaist.default=0.55
formations.profileWaist.minimum=0
formations.profileWaist.maximum=1
formations.profileWaistFloor.type=double
formations.profileWaistFloor.description=The minimum radius fraction at the waist for the PARABOLIC profile. Lower values pinch the waist tighter.
formations.profileWaistFloor.default=0.35
formations.profileWaistFloor.minimum=0
formations.profileWaistFloor.maximum=1
formations.lean.type=double
formations.lean.description=How far the formation leans, in degrees from vertical. 0 is perfectly upright. The whole body is sheared by this amount over its height.
formations.lean.default=0
formations.lean.minimum=0
formations.leanAzimuth.type=double
formations.leanAzimuth.description=Compass direction in degrees the formation leans toward when lean is non-zero.
formations.leanAzimuth.default=0
formations.roughness.type=double
formations.roughness.description=Surface roughness from 0 (a clean smooth solid) to 1 (heavily eroded and pitted). Driven by 3D value noise that perturbs the radius so the formation never reads as a clean cylinder.
formations.roughness.default=0.3
formations.roughness.minimum=0
formations.roughness.maximum=1
formations.jitter.type=double
formations.jitter.description=Per-block surface jitter from 0 (none) to 1 (maximum). Randomly carves and adds isolated edge blocks to break up the silhouette.
formations.jitter.default=0.15
formations.jitter.minimum=0
formations.jitter.maximum=1
formations.hoodooCapRadius.type=int
formations.hoodooCapRadius.description=Extra wide cap radius in blocks added on top for the HOODOO form, producing the overhanging mushroom caprock. 0 disables the overhang.
formations.hoodooCapRadius.default=3
formations.hoodooCapRadius.minimum=0
formations.hoodooCapHeight.type=int
formations.hoodooCapHeight.description=The height in blocks of the HOODOO overhanging caprock slab.
formations.hoodooCapHeight.default=3
formations.hoodooCapHeight.minimum=1
formations.hoodooCapHeight.maximum=6
formations.archSpan.type=int
formations.archSpan.description=How wide the ARCH opening is in blocks (the gap between the two legs). The arch span is rasterized over this width.
formations.archSpan.default=10
formations.archSpan.minimum=0
