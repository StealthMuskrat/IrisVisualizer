fungi.capShape.type=IrisFungusCapShape
fungi.capShape.description=The silhouette of the cap (dome, flat umbrella, funnel, cone, or wide shallow slab).
fungi.capShape.default=DOME
fungi.capShape.choices=DOME,FLAT,FUNNEL,CONICAL,FLAT_WIDE
fungi.capShape.DOME.description=A rounded hemisphere cap that bulges up and curls slightly under at the rim, the classic red toadstool dome.
fungi.capShape.FLAT.description=A wide, nearly flat umbrella that holds its full radius almost to the edge before dropping, the brown-mushroom plate look.
fungi.capShape.FUNNEL.description=An upturned bowl whose rim lifts higher than its center, cupping upward like a chanterelle or funnel mushroom.
fungi.capShape.CONICAL.description=A tall pointed cone that tapers from a broad base to a sharp apex, the witch-hat parasol silhouette.
fungi.capShape.FLAT_WIDE.description=A very wide but shallow slab, a low overhanging shelf-like roof that spreads far past the stem with minimal vertical rise.
fungi.capRadiusMin.type=int
fungi.capRadiusMin.description=Minimum cap radius in blocks (measured from the cap center to its rim).
fungi.capRadiusMin.default=3
fungi.capRadiusMin.minimum=1
fungi.capRadiusMax.type=int
fungi.capRadiusMax.description=Maximum cap radius in blocks (measured from the cap center to its rim).
fungi.capRadiusMax.default=5
fungi.capRadiusMax.minimum=1
fungi.capThickness.type=int
fungi.capThickness.description=How many blocks thick the cap shell is. 1 is a thin skin, 3 is a fleshy slab.
fungi.capThickness.default=1
fungi.capThickness.minimum=1
fungi.capThickness.maximum=3
fungi.capSquish.type=double
fungi.capSquish.description=Vertical flatten factor for the cap. 0 leaves the cap at full height, 1 squashes it flat into a disc.
fungi.capSquish.default=0.4
fungi.capSquish.minimum=0
fungi.capSquish.maximum=1
fungi.capDroop.type=double
fungi.capDroop.description=How far the cap rim droops downward, in degrees, curling the edge of the cap toward the ground.
fungi.capDroop.default=20
fungi.capDroop.minimum=0
fungi.capOverhang.type=double
fungi.capOverhang.description=How far the cap radius extends past the stem before the rim begins, in blocks. Larger values make the cap overhang the stem more.
fungi.capOverhang.default=2
fungi.capOverhang.minimum=0
fungi.gillChance.type=double
fungi.gillChance.description=The fraction of underside cap blocks replaced by the gill block when a gill block or palette is set.
fungi.gillChance.default=0.85
fungi.gillChance.minimum=0
fungi.gillChance.maximum=1
fungi.spotChance.type=double
fungi.spotChance.description=The fraction of top cap blocks replaced by the spot block, selected by value noise so spots cluster naturally.
fungi.spotChance.default=0.18
fungi.spotChance.minimum=0
fungi.spotChance.maximum=1
fungi.shelf.type=boolean
fungi.shelf.description=If true, generate a bracket / shelf fungus instead of an upright mushroom: a small flat fan that grows sideways off a very short or absent stem, like a polypore clinging to a trunk.
fungi.shelf.default=false
fungi.shelfRadius.type=int
fungi.shelfRadius.description=The radius in blocks of the sideways fan when shelf is true.
fungi.shelfRadius.default=3
fungi.shelfRadius.minimum=1
crystals.fields=growthSurface,tipChance,glow,baseRadius,baseNoise,shardCountMin,shardCountMax,shardLengthMin,shardLengthMax,shardBaseRadius,shardTaper,spreadAngle,distribution,jitter
crystals.growthSurface.type=IrisCrystalSurface
crystals.growthSurface.description=The surface this crystal grows from (FLOOR shards up, CEILING shards down, WALL shards outward). This orients the baked geometry only.
crystals.growthSurface.default=FLOOR
crystals.growthSurface.choices=FLOOR,CEILING,WALL
crystals.growthSurface.FLOOR.description=Grows from a cave floor. The budding base sits at the bottom and the shards point upward, fanning within the spread cone around the up axis. Built with positive py so the cluster grows up from the base layer.
crystals.growthSurface.CEILING.description=Grows from a cave ceiling. The budding base sits at the top and the shards point downward like stalactites, fanning within the spread cone around the down axis. Built with negative py so the cluster grows down from the ceiling.
crystals.growthSurface.WALL.description=Grows from a cave wall. The budding base hugs the wall and the shards point outward and slightly upward, fanning within the spread cone around a tilted normal so the cluster reads as a wall sconce of shards.
crystals.tipChance.type=double
crystals.tipChance.description=The chance per shard that its very tip is replaced by the tip block (or glow block).
crystals.tipChance.default=0.6
crystals.tipChance.minimum=0
crystals.tipChance.maximum=1
crystals.glow.type=boolean
crystals.glow.description=If true and no tipBlock/tipPalette is set, sprinkle a light-emitting block (the glowBlock) among the shard tips for a sparkling geode.
crystals.glow.default=false
crystals.baseRadius.type=double
crystals.baseRadius.description=Radius in blocks of the budding base blob the shards radiate from. 0 places no base blob (shards spring from a single point).
crystals.baseRadius.default=1.6
crystals.baseRadius.minimum=0
crystals.baseNoise.type=double
crystals.baseNoise.description=How strongly value noise perturbs the surface of the base blob, for a lumpy organic budding base rather than a clean sphere.
crystals.baseNoise.default=0.35
crystals.baseNoise.minimum=0
crystals.baseNoise.maximum=1
crystals.shardCountMin.type=int
crystals.shardCountMin.description=Minimum number of shards radiating from the base.
crystals.shardCountMin.default=5
crystals.shardCountMin.minimum=1
crystals.shardCountMax.type=int
crystals.shardCountMax.description=Maximum number of shards radiating from the base.
crystals.shardCountMax.default=11
crystals.shardCountMax.minimum=1
crystals.shardLengthMin.type=int
crystals.shardLengthMin.description=Minimum length in blocks of a shard, measured from the base out to its pointed tip.
crystals.shardLengthMin.default=3
crystals.shardLengthMin.minimum=1
crystals.shardLengthMax.type=int
crystals.shardLengthMax.description=Maximum length in blocks of a shard, measured from the base out to its pointed tip.
crystals.shardLengthMax.default=8
crystals.shardLengthMax.minimum=1
crystals.shardBaseRadius.type=double
crystals.shardBaseRadius.description=Starting radius in blocks of a shard at its thick base end. The shard tapers from this down to a single block at the tip.
crystals.shardBaseRadius.default=1.4
crystals.shardBaseRadius.minimum=0.5
crystals.shardTaper.type=double
crystals.shardTaper.description=How aggressively each shard narrows from base to tip. 0 keeps a near-constant column; 1 tapers fully to a sharp point at the very tip. Each shard always ends in a single pointed block.
crystals.shardTaper.default=0.85
crystals.shardTaper.minimum=0
crystals.shardTaper.maximum=1
crystals.spreadAngle.type=double
crystals.spreadAngle.description=The half-angle in degrees of the cone the shards fan within around the surface normal. 0 makes all shards parallel to the normal; larger values splay them outward into a starburst.
crystals.spreadAngle.default=45
crystals.spreadAngle.minimum=0
crystals.spreadAngle.maximum=90
crystals.distribution.type=IrisCrystalDistribution
crystals.distribution.description=How the shard azimuths are distributed around the normal (RANDOM for a chaotic clump, GOLDEN_ANGLE for an evenly spaced rosette).
crystals.distribution.default=GOLDEN_ANGLE
crystals.distribution.choices=RANDOM,GOLDEN_ANGLE
crystals.distribution.RANDOM.description=Each shard gets a uniformly random azimuth around the normal. Produces a chaotic, naturally clumped cluster.
crystals.distribution.GOLDEN_ANGLE.description=Each shard's azimuth advances by the golden angle (~137.5 degrees) from the previous one. Produces an evenly spaced sunflower-like fan with no two shards overlapping, ideal for a geode rosette.
crystals.jitter.type=double
crystals.jitter.description=Per-shard angular randomness (0-1) added on top of the chosen distribution so the cluster never looks mechanically regular. 0 is perfectly distributed; 1 is heavily jittered.
crystals.jitter.default=0.25
crystals.jitter.minimum=0
crystals.jitter.maximum=1
