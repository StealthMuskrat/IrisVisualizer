dimensionOptions.description=Define options for this dimension
environment.description=The world environment
environment.default=NORMAL
fullbright.description=When true, sets the dimension's ambient light to maximum, making all blocks fully lit regardless of light level.
fullbright.default=false
coordinateScale.description=The multiplier applied to coordinates when leaving the dimension. Value between 0.00001 and 30000000.0 (both inclusive).
coordinateScale.default=-1
coordinateScale.minimum=0.00001
coordinateScale.maximum=30000000
ambientLight.description=How much light the dimension has. When set to 0, it completely follows the light level; when set to 1, there is no ambient lighting.
ambientLight.default=-1
ambientLight.minimum=0
ambientLight.maximum=1
fixedTime.description=If this is set to an int, the time of the day is the specified value. To ensure a normal time cycle, set it to null.
fixedTime.default=-1
fixedTime.minimum=0
fixedTime.maximum=9223372036854775807
cloudHeight.description=Optional value between -2032 and 2031. If set, determines the lower edge of the clouds. If set to null, clouds are disabled in the dimension.
cloudHeight.default=-1
cloudHeight.minimum=-2032
cloudHeight.maximum=2031
monsterSpawnBlockLightLimit.description=Value between 0 and 15 (both inclusive). Maximum block light required when the monster spawns.
monsterSpawnBlockLightLimit.default=-1
monsterSpawnBlockLightLimit.minimum=0
monsterSpawnBlockLightLimit.maximum=15
ultrawarm.description=Whether the dimensions behaves like the nether (water evaporates and sponges dry) or not. Also lets stalactites drip lava and causes lava to spread faster and thinner.
ultrawarm.default=DEFAULT
natural.description=When false, compasses spin randomly, and using a bed to set the respawn point or sleep, is disabled. When true, nether portals can spawn zombified piglins, and creaking hearts can spawn creakings.
natural.default=DEFAULT
piglinSafe.description=When false, Piglins and hoglins shake and transform to zombified entities.
piglinSafe.default=DEFAULT
respawnAnchorWorks.description=When false, the respawn anchor blows up when trying to set spawn point.
respawnAnchorWorks.default=DEFAULT
bedWorks.description=When false, the bed blows up when trying to sleep.
bedWorks.default=DEFAULT
raids.description=Whether players with the Bad Omen effect can cause a raid.
raids.default=DEFAULT
skylight.description=Whether the dimension has skylight or not.
skylight.default=DEFAULT
ceiling.description=Whether the dimension has a bedrock ceiling. Note that this is only a logical ceiling. It is unrelated with whether the dimension really has a block ceiling.
ceiling.default=DEFAULT
