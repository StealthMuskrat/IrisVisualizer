engineStreamValue.choices=SLOPE,NATURAL_HEIGHT,HEIGHT,HEIGHT_OR_FLUID,OVERLAY_NOISE,REGION_STYLE,REGION_IDENTITY,RIVER_DISTANCE,RIVER_FLOW,RIVER_CARVE_WEIGHT,RIVER_WATER_SURFACE
engineStreamValue.SLOPE.description=Represents the given slope at the x, z coordinates
engineStreamValue.NATURAL_HEIGHT.description=Represents terrain height before river incision and river biome replacement.
engineStreamValue.HEIGHT.description=Represents the base generator height at the given position. This includes only the biome generators / interpolation and noise features but does not include carving, caves.
engineStreamValue.HEIGHT_OR_FLUID.description=Represents the base generator height at the given position. This includes only the biome generators / interpolation and noise features but does not include carving, caves. with Max(height, fluidHeight).
engineStreamValue.OVERLAY_NOISE.description=Represents the overlay noise generators summed (dimension setting)
engineStreamValue.REGION_STYLE.description=Represents the noise style of regions
engineStreamValue.REGION_IDENTITY.description=Represents the identity of regions. Each region has a unique number (very large numbers)
engineStreamValue.RIVER_DISTANCE.description=Represents block distance from the nearest active river centerline.
engineStreamValue.RIVER_FLOW.description=Represents the merged upstream flow carried by the active river reach.
engineStreamValue.RIVER_CARVE_WEIGHT.description=Represents the normalized river terrain-incision weight.
engineStreamValue.RIVER_WATER_SURFACE.description=Represents the solved river water-surface height.
engineValue.choices=ENGINE_HEIGHT,ENGINE_MIN_HEIGHT,ENGINE_MAX_HEIGHT,FLUID_HEIGHT
engineValue.ENGINE_HEIGHT.description=Represents actual height of the engine
engineValue.ENGINE_MIN_HEIGHT.description=Represents virtual bottom of the engine in the compound. If this engine is on top of another engine, it's min height would be at the maxHeight of the previous engine + 1
engineValue.ENGINE_MAX_HEIGHT.description=Represents virtual top of the engine in the compound. If this engine is below another engine, it's max height would be at the minHeight of the next engine - 1
engineValue.FLUID_HEIGHT.description=The fluid height defined in the dimension file
