palette.description=The ore blocks to place. An empty palette generates nothing, so this must be set for the generator to have any effect.
chanceStyle.description=The noise style sampled per block to decide where ore appears. STATIC gives independent random speckle; smoother styles give veiny clusters.
generateSurface.description=When true this generator also replaces surface-layer blocks (it runs before layers and fluid); when false it only replaces underground rock.
threshold.description=Noise cutoff: a block becomes ore when the sampled noise is at or below this value, so higher means more ore. 0 disables, 1 replaces everything in range.
range.description=Vertical band (min, max) this ore can generate in, in engine-local Y where 0 is the bottom of the dimension, not world Y.
