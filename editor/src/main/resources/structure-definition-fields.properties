placeMode.description=The place mode used when stamping each piece object into the world.
placeMode.default=STRUCTURE_PIECE
placeMode.type=ObjectPlaceMode
mode.choices=PLANAR_JIGSAW,SPATIAL_JIGSAW
mode.PLANAR_JIGSAW.description=A cell-aligned planar jigsaw intended for villages, paths, and other two-dimensional layouts.
mode.SPATIAL_JIGSAW.description=A freeform spatial connector graph intended for multi-level and three-dimensional structures.
compatibility.choices=IRIS_EXTENDED,VANILLA_PORTABLE
compatibility.IRIS_EXTENDED.description=Allows Iris-specific connector metadata and placement behavior.
compatibility.VANILLA_PORTABLE.description=Restricts the graph to metadata that can be represented by vanilla jigsaw resources.
branchFailurePolicy.choices=FAIL_ASSEMBLY,TERMINATE_BRANCH
branchFailurePolicy.FAIL_ASSEMBLY.description=Fails the complete assembly when an optional connector branch cannot attach before the maximum depth.
branchFailurePolicy.TERMINATE_BRANCH.description=Ends only the unresolved optional connector branch, matching vanilla jigsaw placement behavior.
placeMode.choices=CENTER_HEIGHT,MAX_HEIGHT,FAST_MAX_HEIGHT,MIN_HEIGHT,FAST_MIN_HEIGHT,STILT,FAST_STILT,MIN_STILT,FAST_MIN_STILT,CENTER_STILT,ERODE_STILT,ORGANIC_STILT,CEILING_HANG,VACUUM,VACUUM_HIGH,VACUUM_FAST,VACUUM_ORGANIC,VACUUM_WAVY,PAINT,FLOATING,STRUCTURE_PIECE
placeMode.CENTER_HEIGHT.description=The default place mode. This mode picks a center point (where the center of the object will be) and takes the height. That height is used for the whole object.
placeMode.MAX_HEIGHT.description=Samples a lot of points where the object will cover (horizontally) and picks the highest height, that height is then used to place the object. This mode is useful for preventing any part of your object from being buried though it will float off of cliffs.
placeMode.FAST_MAX_HEIGHT.description=Samples only 4 points where the object will cover (horizontally) and picks the highest height, that height is then used to place the object. This mode is useful for preventing any part of your object from being buried though it will float off of cliffs.\"
placeMode.MIN_HEIGHT.description=Samples a lot of points where the object will cover (horizontally) and picks the lowest height, that height is then used to place the object. This mode is useful for preventing any part of your object from overhanging a cliff though it gets buried a lot
placeMode.FAST_MIN_HEIGHT.description=Samples only 4 points where the object will cover (horizontally) and picks the lowest height, that height is then used to place the object. This mode is useful for preventing any part of your object from overhanging a cliff though it gets buried a lot
placeMode.STILT.description=Stilting is MAX_HEIGHT but it repeats the bottom most block of your object until it hits the surface. This is expensive because it has to first sample every height value for each x,z position of your object. Avoid using this unless its structures for performance reasons.
placeMode.FAST_STILT.description=Just like stilting but very inaccurate. Useful for stilting a lot of objects without too much care on accuracy (you can use the over-stilt value to force stilts under ground further)
placeMode.MIN_STILT.description=Stilting is MIN_HEIGHT but it repeats the bottom most block of your object until it hits the surface. This is expensive because it has to first sample every height value for each x,z position of your object. Avoid using this unless its structures for performance reasons.
placeMode.FAST_MIN_STILT.description=Just like MIN_STILT but very inaccurate. Useful for stilting a lot of objects without too much care on accuracy (you can use the over-stilt value to force stilts under ground further)
placeMode.CENTER_STILT.description=Stilting is CENTER_HEIGHT but it repeats the bottom most block of your object until it hits the surface. This is expensive because it has to first sample every height value for each x,z position of your object. Avoid using this unless its structures for performance reasons.
placeMode.ERODE_STILT.description=Erode stilting tapers columns downward like an ice cream cone. Blocks near the center extend deepest while edge blocks drop off first. Blocks are randomly skipped in the lower portion for a rough organic eroded texture.
placeMode.ORGANIC_STILT.description=Organic stilting scans straight down from the bottom of the object to the first solid block (the cave floor, or terrain) and fills the gap with the object's own bottom block. Each column stops at a slightly different, noise-varied depth and the lower portion is randomly broken up, so the underside reads as rough organic roots rather than a flat disc. Designed for objects placed inside caves so they connect to the floor instead of floating. Tune with stilt-settings (organicMaxScan, organicJitter, organicScratch).
placeMode.CEILING_HANG.description=Hangs the object upside-down from a cave ceiling. The object is flipped vertically (its tip points down like a stalactite) and its top is anchored to the ceiling, while an organic, noise-varied stilt grows up into the ceiling so it never floats below the roof. Use inside caves; tune with stilt-settings (organicMaxScan, organicJitter, organicScratch).
placeMode.VACUUM.description=Anchors the object at the terrain surface (plus translate.y) like CENTER_HEIGHT, then bends the surrounding terrain to be flush with the object's base. Columns inside the object footprint are raised (or lowered) to meet the base, and the deformation falls off parabolically out to a radius so the terrain smoothly blends back to its natural height. Use this to seat a floating/translated object on the ground without a flat stilt disc, e.g. a cube translated up 10 on a mountain pulls the terrain up to meet it. Tune with vacuum-settings (radius, falloff).
placeMode.VACUUM_HIGH.description=VACUUM with a larger radius and finer per-column sampling for the smoothest terrain blend. More expensive.
placeMode.VACUUM_FAST.description=VACUUM with a smaller radius and coarser sampling for performance. Use when seating many objects.
placeMode.VACUUM_ORGANIC.description=VACUUM whose falloff radius is perturbed by noise per column, so the terrain meets the object with an irregular organic edge rather than a clean parabolic bowl.
placeMode.VACUUM_WAVY.description=VACUUM whose terrain bend is bent by smooth coherent simplex noise so the surface meets the object with a gently rolling, wavy slope instead of the ragged white-noise edge of VACUUM_ORGANIC or a clean parabolic bowl. The object itself still seats flush; the waves fade to zero under the object and at the outer rim, peaking across the mid-slope. Tune with vacuum-settings (waveAmplitude, waveScale).
placeMode.PAINT.description=Samples the height of the terrain at every x,z position of your object and pushes it down to the surface. It's pretty much like a melt function over the terrain.
placeMode.FLOATING.description=Places the object in pure air at an absolute Y driven entirely by translate.y (plus optional translate.yRandom). Terrain height, underwater, and carving anchor checks are skipped. Use this for floating islands, sky structures, clouds, or blimps where the object must not be translated to the ground.
placeMode.STRUCTURE_PIECE.description=Raw stamp at the caller-supplied (x, y, z). No terrain sampling, no stilting, no Y recomputation, no underwater or carving anchor guards. Used internally to route native Minecraft structure pieces (villages etc.) through the Iris object placer.
