minHeight.type=int
minHeight.description=The inclusive minimum origin height in engine-local Y, where 0 is the bottom of the dimension. Negative values let an unclipped vanilla distribution taper into the world floor.
minHeight.default=1
minHeight.minimum=-8192
minHeight.maximum=8192
maxHeight.type=int
maxHeight.description=The inclusive maximum origin height in engine-local Y, where 0 is the bottom of the dimension.
maxHeight.default=75
maxHeight.minimum=-8192
maxHeight.maximum=8192
heightDistribution.type=IrisDepositHeightDistribution
heightDistribution.description=How origin heights are sampled. CLIPPED_UNIFORM preserves Iris behavior by clipping the band to terrain; UNIFORM and TRIANGLE sample the authored band first and discard cells outside terrain or build height.
heightDistribution.default=CLIPPED_UNIFORM
placementScope.type=IrisDepositPlacementScope
placementScope.description=TERRAIN places below the generated surface. ABOVE_TERRAIN places only in existing solid hosts above it. FULL_HEIGHT permits existing solid hosts anywhere in the dimension.
placementScope.default=TERRAIN
surfaceClearance.type=int
surfaceClearance.description=Solid blocks kept between a deposit and the terrain surface. Vanilla-like deposits use 0; the Iris default remains 7.
surfaceClearance.default=7
surfaceClearance.minimum=0
surfaceClearance.maximum=256
minSize.type=int
minSize.description=The minimum Iris block count or vanilla configured vein size, selected according to shape.
minSize.default=0
minSize.minimum=0
minSize.maximum=8192
maxSize.type=int
maxSize.description=The maximum Iris block count or vanilla configured vein size, selected according to shape.
maxSize.default=128
maxSize.minimum=0
maxSize.maximum=8192
shape.type=IrisDepositShape
shape.description=IRIS places a fixed-count cube clump. VANILLA_ELLIPSOID uses Minecraft's chained ellipsoid geometry. VANILLA_SCATTERED uses Minecraft's sparse candidate offsets.
shape.default=IRIS
maxPerChunk.type=int
maxPerChunk.description=The maximum amount of clumps per chunk
maxPerChunk.default=3
maxPerChunk.minimum=0
maxPerChunk.maximum=2048
minPerChunk.type=int
minPerChunk.description=The minimum amount of clumps per chunk
minPerChunk.default=0
minPerChunk.minimum=0
minPerChunk.maximum=2048
spawnChance.type=double
spawnChance.description=The chance of the deposit spawning in a chunk
spawnChance.default=1
spawnChance.minimum=0
spawnChance.maximum=1
perClumpSpawnChance.type=double
perClumpSpawnChance.description=The chance of each individual clump spawning in a chunk
perClumpSpawnChance.default=1
perClumpSpawnChance.minimum=0
perClumpSpawnChance.maximum=1
discardChanceOnAirExposure.type=double
discardChanceOnAirExposure.description=Chance to discard a candidate ore block when it touches air. This matches vanilla ore exposure reduction.
discardChanceOnAirExposure.default=0
discardChanceOnAirExposure.minimum=0
discardChanceOnAirExposure.maximum=1
palette.type=KList<IrisBlockData>
palette.description=The palette of blocks to be used in this deposit generator. Each entry is picked uniformly; the per-entry weight field is ignored here.
palette.default=[]
varience.type=int
varience.description=Ore varience is how many different objects clumps iris will create
varience.default=3
varience.minimum=1
varience.maximum=64
replaceableBlocks.type=KList<String>
replaceableBlocks.description=Optional block ids this deposit may replace. An empty list retains Iris's any-solid behavior.
replaceableBlocks.default=[]
surfaceReplaceableBlocks.type=KList<String>
surfaceReplaceableBlocks.description=Optional exact host block ids required when an ore candidate occupies an exterior terrain surface. Cave-air walls are unaffected. An empty list retains the normal replaceableBlocks behavior.
surfaceReplaceableBlocks.default=[]
biomeScope.type=IrisDepositBiomeScope
biomeScope.description=Chooses whether includedBiomes and excludedBiomes inspect the surface biome or the cave biome at the deposit origin.
biomeScope.default=CAVE
includedBiomes.type=KList<String>
includedBiomes.description=Optional Iris biome keys or vanilla derivative ids allowed for this deposit.
includedBiomes.default=[]
excludedBiomes.type=KList<String>
excludedBiomes.description=Optional Iris biome keys or vanilla derivative ids denied for this deposit.
excludedBiomes.default=[]
replaceBedrock.type=boolean
replaceBedrock.description=If set to true, this deposit will replace bedrock
replaceBedrock.default=false
shape.choices=IRIS,VANILLA_ELLIPSOID,VANILLA_SCATTERED
shape.IRIS.description=Builds the traditional Iris fixed-block-count cube clump.
shape.VANILLA_ELLIPSOID.description=Builds a chain of overlapping ellipsoids matching Minecraft's ordinary ore-vein geometry.
shape.VANILLA_SCATTERED.description=Builds sparse candidate offsets matching Minecraft's scattered-ore geometry.
heightDistribution.choices=CLIPPED_UNIFORM,UNIFORM,TRIANGLE
heightDistribution.CLIPPED_UNIFORM.description=Samples uniformly after clipping the configured band to the terrain and build-height bounds.
heightDistribution.UNIFORM.description=Samples uniformly from the configured band, then rejects origins outside the terrain or build-height bounds.
heightDistribution.TRIANGLE.description=Samples toward the middle of the configured band with a triangular distribution, then rejects invalid origins.
placementScope.choices=TERRAIN,ABOVE_TERRAIN,FULL_HEIGHT
placementScope.TERRAIN.description=Places in solid terrain below the generated surface while preserving the configured surface clearance.
placementScope.ABOVE_TERRAIN.description=Places only in existing solid hosts above the generated terrain surface.
placementScope.FULL_HEIGHT.description=Places in existing solid hosts anywhere within the dimension build height.
biomeScope.choices=SURFACE,CAVE
biomeScope.SURFACE.description=Checks the surface biome selected for the deposit column.
biomeScope.CAVE.description=Checks the cave biome selected at the deposit origin.
palette.policy=uniformEntries
dispatch.policy=dimensionRegionBiomeAdditive
height.policy=inclusiveLocalY
surface.policy=oreOnlyBiomeOverride
