derivative.description=The raw derivative of this biome. This is required or the terrain will not properly generate. Use any vanilla biome type. Look in examples/biome-list.txt
derivative.default=minecraft:the_void
vanillaDerivative.description=Override the derivative used for vanilla structure selection. Iris still enforces the generated terrain role: land-only Minecraft derivatives on sea biomes expose no native structure biome, and land-only derivatives on shore biomes resolve as beach, while exact ocean, river, beach, and shore variants remain eligible. Non-Minecraft namespaces remain authoritative. Not defining this value selects derivative.
vanillaDerivative.default=null
biomeScatter.description=You can instead specify multiple biome derivatives to randomly scatter colors in this biome
biomeScatter.default=[]
biomeScatter.minimumEntries=1
biomeSkyScatter.description=Since 1.13 supports 3D biomes, you can add different derivative colors for anything above the terrain. (Think swampy tree leaves with a desert looking grass surface)
biomeSkyScatter.default=[]
biomeSkyScatter.minimumEntries=1
