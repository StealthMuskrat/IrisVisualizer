NONE.description=No interpolation. Nearest Neighbor (bad for terrain, great for performance).
BILINEAR.description=Uses 4 nearby points in a square to calculate a 2d slope. Very fast but creates square artifacts. See: https://en.wikipedia.org/wiki/Bilinear_interpolation
STARCAST_3.description=Starcast is Iris's own creation. It uses raytrace checks to find a horizontal boundary nearby. 3 Checks in a circle. Typically starcast is used with another interpolation method. See BILINEAR_STARCAST_9 For example. Starcast is meant to 'break up' large, abrupt cliffs to make cheap interpolation smoother.
STARCAST_6.description=Starcast is Iris's own creation. It uses raytrace checks to find a horizontal boundary nearby. 6 Checks in a circle. Typically starcast is used with another interpolation method. See BILINEAR_STARCAST_9 For example. Starcast is meant to 'break up' large, abrupt cliffs to make cheap interpolation smoother.
STARCAST_9.description=Starcast is Iris's own creation. It uses raytrace checks to find a horizontal boundary nearby. 9 Checks in a circle. Typically starcast is used with another interpolation method. See BILINEAR_STARCAST_9 For example. Starcast is meant to 'break up' large, abrupt cliffs to make cheap interpolation smoother.
STARCAST_12.description=Starcast is Iris's own creation. It uses raytrace checks to find a horizontal boundary nearby. 12 Checks in a circle. Typically starcast is used with another interpolation method. See BILINEAR_STARCAST_9 For example. Starcast is meant to 'break up' large, abrupt cliffs to make cheap interpolation smoother.
BILINEAR_STARCAST_3.description=Uses starcast to break up the abrupt sharp cliffs, then smooths the rest out with bilinear.
BILINEAR_STARCAST_6.description=Uses starcast to break up the abrupt sharp cliffs, then smooths the rest out with bilinear.
BILINEAR_STARCAST_9.description=Uses starcast to break up the abrupt sharp cliffs, then smooths the rest out with bilinear.
BILINEAR_STARCAST_12.description=Uses starcast to break up the abrupt sharp cliffs, then smooths the rest out with bilinear.
HERMITE_STARCAST_3.description=Uses starcast to break up the abrupt sharp cliffs, then smooths the rest out with hermite.
HERMITE_STARCAST_6.description=Uses starcast to break up the abrupt sharp cliffs, then smooths the rest out with hermite.
HERMITE_STARCAST_9.description=Uses starcast to break up the abrupt sharp cliffs, then smooths the rest out with hermite.
HERMITE_STARCAST_12.description=Uses starcast to break up the abrupt sharp cliffs, then smooths the rest out with hermite.
BILINEAR_BEZIER.description=Uses bilinear but on a bezier curve. See: https://en.wikipedia.org/wiki/Bezier_curve
BILINEAR_PARAMETRIC_2.description=Uses Bilinear but with parametric curves alpha 2.
BILINEAR_PARAMETRIC_4.description=Uses Bilinear but with parametric curves alpha 4.
BILINEAR_PARAMETRIC_1_5.description=Uses Bilinear but with parametric curves alpha 1.5.
BICUBIC.description=Bicubic noise creates 4, 4-point splines for a total of 16 checks. Bcubic can go higher than expected and lower than expected right before a large change in slope.
HERMITE.description=Hermite is similar to bicubic, but faster and it can be tuned a little bit
CATMULL_ROM_SPLINE.description=Essentially bicubic with zero tension
HERMITE_TENSE.description=Essentially bicubic with max tension
HERMITE_LOOSE.description=Hermite is similar to bicubic, this variant reduces the dimple artifacts of bicubic
HERMITE_LOOSE_HALF_POSITIVE_BIAS.description=Hermite is similar to bicubic, this variant reduces the dimple artifacts of bicubic
