projectStartToHeightmap.choices=SOURCE,NONE,WORLD_SURFACE_WG,WORLD_SURFACE,OCEAN_FLOOR_WG,OCEAN_FLOOR,MOTION_BLOCKING,MOTION_BLOCKING_NO_LEAVES
projectStartToHeightmap.SOURCE.description=Keeps the registered structure's own heightmap projection exactly as the vanilla, datapack, or mod definition declares it.
projectStartToHeightmap.NONE.description=Removes heightmap projection entirely, so the start piece lands at the structure's literal start height instead of following terrain.
projectStartToHeightmap.WORLD_SURFACE_WG.description=Drops the start piece onto the terrain top counting water as solid, so ocean starts sit on the water surface.
projectStartToHeightmap.WORLD_SURFACE.description=Identical to WORLD_SURFACE_WG in Iris worlds: the start piece rides the terrain top including water.
projectStartToHeightmap.OCEAN_FLOOR_WG.description=Drops the start piece onto solid terrain, ignoring water, so ocean starts sit on the seabed.
projectStartToHeightmap.OCEAN_FLOOR.description=Identical to OCEAN_FLOOR_WG in Iris worlds: the start piece sits on solid ground beneath any water.
projectStartToHeightmap.MOTION_BLOCKING.description=Behaves like WORLD_SURFACE in Iris worlds; the start piece sits on the terrain top including water.
projectStartToHeightmap.MOTION_BLOCKING_NO_LEAVES.description=Behaves like WORLD_SURFACE in Iris worlds; Iris height queries have no leaf layer to skip.
liquidSettings.choices=SOURCE,IGNORE_WATERLOGGING,APPLY_WATERLOGGING
liquidSettings.SOURCE.description=Keeps the registered structure's own liquid setting; vanilla defaults to applying waterlogging when the definition omits it.
liquidSettings.IGNORE_WATERLOGGING.description=Places pieces dry: existing water is displaced and waterloggable blocks stay unwaterlogged, leaving air-filled interiors underwater.
liquidSettings.APPLY_WATERLOGGING.description=Re-applies pre-existing water into placed waterloggable blocks and floods from neighboring sources, so underwater pieces come out waterlogged.
