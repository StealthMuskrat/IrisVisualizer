position.description=The position of this connector relative to the piece object's origin (0,0,0 is the lowest-corner of the object).
position.default={}
direction.description=The direction this connector faces. The connecting piece is placed on this side.
direction.default=NORTH_NEGATIVE_Z
top.description=The connector's authored top direction, used to preserve aligned vanilla jigsaw orientation.
top.default=UP_POSITIVE_Y
pool.description=The jigsaw pool to draw the connecting piece from.
pool.default=
name.description=The identity exposed by this connector. Another connector can attach when its targetName equals this name, matching Minecraft's jigsaw target-to-name contract.
name.default=
targetName.description=The name this connector wants to connect to on the other piece.
targetName.default=
channel.description=Optional Iris-only connection channel. Matching is exact, case-sensitive, and whitespace-sensitive; empty channels match only other empty channels.
channel.default=
joint.description=How the connecting piece may be rotated relative to this connector.
joint.default=ROLLABLE
finalState.description=Block state placed where this jigsaw marker was authored after assembly. Used when exporting or capturing Mojang-style jigsaw templates.
finalState.default=minecraft:air
selectionPriority.description=Signed priority for selecting this connector within its piece. Higher values are processed before lower values; equal priorities preserve authored order.
selectionPriority.default=0
placementPriority.description=Signed priority assigned to a child piece attached through this connector. Higher-priority child pieces expand first; equal priorities preserve attachment order.
placementPriority.default=0
