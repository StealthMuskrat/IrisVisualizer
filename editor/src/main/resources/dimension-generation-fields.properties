studio.BIOME_BUFFET_5x5.description=Debug layout: every biome on a square grid with 5x5-chunk cells per biome, barrier floor past the last biome. Bukkit studio worlds only.
studio.BIOME_BUFFET_9x9.description=Debug layout: every biome on a square grid with 9x9-chunk cells per biome, barrier floor past the last biome. Bukkit studio worlds only.
studio.BIOME_BUFFET_18x18.description=Debug layout: every biome on a square grid with 18x18-chunk cells per biome, barrier floor past the last biome. Bukkit studio worlds only.
studio.BIOME_BUFFET_36x36.description=Debug layout: every biome on a square grid with 36x36-chunk cells per biome, barrier floor past the last biome. Bukkit studio worlds only.
studio.REGION_BUFFET.description=Deprecated: generates exactly like NORMAL and will be removed in a future release.
