bore.default=false
bore.description=If set to true, air will be placed before the schematic places.
boreExtendMinY.default=0
boreExtendMinY.description=When bore is enabled, lower min-y of the cuboid it removes
boreExtendMinY.minimum=-1
boreExtendMinY.maximum=64
boreExtendMaxY.default=0
boreExtendMaxY.description=When bore is enabled, expand max-y of the cuboid it removes
boreExtendMaxY.minimum=0
boreExtendMaxY.maximum=64
smartBore.default=false
smartBore.description=If set to true, Iris will try to fill the insides of 'rooms' and 'pockets' where air should fit based off of raytrace checks. This prevents a village house placing in an area where a tree already exists, and instead replaces the parts of the tree where the interior of the structure is. \n\nThis operation does not affect warmed-up generation speed however it does slow down loading objects.
meld.default=false
meld.description=If set to true, this object will only place parts of itself where blocks already exist. Warning: Melding is very performance intensive!
waterloggable.default=false
waterloggable.description=If set to true, Blocks placed underwater that could be waterlogged are waterlogged.
underwater.default=false
underwater.description=If set to true, objects will place on the terrain height, ignoring the water surface.
onwater.default=false
onwater.description=If set to true, objects will place on the fluid height level Such as boats.
fromBottom.default=false
fromBottom.description=If set to true, this object will get placed from the bottom of the world up
bore.contextHelp=Clears the transformed object bounds before placement, including when force placement is active. Mode and warp affect the bounds; geometry is not previewed.
boreExtendMinY.contextHelp=Used only when bore is enabled. -1 raises the lower cleared boundary by one block. Editing this extension does not enable bore.
boreExtendMaxY.contextHelp=Used only when bore is enabled. Editing this extension does not enable bore.
smartBore.contextHelp=Iris selects a copied smart-bored runtime variant. The editor preserves the source .iob bytes and does not calculate this variant.
meld.contextHelp=Keeps blocks only where the destination is already solid. STRUCTURE_PIECE skips this test; force placement does not bypass it.
waterloggable.contextHelp=Native normalization uses this flag OR underwater and the existing destination water. Authored wet block states can stay wet while submerged even with this flag off; this does not create fluid.
underwater.contextHelp=Affects eligible native height queries and enables waterlogging normalization. Its placement guards depend on mode and force settings; it does not override a FLOATING absolute-Y anchor.
onwater.contextHelp=In this floating path, bypasses underwater and surface-support guards. It does not independently choose a fluid-level anchor here.
fromBottom.contextHelp=Overrides the usual mode-based anchor, including FLOATING. Native Y uses object height + 1 + rotated center offset, without adding the dimension minimum.
fromBottom.policy=implicitFalse
