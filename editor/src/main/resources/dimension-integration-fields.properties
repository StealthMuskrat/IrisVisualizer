borrowedDimensionType.description=Borrow an existing registered dimension type, such as minecraft:the_end or a mod's aether:the_aether, instead of generating one from dimensionOptions. Sky, fog, lighting, and client effects then come from that type, and dimensionOptions and fullbright are ignored. dimensionHeight.min must equal the type's min_y and dimensionHeight.max must not exceed its top; a mismatch is refused when the world loads. Leave empty to generate a dimension type. Modded servers only.
datapackImports.description=External HTTP(S) or file URL datapack sources owned by this dimension. Bukkit registers their resources server-wide, but Iris excludes their structure sets and definitions from generation and locate state in vanilla worlds and Iris dimensions that do not declare the same source. Local ZIPs under Iris/datapacks/imports are discovered automatically and enabled for every Iris dimension. Editable auto-import is limited to resources supplied by configured or discovered sources. Any registered datapack structure can be placed directly through nativeStructures without conversion. Replacing native generation requires a dimension-level structure placement with nativeSuppression set to REPLACE_SOURCE; provenance alone never disables native structures.
