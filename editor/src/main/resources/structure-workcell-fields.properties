archetype.BLANK.description=Pieces with no horizontal connectors: sealed filler cells that terminate nothing and are excluded from the default piece pool.
archetype.END.description=One-connector dead-end pieces; the Studio bay seeds a single north connector and new projects mark these as terminal caps.
archetype.STRAIGHT.description=Two-connector pass-through pieces with openings on opposite sides; the Studio bay seeds north and south connectors.
archetype.CORNER.description=Two-connector right-angle pieces with openings on adjacent sides; the Studio bay seeds north and east connectors.
archetype.TEE.description=Three-connector junction pieces; the Studio bay seeds north, east, and west connectors.
archetype.CROSS.description=Four-connector pieces open on all sides; new projects use this archetype as the structure's start piece.
