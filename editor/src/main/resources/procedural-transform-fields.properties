stiltSettings.fields=yMax,yRand,overStilt,organicMaxScan,organicJitter,organicScratch
stiltSettings.yMax.type=int
stiltSettings.yMax.default=0
stiltSettings.yMax.description=Defines the maximum amount of blocks the object stilts verticially before overstilting and randomRange.
stiltSettings.yMax.minimum=0
stiltSettings.yMax.maximum=64
stiltSettings.yRand.type=int
stiltSettings.yRand.default=0
stiltSettings.yRand.description=Defines the upper boundary for additional blocks after overstilting and/or maxStiltRange.
stiltSettings.yRand.minimum=0
stiltSettings.yRand.maximum=64
stiltSettings.overStilt.type=int
stiltSettings.overStilt.default=0
stiltSettings.overStilt.description=If the place mode is set to stilt, you can over-stilt it even further into the ground. Especially useful when using fast stilt due to inaccuracies.
stiltSettings.overStilt.minimum=0
stiltSettings.overStilt.maximum=64
stiltSettings.organicMaxScan.type=int
stiltSettings.organicMaxScan.default=48
stiltSettings.organicMaxScan.description=For ORGANIC_STILT / CEILING_HANG: the maximum number of blocks to scan toward the cave floor (or ceiling) looking for solid ground before giving up.
stiltSettings.organicMaxScan.minimum=1
stiltSettings.organicMaxScan.maximum=256
stiltSettings.organicJitter.type=int
stiltSettings.organicJitter.default=3
stiltSettings.organicJitter.description=For ORGANIC_STILT / CEILING_HANG: the maximum number of blocks each column's stilt is randomly shortened by, giving the underside a ragged organic edge instead of a flat disc.
stiltSettings.organicJitter.minimum=0
stiltSettings.organicJitter.maximum=32
stiltSettings.organicScratch.type=double
stiltSettings.organicScratch.default=0.55
stiltSettings.organicScratch.description=For ORGANIC_STILT / CEILING_HANG: in the deepest fraction of each stilt column, blocks are randomly skipped to break the tip up. Higher = more broken and scratchy. 0 disables.
stiltSettings.organicScratch.minimum=0
stiltSettings.organicScratch.maximum=1
vacuumSettings.fields=radius,falloff,organicJitter,waveAmplitude,waveScale
vacuumSettings.radius.type=int
vacuumSettings.radius.default=0
vacuumSettings.radius.description=The horizontal radius (in blocks) the terrain deformation extends beyond the object footprint before it blends back to the natural surface. 0 = derive automatically from the place mode (VACUUM, VACUUM_HIGH larger, VACUUM_FAST smaller).
vacuumSettings.radius.minimum=0
vacuumSettings.radius.maximum=128
vacuumSettings.falloff.type=double
vacuumSettings.falloff.default=2.0
vacuumSettings.falloff.description=The falloff exponent controlling how the deformation eases out across the radius. 1 = linear (cone), 2 = parabolic (default, gentle bowl), higher = flatter near the object with a sharper drop at the edge.
vacuumSettings.falloff.minimum=0.25
vacuumSettings.falloff.maximum=8
vacuumSettings.organicJitter.type=int
vacuumSettings.organicJitter.default=4
vacuumSettings.organicJitter.description=For VACUUM_ORGANIC: the maximum number of blocks the effective radius is randomly perturbed per column, giving the meeting edge an irregular organic outline instead of a clean circle.
vacuumSettings.organicJitter.minimum=0
vacuumSettings.organicJitter.maximum=64
vacuumSettings.waveAmplitude.type=int
vacuumSettings.waveAmplitude.default=3
vacuumSettings.waveAmplitude.description=For VACUUM_WAVY: the vertical amplitude (in blocks) of the rolling simplex wave applied across the terrain bend. The wave fades to zero under the object (so it stays flush) and at the outer radius (so it blends back to the surface), peaking across the mid-slope. 0 disables the wave.
vacuumSettings.waveAmplitude.minimum=0
vacuumSettings.waveAmplitude.maximum=64
vacuumSettings.waveScale.type=double
vacuumSettings.waveScale.default=5.0
vacuumSettings.waveScale.description=For VACUUM_WAVY: the frequency of the simplex wave. Higher values make tighter, choppier ripples; lower values make broad, gentle swells. The wavelength in blocks is roughly 100 / waveScale.
vacuumSettings.waveScale.minimum=0.1
vacuumSettings.waveScale.maximum=64
exclude.description=Block materials that must never extend into stilts. Matches all block states of each material, before and after palette replacement or object edits. Original object blocks remain in place. Containers and blocks with tile entities are always excluded.
