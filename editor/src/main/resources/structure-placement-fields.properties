structures.description=Editable Iris assembly resources offered by this placement. Leave empty when nativeStructures supplies the source.
structures.type=KList<String>
structures.default=new KList<>()
nativeStructures.description=Live registered vanilla, datapack, and modded structures offered by this placement. Minecraft runs their native generator directly, independent of normal biome or dimension eligibility.
nativeStructures.type=KList<IrisNativeStructure>
nativeStructures.default=new KList<>()
placementId.description=Stable authored identity for this placement. Set this when multiple placements use the same structure and settings. When empty, Iris derives identity from the placement content so list reordering does not move generated structures.
placementId.type=String
placementId.default=
nativeSuppression.description=Controls native replacement for this placement. REPLACE_SOURCE suppresses each selected Iris structure's vanillaSource or registered native source, and is honored only for dimension-level placements. NONE leaves native generation untouched.
nativeSuppression.type=NativeStructureSuppression
nativeSuppression.default=NONE
distribution.description=How start positions are scattered.
distribution.type=StructureDistribution
distribution.default=RANDOM_SPREAD
spacing.description=RANDOM_SPREAD only: the grid cell size in chunks. One placement attempt per cell. Larger = rarer.
spacing.type=int
spacing.default=32
separation.description=RANDOM_SPREAD only: the minimum chunk separation between placements within the grid. Must be smaller than spacing.
separation.type=int
separation.default=8
salt.description=RANDOM_SPREAD only: a salt mixed into the placement RNG so different structures using the same spacing do not stack.
salt.type=int
salt.default=165745296
density.description=DENSITY only: the per-chunk probability (0-1) of a placement starting in a chunk.
density.type=double
density.default=0.02
ringCount.description=CONCENTRIC_RINGS only: the number of placements distributed across the rings.
ringCount.type=int
ringCount.default=128
ringDistance.description=CONCENTRIC_RINGS only: the ring spacing in chunks.
ringDistance.type=int
ringDistance.default=32
ringSpread.description=CONCENTRIC_RINGS only: how many placements share each ring before moving outward.
ringSpread.type=int
ringSpread.default=3
minHeight.description=Minimum world Y. SURFACE uses it as a terrain-height gate; HEIGHT_BAND and cave anchors use it as the lower candidate bound. LEGACY follows underground.
minHeight.type=int
minHeight.default=-2032
maxHeight.description=Maximum world Y. SURFACE uses it as a terrain-height gate; HEIGHT_BAND and cave anchors use it as the upper candidate bound. LEGACY follows underground.
maxHeight.type=int
maxHeight.default=2032
underground.description=LEGACY anchor only: if true, choose a deterministic world Y inside [minHeight, maxHeight]; otherwise gate the terrain surface. Explicit anchor modes override this field.
underground.type=boolean
underground.default=false
anchor.description=Vertical anchor policy. LEGACY preserves the underground boolean. Cave modes search existing carved-space data and implicitly behave as underground placements.
anchor.type=IrisStructureAnchorMode
anchor.default=LEGACY
caveBiomes.description=Optional cave-biome allowlist for cave anchor modes. Empty accepts the cave biome resolved at the selected anchor. Entries match by load key, including prefix matches.
caveBiomes.type=KList<String>
caveBiomes.default=new KList<>()
caveAnchorAttempts.description=Cave anchor modes only: deterministic X/Z columns tested inside the start chunk before the placement is skipped.
caveAnchorAttempts.type=int
caveAnchorAttempts.default=8
caveAnchorScanStep.description=Cave anchor modes only: vertical scan step in blocks. One is exact; larger values trade precision for speed.
caveAnchorScanStep.type=int
caveAnchorScanStep.default=1
caveMinimumClearance.description=Cave anchor modes only: minimum contiguous carved-space height required at the selected anchor.
caveMinimumClearance.type=int
caveMinimumClearance.default=3
terrain.description=Terrain integration for this placement. The editable structures backend supports SOURCE, PRESERVE, BORE, and FORCE_CARVE. The nativeStructures backend supports every terrain mode.
terrain.type=IrisStructureTerrain
terrain.default=new IrisStructureTerrain()
stilt.description=Optional foundation columns placed beneath the assembled structure's occupied bottom cells. Columns pass through air and fluids until they reach solid ground, up to maxDepth.
stilt.type=IrisStructureStiltSettings
stilt.default=null
underwater.description=If false, the placement is skipped when its selected surface or cave column is submerged.
underwater.type=boolean
underwater.default=false
