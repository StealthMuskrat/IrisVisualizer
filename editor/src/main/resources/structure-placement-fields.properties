distribution.choices=RANDOM_SPREAD,DENSITY,CONCENTRIC_RINGS
distribution.RANDOM_SPREAD.description=Vanilla-style spacing/separation grid. One placement attempt per grid cell, randomly offset within it by the separation. Use spacing, separation and salt.
distribution.DENSITY.description=A per-chunk probability roll, like object density. Use density (0-1).
distribution.CONCENTRIC_RINGS.description=Concentric rings around the world origin, like vanilla strongholds. Use rings.
anchor.choices=LEGACY,SURFACE,HEIGHT_BAND,CAVE_FLOOR,CAVE_CEILING,CAVE_CENTER,CAVE_ANY
anchor.LEGACY.description=Preserve the historical underground boolean behavior.
anchor.SURFACE.description=Anchor to the terrain surface and use minHeight/maxHeight as a surface gate.
anchor.HEIGHT_BAND.description=Choose a deterministic Y inside the minHeight/maxHeight band.
anchor.CAVE_FLOOR.description=Anchor in carved space with solid support below.
anchor.CAVE_CEILING.description=Anchor in carved space with solid support above.
anchor.CAVE_CENTER.description=Anchor in carved space without nearby floor or ceiling support.
anchor.CAVE_ANY.description=Anchor at any carved-space position.
nativeSuppression.choices=NONE,REPLACE_SOURCE
nativeSuppression.NONE.description=Leaves native generation enabled alongside this Iris structure placement.
nativeSuppression.REPLACE_SOURCE.description=Suppresses the structure's vanillaSource when used by a validated dimension-level replacement placement.
native.structure.description=Registered structure key. The source retains its native generator, pieces, templates, processors, entities, markers, and data.
native.weight.description=Relative selection weight when a placement offers multiple native structure sources.
native.weight.type=int
native.weight.default=1
native.weight.minimum=1
native.weight.maximum=2147483647
