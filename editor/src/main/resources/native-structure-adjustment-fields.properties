match.description=Structure keys this adjustment applies to, e.g. 'minecraft:stronghold'. A namespace:path prefix also matches, so 'minecraft:village' adjusts every village variant and 'minecraft:ruined_portal' adjusts every ruined portal. Empty matches nothing.
match.type=KList<String>
match.default=new KList<>()
yShift.description=Vertical block offset. Negative pushes the structure down, positive lifts it. The resolved shift is clamped so the structure remains inside the world's vertical build bounds.
yShift.type=int
yShift.default=0
yShift.minimum=-512
yShift.maximum=512
yBand.description=Optional absolute world Y band. The structure is relocated so its vertical midpoint lands inside the band, deterministically from its start chunk and clamped to the world's build bounds. Precedence: preserveSourceY wins over yBand, and yBand wins over both yShift and Iris burial repositioning. Structures with a fixed vanilla alignment (ocean monument sea level, desert and jungle pyramid surface fit) ignore it.
yBand.type=IrisStructureYBand
yBand.default=null
preserveSourceY.description=When true, skip Iris burial repositioning so the structure keeps the Y its own vanilla placement chose. Underground structures are otherwise pushed below the lowest solid column across their whole footprint, which hides terrain-aware structures such as mineshafts that intentionally breach cliffs and surfaces. Vertical shifts still apply on top of the preserved Y: this dimension's undergroundYShift plus every matching adjustment's yShift.
preserveSourceY.type=boolean
preserveSourceY.default=false
stilt.description=Optional foundation columns placed beneath the native structure piece bases after placement.
stilt.type=IrisStructureStiltSettings
stilt.default=null
terrain.description=Optional terrain integration override. FLATTEN cuts and fills exposed surface foundations within flattenRange, blending across horizontalPadding blocks while preserving buried and submerged structures. VACUUM raises processed rigid-template foundations with a fixed 12-block falloff without lowering ground. BORE and FORCE_CARVE clear every intersecting chunk before native placement, while ENCASE fills it. Left unset, SOURCE replays the registered structure's authored terrain adaptation.
terrain.type=IrisStructureTerrain
terrain.default=null
stilt.maxDepth.description=Maximum number of blocks each foundation column may descend while searching for solid ground.
stilt.maxDepth.type=int
stilt.maxDepth.default=64
stilt.maxDepth.minimum=1
stilt.maxDepth.maximum=4064
stilt.palette.description=Block palette used for foundation columns.
stilt.palette.type=IrisMaterialPalette
stilt.palette.default=new IrisMaterialPalette().qclear().qadd(\"minecraft:cobblestone\")
stilt.spacing.description=Horizontal spacing between support columns. One fills every eligible foundation column; larger values create sparse stilts.
stilt.spacing.type=int
stilt.spacing.default=1
stilt.spacing.minimum=1
stilt.spacing.maximum=64
stilt.supportNonOccluding.description=For Iris-authored structures, whether solid partial blocks such as slabs, stairs, and walls may seed foundation columns instead of requiring a fully occluding base block.
stilt.supportNonOccluding.type=boolean
stilt.supportNonOccluding.default=false
terrain.mode.description=Terrain operation. SOURCE applies the registered native structure's authored terrain adaptation and is a no-op for editable Iris structures. PRESERVE disables terrain integration. FLATTEN cuts and fills exposed native structure terrain within flattenRange, blending across horizontalPadding blocks. VACUUM raises terrain from processed rigid-template foundations with a fixed 12-block falloff without lowering ground. BORE and FORCE_CARVE clear the requested envelope, while ENCASE fills it before placement.
terrain.mode.type=enum
terrain.mode.default=SOURCE
terrain.horizontalPadding.description=Horizontal clearance for BORE, FORCE_CARVE, and ENCASE, or the terrain blend distance for FLATTEN, in blocks. VACUUM uses its fixed 12-block terrain falloff.
terrain.horizontalPadding.type=int
terrain.horizontalPadding.default=0
terrain.horizontalPadding.minimum=0
terrain.horizontalPadding.maximum=128
terrain.flattenRange.description=Maximum vertical cut, fill, and foundation support depth for FLATTEN, in blocks. Other terrain modes ignore this setting.
terrain.flattenRange.type=int
terrain.flattenRange.default=64
terrain.flattenRange.minimum=0
terrain.flattenRange.maximum=128
terrain.ceilingPadding.description=Air clearance above the assembled pieces.
terrain.ceilingPadding.type=int
terrain.ceilingPadding.default=0
terrain.ceilingPadding.minimum=0
terrain.ceilingPadding.maximum=128
terrain.floorPadding.description=Terrain cleared below the assembled pieces. Zero preserves their supporting floor.
terrain.floorPadding.type=int
terrain.floorPadding.default=0
terrain.floorPadding.minimum=0
terrain.floorPadding.maximum=64
terrain.shape.description=Shape used by FORCE_CARVE.
terrain.shape.type=enum
terrain.shape.default=BOX
terrain.encasePalette.description=Block palette used by ENCASE. When unset, the Overworld uses stone or deepslate, the Nether uses netherrack, and the End uses end stone.
terrain.encasePalette.type=IrisMaterialPalette
terrain.encasePalette.default=null
terrain.erosionStrength.description=Boundary erosion strength for ERODED force carving.
terrain.erosionStrength.type=double
terrain.erosionStrength.default=0.8
terrain.erosionStrength.minimum=0
terrain.erosionStrength.maximum=1
terrain.erosionFrequency.description=Boundary noise frequency for ERODED force carving.
terrain.erosionFrequency.type=double
terrain.erosionFrequency.default=0.07
terrain.erosionFrequency.minimum=0.001
terrain.erosionFrequency.maximum=1
terrain.lobeFrequency.description=Low frequency lobe wavelength for ERODED force carving. Zero derives it from the erosion frequency.
terrain.lobeFrequency.type=double
terrain.lobeFrequency.default=0
terrain.lobeFrequency.minimum=0
terrain.lobeFrequency.maximum=1
terrain.lobeStrength.description=Fraction of the horizontal padding the lobes may remove for ERODED force carving. Zero keeps a uniform boundary.
terrain.lobeStrength.type=double
terrain.lobeStrength.default=0.85
terrain.lobeStrength.minimum=0
terrain.lobeStrength.maximum=1
yBand.min.description=Lowest absolute world Y of the band.
yBand.min.type=int
yBand.min.default=0
yBand.min.minimum=-4064
yBand.min.maximum=4064
yBand.max.description=Highest absolute world Y of the band.
yBand.max.type=int
yBand.max.default=0
yBand.max.minimum=-4064
yBand.max.maximum=4064
terrain.mode.choices=SOURCE,PRESERVE,BORE,FORCE_CARVE,VACUUM,FLATTEN,ENCASE
terrain.mode.SOURCE.description=Replays the registered native structure's own authored terrain adaptation (beard surface fitting, BURY/ENCAPSULATE fill, legacy template-air clearing). Does nothing for editable Iris structures, which have no source adaptation to replay.
terrain.mode.PRESERVE.description=Disables all terrain integration. Pieces are placed into completely unmodified terrain and may end up embedded in solid rock or floating over dips.
terrain.mode.BORE.description=Clears one straight axis-aligned box around the assembled pieces, expanded by horizontalPadding, ceilingPadding, and floorPadding. Ignores the carve shape and erosion settings.
terrain.mode.FORCE_CARVE.description=Clears the padded envelope using the configured carve shape (BOX, ROUNDED, or noise-eroded ERODED) so the cavity hugs the assembled pieces instead of a straight box.
terrain.mode.VACUUM.description=Raises surface terrain from processed solid rigid-template foundations at or below each authored ground plane with a 12-block falloff, even when the registered structure has no terrain adaptation. Existing higher terrain and authored air remain untouched.
terrain.mode.FLATTEN.description=Cuts and fills exposed native structure foundations within flattenRange, blending into surrounding terrain across horizontalPadding blocks. Buried and submerged pieces retain their terrain.
terrain.mode.ENCASE.description=Fills the padded piece volume with solid blocks before any piece is placed so shells, walls, and floors land in solid ground instead of pre-carved air. Only air and liquid cells are filled; existing terrain and structures are never overwritten. Native pieces then carve their own interiors.
terrain.shape.choices=BOX,ROUNDED,ERODED
terrain.shape.BOX.description=Carves the full expanded rectangular volume with straight walls, ceiling, and floor.
terrain.shape.ROUNDED.description=Carves a smooth rounded volume around the structure without erosion noise.
terrain.shape.ERODED.description=Carves a rounded volume whose outer boundary is eroded by deterministic noise.
resolution.policy=stackShiftsLastNonNullOverrides
band.policy=sortedEndpoints
palettes.policy=separatePaletteControls
registry.policy=syntaxOnly
