dimension.sourceSha256=b0bfdff36b44b8e7e61968190ef80c483aa949ce68e57f155c02e1b5c8aacd5d
fluidHeight.type=int
fluidHeight.description=The fluid (sea level) height for this dimension, in world Y. Water fills every sea column up to this height, so 63 puts the water surface at world Y 63.
fluidHeight.minimum=0.0
fluidHeight.maximum=1024.0
fluidHeight.default=63.0
dimensionAngleDeg.type=double
dimensionAngleDeg.description=You can rotate the input coordinates by an angle. This can make terrain appear more natural (less sharp corners and lines). This literally rotates the entire dimension by an angle. Hint: Try 12 degrees or something not on a 90 or 45 degree angle.
dimensionAngleDeg.minimum=0.0
dimensionAngleDeg.maximum=360.0
dimensionAngleDeg.default=0.0
landChance.type=double
landChance.description=The land chance. Up to 1.0 for total land or 0.0 for total sea
landChance.minimum=0.0
landChance.maximum=1.0
landChance.default=0.625
objectSurfaceSupportBuffer.type=int
objectSurfaceSupportBuffer.description=Minimum surface-support buffer, in blocks, applied to every surface object placement in this dimension. A placement may ask for more but never less.
objectSurfaceSupportBuffer.minimum=0.0
objectSurfaceSupportBuffer.maximum=16.0
objectSurfaceSupportBuffer.default=2.0
bedrock.type=boolean
bedrock.description=Should bedrock be generated or not.
bedrock.default=true
decorate.type=boolean
decorate.description=Generate decorations or not
decorate.default=true
carvingEnabled.type=boolean
carvingEnabled.description=Enable or disable all carving for this dimension
carvingEnabled.default=true
postProcessing.type=boolean
postProcessing.description=Use post processing or not
postProcessing.default=true
postProcessingSlabs.type=boolean
postProcessingSlabs.description=Add slabs in post processing
postProcessingSlabs.default=true
postProcessingWalls.type=boolean
postProcessingWalls.description=Add painted walls in post processing
postProcessingWalls.default=true
requireObjectSurfaceSupport.type=boolean
requireObjectSurfaceSupport.description=Refuse to place surface objects and trees over carved surface openings.
requireObjectSurfaceSupport.default=true
regions.type=regionArray
regions.description=Define all of the regions to include in this dimension. Dimensions -> Regions -> Biomes -> Objects etc
regions.default=[]
biomeZoom.type=double
biomeZoom.description=Zoom in or out the biome size. Higher = bigger biomes
biomeZoom.minimum=0.0001
biomeZoom.maximum=512.0
biomeZoom.default=1.0
landZoom.type=double
landZoom.description=This zooms in the land space
landZoom.minimum=0.0001
landZoom.maximum=512.0
landZoom.default=1.0
seaZoom.type=double
seaZoom.description=This zooms oceanic biomes
seaZoom.minimum=0.0001
seaZoom.maximum=512.0
seaZoom.default=1.0
continentZoom.type=double
continentZoom.description=Zoom in continents
continentZoom.minimum=0.0001
continentZoom.maximum=512.0
continentZoom.default=1.0
regionZoom.type=double
regionZoom.description=Change the size of regions
regionZoom.minimum=0.0001
regionZoom.maximum=512.0
regionZoom.default=1.0
coordFractureZoom.type=double
coordFractureZoom.description=Coordinate fracturing zoom. Higher = less frequent warping, Lower = more frequent and rapid warping / swirls.
coordFractureZoom.minimum=0.0001
coordFractureZoom.maximum=512.0
coordFractureZoom.default=8.0
coordFractureDistance.type=double
coordFractureDistance.description=Coordinate fracturing applies noise to the input coordinates. This creates the 'iris swirls' and wavy features. The distance pushes these waves further into places they shouldnt be. This is a block value multiplier.
coordFractureDistance.minimum=0.0
coordFractureDistance.maximum=8192.0
coordFractureDistance.default=20.0
terrainSamplingStep.type=int
terrainSamplingStep.description=Procedural terrain height sampling interval in blocks: 1, 2, 4, or 8. 1 retains full detail. Larger intervals interpolate between shared samples, reducing generation work and smoothing small height features. Image maps retain their configured sampling. Set before creating a world.
terrainSamplingStep.minimum=1.0
terrainSamplingStep.maximum=8.0
terrainSamplingStep.default=1.0
terrainSamplingStep.options=1,2,4,8
biomeBoundsSamplingStep.type=int
biomeBoundsSamplingStep.description=Biome height-bound sampling interval in blocks: 4, 8, 16, or 32. 4 retains the original biome blending. Larger intervals interpolate the configured generator bounds between shared anchors, smoothing small biome-height features. Generator interpolation styles and radii remain active at the anchors. Set before creating a world.
biomeBoundsSamplingStep.minimum=4.0
biomeBoundsSamplingStep.maximum=32.0
biomeBoundsSamplingStep.default=4.0
biomeBoundsSamplingStep.options=4,8,16,32
caveDensitySamplingStep.type=int
caveDensitySamplingStep.description=Vertical cave density sampling interval in blocks: 1, 2, 4, or 8. Larger intervals interpolate density while retaining cave module bounds, surface protection, and fluid rules. Changes cave geometry. Set before creating a world.
caveDensitySamplingStep.minimum=1.0
caveDensitySamplingStep.maximum=8.0
caveDensitySamplingStep.default=1.0
caveDensitySamplingStep.options=1,2,4,8
caveLavaHeight.type=int
caveLavaHeight.description=The subterranean fluid (cave lava) layer height, in engine-local Y where 0 is the bottom of the dimension, not world Y. With the default -64..320 height, 8 means world Y -56.
caveLavaHeight.minimum=0.0
caveLavaHeight.maximum=318.0
caveLavaHeight.default=8.0
upperDimensionGap.type=int
upperDimensionGap.description=Minimum air gap in blocks between the lower terrain surface and the upper terrain surface.
upperDimensionGap.minimum=0.0
upperDimensionGap.maximum=256.0
upperDimensionGap.default=32.0
upperDimensionCarving.type=boolean
upperDimensionCarving.description=When true, cave carving cuts through the upper dimension terrain. When false, cave carving leaves the upper terrain unchanged, including its biome terrain3D openings.
upperDimensionCarving.default=false
upperDimensionObjects.type=boolean
upperDimensionObjects.description=When true, objects from the mantle (structures, trees, etc.) can be placed in the upper dimension terrain zone. When false, the upper terrain is protected from object placement.
upperDimensionObjects.default=false
upperObjectsForcePlace.type=boolean
upperObjectsForcePlace.description=When true, upper-dimension objects force-place regardless of placement restrictions (slope, underwater, clamp, collisions, carving). Normal dimension objects always place first; upper objects place second and may clip or occlude lower-dimension placements when this is enabled.
upperObjectsForcePlace.default=false
importedStructures.sourceSha256=d44a1cd7f7e06e0dbca54cb5bb4f7a4f69c9f3da0258dd94210c163c5bb25320
importedStructures.undergroundYShift.type=int
importedStructures.undergroundYShift.description=Vertical block offset applied only to UNDERGROUND vanilla structures (the UNDERGROUND_STRUCTURES, UNDERGROUND_DECORATION, and STRONGHOLDS generation steps: strongholds, trial chambers, mineshafts, ancient cities, etc.). Surface structures (villages, outposts, etc.) are never shifted. Use a negative value to push deep structures lower when your dimension's sea/terrain level differs from vanilla's (e.g. -64 if you lowered the fluid height to 0). 0 = no shift.
importedStructures.undergroundYShift.minimum=-512.0
importedStructures.undergroundYShift.maximum=512.0
importedStructures.undergroundYShift.default=0.0
importedStructures.datapackOverrides.type=boolean
importedStructures.datapackOverrides.description=Controls whether ingested datapacks may replace minecraft-namespaced structure definitions, sets, pools, and templates. When false, those overrides are stripped from installed datapack copies so vanilla definitions stay intact. Non-minecraft structures from datapacks and mods remain governed by disabled because namespace alone cannot identify their origin. Resolved globally across loaded packs: if any dimension sets this false, minecraft-namespaced overrides are stripped from every installed datapack copy.
importedStructures.datapackOverrides.default=true
importedStructures.disabled.type=stringArray
importedStructures.disabled.description=Structure keys to deny explicitly, e.g. 'minecraft:stronghold'. A namespace:path prefix also matches, so 'minecraft:village' disables every village variant and 'minecraft:ruined_portal' disables every ruined portal. Every key not matched here remains enabled.
importedStructures.disabled.default=[]
importedStructures.disabled.prefixes=true
importedStructures.disabledExact.type=stringArray
importedStructures.disabledExact.description=Exact structure keys to deny after trimming and case normalization. Unlike 'disabled', entries never match key families, so 'minecraft:ruined_portal' does not disable 'minecraft:ruined_portal_nether'.
importedStructures.disabledExact.default=[]
importedStructures.disabledExact.prefixes=false
importedFeatures.sourceSha256=2108a470904b4e2c3d59639cd49e75b53b7d9a7849301b1c7b44407f6af2e356
importedFeatures.enabled.type=boolean
importedFeatures.enabled.description=Master switch. False (the default) means no native placed feature generates and chunk output is identical to a pack without this block at all. True runs the vanilla decoration feature pass over Iris terrain.
importedFeatures.enabled.default=false
importedFeatures.disabled.type=stringArray
importedFeatures.disabled.description=Placed feature keys to deny explicitly, e.g. 'minecraft:ore_diamond'. A namespace:path prefix also matches, so 'minecraft:ore' denies every vanilla ore and 'minecraft:trees' denies every tree placement. Every key not matched here generates while 'enabled' is true.
importedFeatures.disabled.default=[]
importedFeatures.disabled.prefixes=true
importedFeatures.disabledExact.type=stringArray
importedFeatures.disabledExact.description=Exact placed feature keys to deny after trimming and case normalization. Unlike 'disabled', entries never match key families, so 'minecraft:ore_iron' does not disable 'minecraft:ore_iron_small'.
importedFeatures.disabledExact.default=[]
importedFeatures.disabledExact.prefixes=false
