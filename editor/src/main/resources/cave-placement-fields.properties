defaultObjectAnchor.description=Default cave anchor mode for cave-only object placement.
defaultObjectAnchor.default=FLOOR
defaultObjectAnchor.choices=PROFILE_DEFAULT,FLOOR,CEILING,CENTER,ANY
defaultObjectAnchor.PROFILE_DEFAULT.description=Use the active cave profile default anchor mode.
defaultObjectAnchor.FLOOR.description=Target cave floor anchors where carved space has solid support below.
defaultObjectAnchor.CEILING.description=Target cave ceiling anchors where carved space has solid support above.
defaultObjectAnchor.CENTER.description=Target carved positions with no immediate solid support above or below.
defaultObjectAnchor.ANY.description=Target any carved-space anchor.
defaultObjectPlaceMode.description=Default placement mode for cave objects. Only applies to placements that are still on the default CENTER_HEIGHT mode; an explicit mode on the placement always wins. Stilt modes tile the object base block down to the cave floor surface. FAST_MIN_STILT is recommended for cave objects to prevent floating.
defaultObjectPlaceMode.default=null
defaultObjectPlaceMode.choices=CENTER_HEIGHT,MAX_HEIGHT,FAST_MAX_HEIGHT,MIN_HEIGHT,FAST_MIN_HEIGHT,STILT,FAST_STILT,MIN_STILT,FAST_MIN_STILT,CENTER_STILT,ERODE_STILT,ORGANIC_STILT,CEILING_HANG,VACUUM,VACUUM_HIGH,VACUUM_FAST,VACUUM_ORGANIC,VACUUM_WAVY,PAINT,FLOATING,STRUCTURE_PIECE
defaultObjectPlaceMode.CENTER_HEIGHT.description=The default place mode. This mode picks a center point (where the center of the object will be) and takes the height. That height is used for the whole object.
defaultObjectPlaceMode.MAX_HEIGHT.description=Samples a lot of points where the object will cover (horizontally) and picks the highest height, that height is then used to place the object. This mode is useful for preventing any part of your object from being buried though it will float off of cliffs.
defaultObjectPlaceMode.FAST_MAX_HEIGHT.description=Samples only 4 points where the object will cover (horizontally) and picks the highest height, that height is then used to place the object. This mode is useful for preventing any part of your object from being buried though it will float off of cliffs."
defaultObjectPlaceMode.MIN_HEIGHT.description=Samples a lot of points where the object will cover (horizontally) and picks the lowest height, that height is then used to place the object. This mode is useful for preventing any part of your object from overhanging a cliff though it gets buried a lot
defaultObjectPlaceMode.FAST_MIN_HEIGHT.description=Samples only 4 points where the object will cover (horizontally) and picks the lowest height, that height is then used to place the object. This mode is useful for preventing any part of your object from overhanging a cliff though it gets buried a lot
defaultObjectPlaceMode.STILT.description=Stilting is MAX_HEIGHT but it repeats the bottom most block of your object until it hits the surface. This is expensive because it has to first sample every height value for each x,z position of your object. Avoid using this unless its structures for performance reasons.
defaultObjectPlaceMode.FAST_STILT.description=Just like stilting but very inaccurate. Useful for stilting a lot of objects without too much care on accuracy (you can use the over-stilt value to force stilts under ground further)
defaultObjectPlaceMode.MIN_STILT.description=Stilting is MIN_HEIGHT but it repeats the bottom most block of your object until it hits the surface. This is expensive because it has to first sample every height value for each x,z position of your object. Avoid using this unless its structures for performance reasons.
defaultObjectPlaceMode.FAST_MIN_STILT.description=Just like MIN_STILT but very inaccurate. Useful for stilting a lot of objects without too much care on accuracy (you can use the over-stilt value to force stilts under ground further)
defaultObjectPlaceMode.CENTER_STILT.description=Stilting is CENTER_HEIGHT but it repeats the bottom most block of your object until it hits the surface. This is expensive because it has to first sample every height value for each x,z position of your object. Avoid using this unless its structures for performance reasons.
defaultObjectPlaceMode.ERODE_STILT.description=Erode stilting tapers columns downward like an ice cream cone. Blocks near the center extend deepest while edge blocks drop off first. Blocks are randomly skipped in the lower portion for a rough organic eroded texture.
defaultObjectPlaceMode.ORGANIC_STILT.description=Organic stilting scans straight down from the bottom of the object to the first solid block (the cave floor, or terrain) and fills the gap with the object's own bottom block. Each column stops at a slightly different, noise-varied depth and the lower portion is randomly broken up, so the underside reads as rough organic roots rather than a flat disc. Designed for objects placed inside caves so they connect to the floor instead of floating. Tune with stilt-settings (organicMaxScan, organicJitter, organicScratch).
defaultObjectPlaceMode.CEILING_HANG.description=Hangs the object upside-down from a cave ceiling. The object is flipped vertically (its tip points down like a stalactite) and its top is anchored to the ceiling, while an organic, noise-varied stilt grows up into the ceiling so it never floats below the roof. Use inside caves; tune with stilt-settings (organicMaxScan, organicJitter, organicScratch).
defaultObjectPlaceMode.VACUUM.description=Anchors the object at the terrain surface (plus translate.y) like CENTER_HEIGHT, then bends the surrounding terrain to be flush with the object's base. Columns inside the object footprint are raised (or lowered) to meet the base, and the deformation falls off parabolically out to a radius so the terrain smoothly blends back to its natural height. Use this to seat a floating/translated object on the ground without a flat stilt disc, e.g. a cube translated up 10 on a mountain pulls the terrain up to meet it. Tune with vacuum-settings (radius, falloff).
defaultObjectPlaceMode.VACUUM_HIGH.description=VACUUM with a larger radius and finer per-column sampling for the smoothest terrain blend. More expensive.
defaultObjectPlaceMode.VACUUM_FAST.description=VACUUM with a smaller radius and coarser sampling for performance. Use when seating many objects.
defaultObjectPlaceMode.VACUUM_ORGANIC.description=VACUUM whose falloff radius is perturbed by noise per column, so the terrain meets the object with an irregular organic edge rather than a clean parabolic bowl.
defaultObjectPlaceMode.VACUUM_WAVY.description=VACUUM whose terrain bend is bent by smooth coherent simplex noise so the surface meets the object with a gently rolling, wavy slope instead of the ragged white-noise edge of VACUUM_ORGANIC or a clean parabolic bowl. The object itself still seats flush; the waves fade to zero under the object and at the outer rim, peaking across the mid-slope. Tune with vacuum-settings (waveAmplitude, waveScale).
defaultObjectPlaceMode.PAINT.description=Samples the height of the terrain at every x,z position of your object and pushes it down to the surface. It's pretty much like a melt function over the terrain.
defaultObjectPlaceMode.FLOATING.description=Places the object in pure air at an absolute Y driven entirely by translate.y (plus optional translate.yRandom). Terrain height, underwater, and carving anchor checks are skipped. Use this for floating islands, sky structures, clouds, or blimps where the object must not be translated to the ground.
defaultObjectPlaceMode.STRUCTURE_PIECE.description=Raw stamp at the caller-supplied (x, y, z). No terrain sampling, no stilting, no Y recomputation, no underwater or carving anchor guards. Used internally to route native Minecraft structure pieces (villages etc.) through the Iris object placer.
