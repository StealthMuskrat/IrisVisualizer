footprintStyle.description=2D noise that decides which columns are part of this island. Set feature size via the style's own zoom field (e.g. {\"style\":\"CELLULAR\",\"zoom\":0.3} for ~30-block shards, {\"style\":\"SIMPLEX\",\"zoom\":1.0} for ~100-block blobs). Pick SIMPLEX for smooth blobs, CELLULAR for angular shards, VASCULAR for vein/branch strips, FRACTAL_FBM_SIMPLEX for large irregular blanket regions. Fracture (domain warp) this to get swirly silhouettes.
footprintStyle.default=SIMPLEX
footprintStyle.enableStyle=SIMPLEX
edgeTaperVariationStyle.description=Broad 2D noise that organically varies the rounded edge without changing the island footprint. Low-frequency SIMPLEX or PERLIN styles give coherent natural contours; high-frequency or cellular styles can look speckled.
edgeTaperVariationStyle.default=SIMPLEX
edgeTaperVariationStyle.enableStyle=SIMPLEX
edgeTaperVariationStyle.zoomOverride=0.18
pickerStyle.description=Picker noise used when multiple floating child entries exist. Samples once per column to deterministically choose which entry's footprint is tested there. Use a large style zoom (e.g. zoom: 4 for ~400-block regions) so each entry owns broad coherent areas.
pickerStyle.default=SIMPLEX
pickerStyle.enableStyle=SIMPLEX
altitudeStyle.description=Altitude noise \u2014 varies the base platform Y across one island so it isn't a flat plane. Use a large style zoom (e.g. zoom: 2 for ~200-block altitude patches) so an island sits at roughly one altitude.
altitudeStyle.default=SIMPLEX
altitudeStyle.enableStyle=SIMPLEX
topShapeStyle.description=Used only when topShapeMode=NOISE. 2D noise driving the top heightmap. Set feature scale via the style's zoom field (small zoom = rugged peaks, large zoom = broad rolling shapes).
topShapeStyle.default=SIMPLEX
topShapeStyle.enableStyle=SIMPLEX
bottomStyle.description=2D noise driving the bottom tail hanging below the island base. VASCULAR = drippy organic roots. FRACTAL_RM_SIMPLEX = crystalline spikes. CELLULAR = jagged chunks. PERLIN = smooth rounded bowl. SIMPLEX = gentle lobes. Set feature scale via the style's zoom field.
bottomStyle.default=SIMPLEX
bottomStyle.enableStyle=SIMPLEX
wallWarpStyle.description=Optional 3D noise that shifts the footprint's XZ sample position per Y layer \u2014 naturalizes the walls so they stop looking like a straight extrusion of the 2D footprint. Leave null to disable and keep straight vertical walls. Good defaults: {\"style\":\"SIMPLEX\",\"zoom\":0.25} for gentle undulation, {\"style\":\"FRACTAL_FBM_SIMPLEX\",\"zoom\":0.4} for craggier walls.
wallWarpStyle.default=null
wallWarpStyle.enableStyle=FLAT
carveStyle.description=Optional 3D noise that swiss-cheeses the island interior by marking individual blocks as air when the noise exceeds carveThreshold. Leave null to keep the island solid. Good defaults: {\"style\":\"CELLULAR\",\"zoom\":0.3} for bubble pockets, {\"style\":\"VASCULAR\",\"zoom\":0.25} for wormy tunnels.
carveStyle.default=null
carveStyle.enableStyle=FLAT
optional.disable=null
entry.policy=existingInlineOnly
