dimension.description=What a column surfaces with when every biome layer is rejected. Biomes may override this.
biome.default=null
biome.description=What this biome's columns surface with when every layer is rejected, usually because all of them are slope gated and the column is too steep. Omit to inherit the dimension setting.
ROCK.description=Leave the column without layers so it surfaces with the dimension rock palette. Use this for biomes meant to be bare rock where they get steep.
TOP_LAYER.description=Cap the column with a single block of the first layer's palette, ignoring that layer's slope condition. Keeps steep coastlines and cliff faces from turning into bare stone.
choices=ROCK,TOP_LAYER
