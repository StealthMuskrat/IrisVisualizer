erosion.description=Whether surface rivers erode the ground beyond the shore bench into a valley in this area. Null inherits, and without any value erosion follows surface.erosion.enabled. False keeps only the wet channel and the shore bench here, so a river crosses the area in a bare cut.
confined.type=Boolean
confined.default=null
confined.description=Rivers that start in this area stay inside it: their whole course and their outlet lie in this region (when set on a region) or this biome (when set on a biome), and a river that flows into the area never leaves it. A source with no reachable outlet inside the area is rejected. Null inherits, false releases the area.
placement.sourceSha256=f5f56c2918a1013980c7cba52247574a710e3e9cb1f104d5bcb4a5c05337b332
placement.choices=DISABLED,TRANSIT_ONLY,NATURAL,PREFERRED_HEADWATER,REQUIRED_HEADWATER
placement.DISABLED.description=No river source may start here. Rivers may still pass through when routing allows it.
placement.TRANSIT_ONLY.description=Rivers may pass through, but no source starts here.
placement.NATURAL.description=Sources start here on their own merits, ranked like everywhere else.
placement.PREFERRED_HEADWATER.description=Eligible source sites here rank ahead of sites elsewhere in the tile.
placement.REQUIRED_HEADWATER.description=At least one source starts here whenever a site can reach a legal outlet; sources.minimumPerTile can raise that quota.
routing.sourceSha256=655d4409e5a6a0e2263e4fa0903e0db0dafb7097da83f9f19b7ed3dbda511d56
routing.choices=BLOCK,AVOID,ALLOW,PREFER
routing.BLOCK.description=Rivers never route through here.
routing.AVOID.description=Rivers route through here only when no cheaper path exists; transit carries a strong cost.
routing.ALLOW.description=Rivers route through here at the normal cost.
routing.PREFER.description=Rivers route through here at a reduced cost, so routes are drawn toward this area.
