rarity.description=Selection rarity when multiple floating child entries are defined on one parent biome. Lower is more common.
rarity.type=int
rarity.default=1
rarity.minimum=1
rarity.maximum=512
footprintThreshold.description=Coverage threshold (0..1). Roughly the fraction of the world that is NOT island: 0.0 = every column becomes island, 0.5 \u2248 50% of columns, 0.8 \u2248 sparse scattered ~20% coverage, 1.0 = no islands at all. Values near 0.5 feel most natural.
footprintThreshold.type=double
footprintThreshold.default=0.5
footprintThreshold.minimum=0
footprintThreshold.maximum=1
edgeTaperWidth.description=Width in blocks of the rounded transition from the floating island contour to its full thickness. Smaller values make a tighter edge; larger values make a broader rounded underside.
edgeTaperWidth.type=int
edgeTaperWidth.default=10
edgeTaperWidth.minimum=2
edgeTaperWidth.maximum=32
edgeTaperExponent.description=Shape exponent for the rounded edge. Values below 1 fill into a softer, fuller curve; values above 1 keep the rim thinner before rising into the island interior.
edgeTaperExponent.type=double
edgeTaperExponent.default=1.0
edgeTaperExponent.minimum=0.25
edgeTaperExponent.maximum=4
edgeTaperVariationAmplitude.description=Maximum number of blocks by which edgeTaperVariationStyle locally widens or narrows the rounded transition. 0 disables variation. Runtime keeps the resulting local width between 2 and 32 blocks so every protected rim column remains connected.
edgeTaperVariationAmplitude.type=double
edgeTaperVariationAmplitude.default=0.0
edgeTaperVariationAmplitude.minimum=0
edgeTaperVariationAmplitude.maximum=8
maxTopHeight.description=Maximum top profile height in blocks above the island base. Caps how tall the biome terrain can grow on top.
maxTopHeight.type=int
maxTopHeight.default=40
maxTopHeight.minimum=0
maxTopHeight.maximum=512
topShapeAmp.description=Amplitude multiplier applied to the NOISE top profile. 0 = no top (flat at base), 1 = full maxTopHeight range.
topShapeAmp.type=double
topShapeAmp.default=1.0
topShapeAmp.minimum=0
topShapeAmp.maximum=1
bottomExponent.description=Power curve applied to the bottom noise before mapping to depth. >1 = most columns shallow with occasional deeper spikes (sparse roots). <1 = most columns deep with occasional shallow spots (dense curtains). 1.0 = linear.
bottomExponent.type=double
bottomExponent.default=1.0
bottomExponent.minimum=0.1
bottomExponent.maximum=8
maxThickness.description=Hard cap on the total Y-extent (top minus bottom) of a single island column. Safety limit.
maxThickness.type=int
maxThickness.default=96
maxThickness.minimum=1
maxThickness.maximum=512
wallWarpAmplitude.description=Amplitude in blocks of the per-layer XZ shift applied when wallWarpStyle is set. 0 = no warp (straight walls). 4..8 = gentle naturalization. 16+ = heavily meandering walls. Ignored when wallWarpStyle is null.
wallWarpAmplitude.type=double
wallWarpAmplitude.default=6.0
wallWarpAmplitude.minimum=0
wallWarpAmplitude.maximum=64
carveThreshold.description=Threshold (0..1) above which carveStyle noise carves air pockets. 1.0 = no direct-noise carving. 0.75 = sparse pockets. 0.55 = heavy swiss-cheese. 0.4 = shredded lattice. When carving is set, lower values add a final positive threshold bias to the referenced caveProfile.
carveThreshold.type=double
carveThreshold.default=1.0
carveThreshold.minimum=0
carveThreshold.maximum=1
objectShrinkFactor.description=Uniform shrink factor applied to every object placed on this floating island (inherited, extra, and free-floating). 1.0 = native size, 0.5 = half size, 0.25 = quarter. Useful for making small floating biomes feel believable.
objectShrinkFactor.type=double
objectShrinkFactor.default=1.0
objectShrinkFactor.minimum=0.01
objectShrinkFactor.maximum=1
minHeightAboveSurface.description=Minimum absolute world Y where the island base can sit. Island altitude is independent of the parent biome's terrain height; altitudeStyle noise varies the base between min and max per column.
minHeightAboveSurface.type=int
minHeightAboveSurface.default=160
minHeightAboveSurface.minimum=0
minHeightAboveSurface.maximum=2032
maxHeightAboveSurface.description=Maximum absolute world Y where the island base can sit. Island altitude is independent of the parent biome's terrain height; altitudeStyle noise varies the base between min and max per column.
maxHeightAboveSurface.type=int
maxHeightAboveSurface.default=210
maxHeightAboveSurface.minimum=0
maxHeightAboveSurface.maximum=2032
bottomDepthMin.description=Minimum blocks below the base where the tail extends.
bottomDepthMin.type=int
bottomDepthMin.default=4
bottomDepthMin.minimum=0
bottomDepthMin.maximum=512
bottomDepthMax.description=Maximum blocks below the base where the tail extends.
bottomDepthMax.type=int
bottomDepthMax.default=20
bottomDepthMax.minimum=0
bottomDepthMax.maximum=512
minAbsoluteY.description=Optional absolute minimum world Y for the island base. When set, baseY is clamped upward so the tail bottom stays above this value.
minAbsoluteY.type=Integer
minAbsoluteY.default=null
maxAbsoluteY.description=Optional absolute maximum world Y for the island top. When set, the top is clamped downward.
maxAbsoluteY.type=Integer
maxAbsoluteY.default=null
localFluidHeight.description=Optional water surface height above the island base, in blocks. null = no internal water. Positive = water fills any dip in the top profile up to baseY + localFluidHeight (forms lakes/ponds in concavities of the biome-top heightmap).
localFluidHeight.type=Integer
localFluidHeight.default=null
inheritDecorators.description=When true, the target biome's decorators apply to the island's top surface.
inheritDecorators.type=boolean
inheritDecorators.default=true
inheritObjects.description=When true, the target biome's surface objects are placed on the island's top surface instead of the parent terrain.
inheritObjects.type=boolean
inheritObjects.default=true
biome.description=The target biome whose visual design (layers, palette, decorators, surface objects, derivative, and \u2014 when topShapeMode=BIOME \u2014 generator profile) drives the floating island. Leave empty to reuse the parent biome (self).
biome.type=String
biome.default=
carving.description=Optional carving biome key or dimension carving entry id whose caveProfile drives floating-island internal air pockets. Dimension carving ids resolve first; biome keys such as carving/mushroom resolve second. When set, this overrides carveStyle while carveThreshold remains a final tuning bias.
carving.type=String
carving.default=
fluidBlock.description=Block used for the internal water pool when localFluidHeight is positive.
fluidBlock.type=String
fluidBlock.default=minecraft:water
topShapeMode.description=How the top profile of the island is shaped. BIOME = evaluate target biome's own generators (mountains biome -> real mountains). NOISE = use topShapeStyle as a user-controlled heightmap. FLAT = constant maxTopHeight slab.
topShapeMode.type=TopShapeMode
topShapeMode.default=BIOME
bottomPaletteMode.description=Controls the material palette near the island underside. DEPTH keeps the old top-down depth behavior. MIRROR_TOP uses the target biome's shallow/top palette from the underside upward. CUSTOM uses bottomPalette near the underside while keeping the target biome palette near the top.
bottomPaletteMode.type=FloatingBottomPaletteMode
bottomPaletteMode.default=DEPTH
topObjectMode.description=Controls how topObjectOverrides are combined with the inherited surface objects from the target biome. INHERIT_ONLY (default) = behaves identically to before this field was added. MERGE = appends overrides after inherited objects. REPLACE = uses only overrides, ignoring all inherited objects.
topObjectMode.type=OverrideMode
topObjectMode.default=INHERIT_ONLY
bottomObjectMode.description=Controls how bottomObjectOverrides are combined. INHERIT_ONLY (default) = no bottom objects placed (there is no inherited bottom set). MERGE = same as REPLACE for bottom (no inherited source). REPLACE = uses bottomObjectOverrides list only.
bottomObjectMode.type=OverrideMode
bottomObjectMode.default=INHERIT_ONLY
TopShapeMode.choices=BIOME,NOISE,FLAT
TopShapeMode.BIOME.description=Evaluate the target biome's own terrain generators to build the island top. Mountains biome produces real peaks, desert produces dunes, plains is flat. Recommended default.
TopShapeMode.NOISE.description=Drive the top profile from topShapeStyle noise, independent of the target biome's generators. Amplitude controlled by topShapeAmp.
TopShapeMode.FLAT.description=Flat slab on top, topHeight blocks above the base. Ignores noise and biome generators.
FloatingBottomPaletteMode.choices=DEPTH,MIRROR_TOP,CUSTOM
FloatingBottomPaletteMode.DEPTH.description=Use the normal top-down biome layer depth for the whole island column.
FloatingBottomPaletteMode.MIRROR_TOP.description=Use the target biome's top palette from both the island top and underside, meeting in the middle.
FloatingBottomPaletteMode.CUSTOM.description=Use bottomPalette near the underside and the target biome's normal palette near the top.
OverrideMode.choices=INHERIT_ONLY,MERGE,REPLACE
OverrideMode.INHERIT_ONLY.description=Ignore the override list entirely. Use only the inherited objects from the target biome (subject to inheritObjects).
OverrideMode.MERGE.description=Append override list entries after the inherited objects from the target biome. Both sets are placed.
OverrideMode.REPLACE.description=Use only the override list. The inherited objects from the target biome are discarded regardless of inheritObjects.
height.context=absoluteWorldY
pair.rule=editorOrdered
nested.policy=palettesAndObjectsReadOnly
