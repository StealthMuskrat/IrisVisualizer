steps.description=Restrict feature generation to these decoration steps only. Empty (the default) means every step is eligible. Use this to import ores without importing vegetation: set it to UNDERGROUND_ORES.
disabledSteps.description=Decoration steps to deny. Applied after 'steps', so a step listed here never generates even if 'steps' allows it. VEGETAL_DECORATION is the usual entry for packs that grow their own trees.
biomeRules.description=Per-biome denials applied on top of 'disabled' and 'disabledExact'. Each rule names registry biomes and the placed features it denies in those biomes only, so a mod tree injected into vanilla forests can be denied there while the mod's own biomes keep it.
rule.biomes.description=Registry biomes this rule applies to: an exact key such as 'minecraft:forest', a namespace such as 'minecraft:', or a biome tag such as '#minecraft:is_forest'.
rule.disabled.description=Placed feature families denied in the matched biomes, matched like importedFeatures.disabled on namespace, slash, or underscore boundaries.
rule.disabledExact.description=Exact placed feature keys denied in the matched biomes after trimming and case normalization.
frequencyOverrides.description=Exact registered structure-set frequency overrides for native generation. The last entry for a normalized structure-set key wins. These do not convert native structures into Iris placements and affect only newly generated chunks.
step.RAW_GENERATION.description=Raw generation - the earliest step, before lakes.
step.LAKES.description=Lakes.
step.LOCAL_MODIFICATIONS.description=Local modifications such as amethyst geodes, icebergs and dripstone clusters.
step.UNDERGROUND_STRUCTURES.description=Underground structure features (not the structure system - features tagged as underground structures).
step.SURFACE_STRUCTURES.description=Surface structure features.
step.STRONGHOLDS.description=Stronghold step.
step.UNDERGROUND_ORES.description=Underground ores. This is the step that carries vanilla and mod ore veins.
step.UNDERGROUND_DECORATION.description=Underground decoration such as glow lichen, sculk patches and cave vegetation.
step.FLUID_SPRINGS.description=Fluid springs - the small water and lava spring features.
step.VEGETAL_DECORATION.description=Vegetal decoration - trees, grass, flowers, kelp and most surface plant life.
step.TOP_LAYER_MODIFICATION.description=Top layer modification - freezing and snow placement.
steps=RAW_GENERATION,LAKES,LOCAL_MODIFICATIONS,UNDERGROUND_STRUCTURES,SURFACE_STRUCTURES,STRONGHOLDS,UNDERGROUND_ORES,UNDERGROUND_DECORATION,FLUID_SPRINGS,VEGETAL_DECORATION,TOP_LAYER_MODIFICATION
structureSet.description=Exact registered structure-set key, for example 'minecraft:nether_complexes'. Structure keys such as 'minecraft:fortress' are not valid here.
multiplier.minimum=0.01
multiplier.maximum=16
multiplier.description=Requested placement-density multiplier. Random-spread sets scale their placement frequency first and then their integer chunk spacing; integer spacing and separation constraints can make the realized increase slightly lower or higher. The default 1 leaves the registered placement unchanged.
multiplier.default=1
step.policy=denyAfterAllow
frequency.policy=lastNormalizedKeyWins
registry.policy=syntaxOnly
