erosion.default={}
erosion.description=How the ground around the channel is eroded into a valley.
bed.default={}
bed.description=Material under and beside the water: falling-block replacement and padding.
banks.excavation.default={}
banks.excavation.description=Limits dry bank cut depth, fill height, width, and excavated volume independently of the wet channel. Fill also respects channel.maximumIncision and local river policy.
erosion.enabled.type=boolean
erosion.enabled.description=Erode the ground beyond the shore band into a valley; false keeps only the wet channel, the shore band and the lip that holds the water.
erosion.enabled.default=true
erosion.smoothingRadius.type=int
erosion.smoothingRadius.description=Stations along the course the valley width is averaged over, so it widens and narrows gradually; 0 follows the local cut exactly.
erosion.smoothingRadius.default=12
erosion.smoothingRadius.minimum=0
erosion.smoothingRadius.maximum=64
erosion.thalwegFraction.type=double
erosion.thalwegFraction.description=Share of the distance from the thalweg to each waterline that stays at full bed depth before the bed rises to the edge; higher is a flatter, broader bed.
erosion.thalwegFraction.default=0.45
erosion.thalwegFraction.minimum=0
erosion.thalwegFraction.maximum=0.95
erosion.blendCurve.type=double
erosion.blendCurve.description=Exponent on the blend from the bank top out to natural terrain; below 1 hollows the valley sides, above 1 keeps them steep near the shore.
erosion.blendCurve.default=1
erosion.blendCurve.minimum=0.25
erosion.blendCurve.maximum=4
erosion.bedNoise.type=double
erosion.bedNoise.description=Share of the channel roughness applied to the bed as depth variation; 0 leaves a smooth bed.
erosion.bedNoise.default=0.5
erosion.bedNoise.minimum=0
erosion.bedNoise.maximum=2
erosion.terraceSteps.type=int
erosion.terraceSteps.description=Number of level steps the valley side is cut into when style is TERRACED; ignored by every other style.
erosion.terraceSteps.default=4
erosion.terraceSteps.minimum=2
erosion.terraceSteps.maximum=16
erosion.cliffFraction.type=double
erosion.cliffFraction.description=Share of the eroded band kept level at the bank top before the vertical wall when style is CLIFF; ignored by every other style.
erosion.cliffFraction.default=0.5
erosion.cliffFraction.minimum=0
erosion.cliffFraction.maximum=1
bed.allowGravityBlocks.type=boolean
bed.allowGravityBlocks.description=Allow sand, gravel and other falling blocks in the bed, shore and eroded banks. When false they are replaced by the padding palette.
bed.allowGravityBlocks.default=true
bed.padding.type=int
bed.padding.description=Blocks below the bed that are also kept free of falling blocks, so nothing under the water can collapse.
bed.padding.default=2
bed.padding.minimum=0
bed.padding.maximum=8
banks.excavation.maximumDepth.type=int
banks.excavation.maximumDepth.description=Maximum blocks cut or filled vertically in a dry bank column. Fill is also limited by the local channel incision policy. Zero preserves dry bank heights.
banks.excavation.maximumDepth.default=8
banks.excavation.maximumDepth.minimum=0
banks.excavation.maximumDepth.maximum=64
banks.excavation.maximumWidth.type=int
banks.excavation.maximumWidth.description=Maximum horizontal distance from the channel outline affected by shore and bank shaping.
banks.excavation.maximumWidth.default=16
banks.excavation.maximumWidth.minimum=1
banks.excavation.maximumWidth.maximum=64
banks.excavation.maximumVolumePerBlock.type=int
banks.excavation.maximumVolumePerBlock.description=Maximum dry bank blocks removed per block, measured over sixteen-block reaches. Courses exceeding this budget are rejected.
banks.excavation.maximumVolumePerBlock.default=256
banks.excavation.maximumVolumePerBlock.minimum=0
banks.excavation.maximumVolumePerBlock.maximum=8192
erosion.style.type=enum
erosion.style.description=Shape of the valley side between the shore bench and natural terrain. SMOOTH is the eased curve used before this field existed.
erosion.style.default=SMOOTH
erosion.style.choices=SMOOTH,LINEAR,CONCAVE,TERRACED,CLIFF
erosion.style.SMOOTH.description=An eased S-curve from the bank top out to natural terrain, flat at both ends and steepest across the middle of the band; blendCurve skews it.
erosion.style.LINEAR.description=A straight slope from the bank top to natural terrain with a sharp shoulder at the shore and a sharp lip at the top; blendCurve bends it.
erosion.style.CONCAVE.description=A hollowed valley side that climbs fast beside the shore and flattens out toward natural terrain; blendCurve deepens the hollow.
erosion.style.TERRACED.description=The eased curve cut into level steps, terraceSteps of them between the bank top and natural terrain.
erosion.style.CLIFF.description=A level bench at the bank top for cliffFraction of the band, then a vertical wall up to natural terrain.
erosion.bedProfile.type=enum
erosion.bedProfile.description=Cross-section of the wet channel bed from the thalweg out to the waterline. Curves shift the thalweg toward the outside bank within the existing depth limit.
erosion.bedProfile.default=BOWL
erosion.bedProfile.choices=BOWL,FLAT,V,U
erosion.bedProfile.BOWL.description=A level thalweg over thalwegFraction of the half-width that eases up to a one-block edge; a broad bowl.
erosion.bedProfile.FLAT.description=Full depth across the whole width, so the channel edge drops straight to the bed.
erosion.bedProfile.V.description=A straight slope from full depth at the centerline to one block at the edge; thalwegFraction is ignored.
erosion.bedProfile.U.description=A level thalweg over thalwegFraction of the half-width that stays deep almost to the edge, then rises steeply; a trough with steep sides.
