scale.size.description=Fixed scale multiplier for this object. 0.5 shrinks to half size, 2.0 doubles the size. When set to anything other than 1, this overrides minimumScale and maximumScale. Leave at 1 to use the minimumScale/maximumScale range.
scale.size.default=1
scale.variations.minimum=1
scale.variations.maximum=32
scale.variations.description=Iris Objects are scaled and cached to speed up placements. Because of this extra memory is used, so we evenly distribute variations across the defined scale range, then pick one randomly. If the differences is small, use a lower number. For more possibilities on the scale spectrum, increase this at the cost of memory.
scale.variations.default=7
scale.minimumScale.minimum=0.01
scale.minimumScale.maximum=50
scale.minimumScale.description=The minimum scale. Used when size is 1 to pick a random scale per placement.
scale.minimumScale.default=1
scale.maximumScale.minimum=0.01
scale.maximumScale.maximum=50
scale.maximumScale.description=The maximum scale. Used when size is 1 to pick a random scale per placement.
scale.maximumScale.default=1
scale.interpolation.choices=NONE,TRILINEAR,TRICUBIC,TRIHERMITE
scale.interpolation.default=NONE
scale.interpolation.NONE.description=Don't interpolate, big cubes
scale.interpolation.TRILINEAR.description=Uses linear interpolation in 3 dimensions, generally pretty good, but slow
scale.interpolation.TRICUBIC.description=Uses cubic spline interpolation in 3 dimensions, even better, but extreme slowdowns
scale.interpolation.TRIHERMITE.description=Uses hermite spline interpolation in 3 dimensions, even better, but extreme slowdowns
densityStyle.min.default=16
densityStyle.max.default=32
densityStyle.style.default=STATIC
densityStyle.description=If the chance check passes, and you specify this, it picks a number in the range based on noise, and 'density' is ignored.
scale.description=Explicit object scale. When omitted, the dimension's allObjectScaleFactor applies. Any authored scale, including size 1, overrides that factor.
scale.interpolation.description=If this object is scaled up beyond its origin size, specify a 3D interpolator. NONE keeps blocky scaled output, TRILINEAR (LERP) smooths with linear interpolation, TRICUBIC and TRIHERMITE produce smoother but slower output.
