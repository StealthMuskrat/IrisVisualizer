object.description=Object load key under objects/, without the .iob extension
position.description=Absolute world X, Y and Z for the object's saved origin. Rotation and scaling keep this origin fixed.
rotation.description=Fixed rotation around the saved object origin, in degrees. All axes default to zero.
scale.description=Explicit fixed size multiplier. When omitted, the dimension's allObjectScaleFactor applies. An explicit 1 preserves the saved size.
scaleInterpolation.description=Interpolation used when enlarging the object. NONE preserves blocky shapes.
edit.description=Material and block-state replacements applied before rotation, without changing the source object
bore.description=Replace blocks inside the object's transformed bounding box with air before placing its blocks
smartBore.description=Fill enclosed rooms and pockets with air before placement, preserving their empty interiors
seed.description=Fixed seed for block replacement palettes and probabilities, independent of the world seed and chunk generation order.
allObjectScaleFactor.description=Default size factor for objects in this dimension. 0.5 halves their size and 2 doubles it. Any explicit object or placement scale, including 1, overrides this factor. Jigsaw structures are excluded.
