trees.trunk.type=String
trees.trunk.default=minecraft:oak_log
trees.trunk.description=The trunk (log) block, e.g. minecraft:oak_log. Ignored when trunkPalette is set.
trees.leaves.type=String
trees.leaves.default=minecraft:oak_leaves
trees.leaves.description=The leaf block, e.g. minecraft:oak_leaves. Ignored when leavesPalette is set.
trees.secondaryLeaves.type=String
trees.secondaryLeaves.default=null
trees.secondaryLeaves.description=Optional accent leaf block scattered through the canopy (blossoms, shroomlight).
trees.secondaryTrunk.type=String
trees.secondaryTrunk.default=null
trees.secondaryTrunk.description=Optional secondary trunk block used over a height band (for color-banded trunks). Ignored when secondaryTrunkPalette is set.
trees.trunkPalette.type=IrisMaterialPalette
trees.trunkPalette.default=null
trees.trunkPalette.description=A noise-driven palette for the trunk. When set this overrides the single trunk block, letting the trunk mix blocks by noise.
trees.leavesPalette.type=IrisMaterialPalette
trees.leavesPalette.default=null
trees.leavesPalette.description=A noise-driven palette for the leaves. When set this overrides the single leaf block, letting the canopy mix leaf (or other) blocks by noise. Only blocks that are actually leaves get vanilla decay distances.
trees.secondaryLeavesPalette.type=IrisMaterialPalette
trees.secondaryLeavesPalette.default=null
trees.secondaryLeavesPalette.description=A noise-driven palette for the secondary (accent) leaves. When set this overrides both secondaryLeaves and weightedSecondaryLeaves.
trees.secondaryTrunkPalette.type=IrisMaterialPalette
trees.secondaryTrunkPalette.default=null
trees.secondaryTrunkPalette.description=A noise-driven palette for the secondary trunk band. When set this overrides the single secondaryTrunk block.
ruins.block.type=String
ruins.block.default=minecraft:cobblestone
ruins.block.description=The primary structural block, e.g. minecraft:cobblestone or minecraft:stone_bricks. Ignored when blockPalette is set. This is the bulk material of the ruin before weathering swaps some of it out.
ruins.weatheredBlock.type=String
ruins.weatheredBlock.default=minecraft:mossy_cobblestone
ruins.weatheredBlock.description=A single weathered block id used when weatheringPalette is not set, e.g. minecraft:mossy_cobblestone. Applied to a noise-selected fraction of the structure, biased toward the lower rows.
ruins.blockPalette.type=IrisMaterialPalette
ruins.blockPalette.default=null
ruins.blockPalette.description=A noise-driven palette for the primary block. When set this overrides the single block, letting the structure mix materials by noise. Palette wins over the block string via IrisProceduralBlocks.resolve.
ruins.weatheringPalette.type=IrisMaterialPalette
ruins.weatheringPalette.default=null
ruins.weatheringPalette.description=A palette of weathered variants (mossy/cracked block ids) blended over the structure by noise. When set this drives weathering; otherwise weatheredBlock is used.
formations.block.type=String
formations.block.default=minecraft:stone
formations.block.description=The main rock block, e.g. minecraft:stone. Ignored when blockPalette is set.
formations.capBlock.type=String
formations.capBlock.default=null
formations.capBlock.description=Optional caprock block placed on the top crown of the formation (and the wide overhanging cap for HOODOO). Ignored when capPalette is set. When null and capPalette is unset, the formation uses its main rock everywhere.
formations.blockPalette.type=IrisMaterialPalette
formations.blockPalette.default=null
formations.blockPalette.description=A noise-driven palette for the main rock body. When set this overrides the single block, letting the body mix blocks by noise.
formations.capPalette.type=IrisMaterialPalette
formations.capPalette.default=null
formations.capPalette.description=A noise-driven palette for the caprock. When set this overrides the single capBlock.
formations.strataPalette.type=IrisMaterialPalette
formations.strataPalette.default=null
formations.strataPalette.description=Optional palette of strata (horizontal colored bands) blended into the rock body by y level. When set, every strataThickness blocks of height switches to the next strata block, producing the signature banded look. Falls back to the main block where unset.
coral.block.type=String
coral.block.default=minecraft:tube_coral_block
coral.block.description=The structural coral block (the living wood of the reef), e.g. minecraft:tube_coral_block. Ignored when blockPalette is set.
coral.tipBlock.type=String
coral.tipBlock.default=null
coral.tipBlock.description=Optional tip block placed at branch tips and at the very top of the structure, e.g. coral fans or minecraft:sea_pickle. Ignored when tipPalette is set. Null disables tips.
coral.blockPalette.type=IrisMaterialPalette
coral.blockPalette.default=null
coral.blockPalette.description=A noise-driven palette for the structural coral block. When set this overrides the single block, letting the reef mix tube/brain/bubble/fire/horn coral_block tones across its body.
coral.tipPalette.type=IrisMaterialPalette
coral.tipPalette.default=null
coral.tipPalette.description=A noise-driven palette for the tip block. When set this overrides the single tipBlock, letting tips mix fan / pickle decorations.
fungi.stem.type=String
fungi.stem.default=minecraft:mushroom_stem
fungi.stem.description=The stem block, e.g. minecraft:mushroom_stem. Ignored when stemPalette is set.
fungi.cap.type=String
fungi.cap.default=minecraft:red_mushroom_block
fungi.cap.description=The cap block, e.g. minecraft:red_mushroom_block. Ignored when capPalette is set.
fungi.gillBlock.type=String
fungi.gillBlock.default=null
fungi.gillBlock.description=Optional block forming the gill layer on the underside of the cap (gills or a glow layer), e.g. minecraft:brown_mushroom_block or minecraft:shroomlight. Ignored when gillPalette is set or left null.
fungi.spotBlock.type=String
fungi.spotBlock.default=null
fungi.spotBlock.description=Optional block speckled across the top of the cap by noise (white toadstool dots, warts, glowing spots), e.g. minecraft:bone_block or minecraft:white_concrete. Ignored when spotPalette is set or left null.
fungi.stemPalette.type=IrisMaterialPalette
fungi.stemPalette.default=null
fungi.stemPalette.description=A noise-driven palette for the stem. When set this overrides the single stem block, letting the stem mix blocks by noise.
fungi.capPalette.type=IrisMaterialPalette
fungi.capPalette.default=null
fungi.capPalette.description=A noise-driven palette for the cap. When set this overrides the single cap block, letting the cap mix blocks by noise.
fungi.gillPalette.type=IrisMaterialPalette
fungi.gillPalette.default=null
fungi.gillPalette.description=A noise-driven palette for the underside gill layer. When set this overrides the single gillBlock.
fungi.spotPalette.type=IrisMaterialPalette
fungi.spotPalette.default=null
fungi.spotPalette.description=A noise-driven palette for the cap top spots. When set this overrides the single spotBlock.
crystals.block.type=String
crystals.block.default=minecraft:amethyst_block
crystals.block.description=The primary crystal shard block, e.g. minecraft:amethyst_block. Ignored when blockPalette is set.
crystals.tipBlock.type=String
crystals.tipBlock.default=null
crystals.tipBlock.description=Optional block placed at the very tip of each shard for a different colored or sparkling point (e.g. minecraft:amethyst_cluster or glowstone). Ignored when tipPalette is set. If unset and glow is true, a light-emitting block is sprinkled among the tips instead.
crystals.glowBlock.type=String
crystals.glowBlock.default=minecraft:glowstone
crystals.glowBlock.description=The light-emitting block sprinkled among the tips when glow is true and no tip block is configured.
crystals.baseBlock.type=String
crystals.baseBlock.default=minecraft:budding_amethyst
crystals.baseBlock.description=Optional block for the budding base blob the shards grow from, e.g. minecraft:budding_amethyst or calcite. Ignored when basePalette is set. If unset, the base is built from the primary shard block.
crystals.blockPalette.type=IrisMaterialPalette
crystals.blockPalette.default=null
crystals.blockPalette.description=A noise-driven palette for the crystal shards (a prismatic mix, e.g. amethyst_block, calcite, tinted_glass). When set this overrides the single block, letting the shards mix blocks by noise. Palette wins.
crystals.tipPalette.type=IrisMaterialPalette
crystals.tipPalette.default=null
crystals.tipPalette.description=A noise-driven palette for the shard tips. When set this overrides the single tipBlock. Palette wins.
crystals.basePalette.type=IrisMaterialPalette
crystals.basePalette.default=null
crystals.basePalette.description=A noise-driven palette for the budding base blob. When set this overrides the single baseBlock. Palette wins.
palette.classBlock=STONE
palette.classStyle=STATIC
palette.classZoom=5
palette.activation=nonempty
palette.absentOrNull=nativeRoleFallback
stilt.absentOrNull=objectLayerFallback
newBlocks.policy=minecraftOrUnnamespacedSyntax
