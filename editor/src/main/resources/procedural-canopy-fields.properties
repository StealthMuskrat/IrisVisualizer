canopy.fields=startAngle,squish,mode,leafDensity,crownStretchX,crownStretchZ,layers,branches
canopy.startAngle.type=double
canopy.startAngle.description=Elevation angle in degrees from vertical for each leaf dome. 90 is a flat disc, below 90 domes downward into a sphere, above 90 flares outward into an umbrella.
canopy.startAngle.default=90
canopy.startAngle.minimum=0
canopy.startAngle.maximum=180
canopy.squish.type=double
canopy.squish.description=Vertical scale of the canopy volume. Lower values flatten the crown.
canopy.squish.default=1
canopy.squish.minimum=0
canopy.squish.maximum=1
canopy.mode.type=IrisTreeLeafMode
canopy.mode.description=How leaves fill each canopy disc.
canopy.mode.default=TRIMMED
canopy.mode.choices=TRIMMED,FILLED,DENSITY,NOISE,HOLLOW,GRADIENT,CLUMPED,TATTERED,SPARSE
canopy.mode.TRIMMED.description=Corner-trimmed disc/sphere for a rounded silhouette.
canopy.mode.FILLED.description=Completely filled disc/sphere.
canopy.mode.DENSITY.description=Seeded probabilistic falloff toward the edge controlled by leafDensity.
canopy.mode.NOISE.description=Seeded value-noise mask controlled by leafDensity.
canopy.mode.HOLLOW.description=Only the outer shell is placed, leaving the interior hollow.
canopy.mode.GRADIENT.description=Quadratic radial gradient: dense at the center, thinning sharply toward the edge.
canopy.mode.CLUMPED.description=Coarse low-frequency noise that forms clumps and gaps of foliage.
canopy.mode.TATTERED.description=Trimmed with heavy random erosion of the outer ring for a ragged, weathered look.
canopy.mode.SPARSE.description=Very thin scattering of leaves across the volume.
canopy.leafDensity.type=double
canopy.leafDensity.description=Fill probability used by the density and noise leaf modes.
canopy.leafDensity.default=0.85
canopy.leafDensity.minimum=0
canopy.leafDensity.maximum=1
canopy.crownStretchX.type=double
canopy.crownStretchX.description=Horizontal X stretch of the crown for elliptical or wind-blown shapes. 1 is circular.
canopy.crownStretchX.default=1
canopy.crownStretchX.minimum=0.1
canopy.crownStretchZ.type=double
canopy.crownStretchZ.description=Horizontal Z stretch of the crown for elliptical or wind-blown shapes. 1 is circular.
canopy.crownStretchZ.default=1
canopy.crownStretchZ.minimum=0.1
canopy.layers.type=KList<IrisTreeLayer>
canopy.layers.description=Optional explicit crown discs. When provided these replace the profile-driven layers and let you sculpt the silhouette by hand.
canopy.layers.default=new KList<>()
canopy.branches.type=IrisTreeBranches
canopy.branches.description=Optional branch system. When present, branches build most of the canopy and only the topmost profile disc is still placed as a crown.
canopy.branches.default=null
