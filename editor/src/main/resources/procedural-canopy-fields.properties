branches.probabilityFunction.type=IrisTreeBranchProbability
branches.probabilityFunction.description=How branch spawn chance varies over trunk height.
branches.probabilityFunction.default=TOP_HEAVY
branches.probabilityFunction.choices=CONSTANT,LINEAR,SIGMOID,TOP_HEAVY,GAUSSIAN,NOISE,BOTTOM_HEAVY,PERIODIC,BAND,INVERSE_GAUSSIAN,EXPONENTIAL_DECAY
branches.probabilityFunction.CONSTANT.description=Same branch chance at every height.
branches.probabilityFunction.LINEAR.description=Ramps straight from base chance to crown chance.
branches.probabilityFunction.SIGMOID.description=S-curve that switches on around a midpoint height.
branches.probabilityFunction.TOP_HEAVY.description=Chance rises with height raised to an exponent, clustering branches near the crown.
branches.probabilityFunction.GAUSSIAN.description=Bell curve peaking in a height band.
branches.probabilityFunction.NOISE.description=Irregular organic branching from deterministic noise.
branches.probabilityFunction.BOTTOM_HEAVY.description=Chance falls with height (1-t)^exponent, clustering branches near the base.
branches.probabilityFunction.PERIODIC.description=Regular whorl rings of branches at evenly spaced heights (periods controls count).
branches.probabilityFunction.BAND.description=Branches only within a height window around mean +/- std.
branches.probabilityFunction.INVERSE_GAUSSIAN.description=Inverse of GAUSSIAN: branches avoid the mean band and favor base and crown.
branches.probabilityFunction.EXPONENTIAL_DECAY.description=Exponential decay from the base upward (constant * e^-exponent*t).
branches.probabilityConstant.type=double
branches.probabilityConstant.description=Branch chance for the CONSTANT probability function.
branches.probabilityConstant.default=0.5
branches.probabilityConstant.minimum=0
branches.probabilityBase.type=double
branches.probabilityBase.description=Branch chance at the base for the LINEAR probability function.
branches.probabilityBase.default=0
branches.probabilityBase.minimum=0
branches.probabilityCrown.type=double
branches.probabilityCrown.description=Branch chance at the crown for the LINEAR probability function.
branches.probabilityCrown.default=1
branches.probabilityCrown.minimum=0
branches.probabilitySteepness.type=double
branches.probabilitySteepness.description=Steepness for the SIGMOID probability function.
branches.probabilitySteepness.default=10
branches.probabilityMidpoint.type=double
branches.probabilityMidpoint.description=Midpoint height (0-1) for the SIGMOID probability function.
branches.probabilityMidpoint.default=0.7
branches.probabilityExponent.type=double
branches.probabilityExponent.description=Exponent for the TOP_HEAVY probability function.
branches.probabilityExponent.default=2
branches.probabilityMean.type=double
branches.probabilityMean.description=Mean height (0-1) for the GAUSSIAN probability function.
branches.probabilityMean.default=0.7
branches.probabilityStd.type=double
branches.probabilityStd.description=Standard deviation for the GAUSSIAN probability function.
branches.probabilityStd.default=0.15
branches.probabilityScale.type=double
branches.probabilityScale.description=Noise scale for the NOISE probability function.
branches.probabilityScale.default=1
branches.probabilityPeriods.type=double
branches.probabilityPeriods.description=Number of whorl rings over the trunk height for the PERIODIC probability function.
branches.probabilityPeriods.default=5
branches.probabilityPeriods.minimum=0
branches.lengthFunction.type=IrisTreeFunction
branches.lengthFunction.description=How branch length varies over trunk height.
branches.lengthFunction.default=LINEAR
branches.lengthFunction.choices=CONSTANT,LINEAR,SIGMOID,LOG,SINE,PARABOLIC,EXPONENTIAL,SQRT,STEP,BELL,EASE_IN_OUT
branches.lengthFunction.CONSTANT.description=Same value at every height.
branches.lengthFunction.LINEAR.description=Ramps straight from start to end.
branches.lengthFunction.SIGMOID.description=S-curve transition controlled by steepness.
branches.lengthFunction.LOG.description=Logarithmic falloff controlled by base.
branches.lengthFunction.SINE.description=Sine ripple controlled by period and amplitude.
branches.lengthFunction.PARABOLIC.description=Parabolic pinch, narrowest at peakOffset.
branches.lengthFunction.EXPONENTIAL.description=Geometric (exponential) interpolation from start to end.
branches.lengthFunction.SQRT.description=Square-root ease: fast change low, slow high.
branches.lengthFunction.STEP.description=Hard step that jumps from start to end at the threshold (peakOffset).
branches.lengthFunction.BELL.description=Bell bulge peaking in the middle of the height range.
branches.lengthFunction.EASE_IN_OUT.description=Smoothstep ease-in-out (3t^2 - 2t^3).
branches.lengthBase.type=double
branches.lengthBase.description=Branch length at the base for the LINEAR length function.
branches.lengthBase.default=1
branches.lengthBase.minimum=0
branches.lengthCrown.type=double
branches.lengthCrown.description=Branch length at the crown for the LINEAR length function.
branches.lengthCrown.default=4
branches.lengthCrown.minimum=0
branches.lengthConstant.type=double
branches.lengthConstant.description=Branch length for the CONSTANT length function.
branches.lengthConstant.default=3
branches.lengthConstant.minimum=0
branches.lengthMax.type=double
branches.lengthMax.description=Maximum branch length for the SIGMOID, LOG and PARABOLIC length functions.
branches.lengthMax.default=4
branches.lengthMax.minimum=0
branches.lengthSteepness.type=double
branches.lengthSteepness.description=Steepness for the SIGMOID length function.
branches.lengthSteepness.default=5
branches.azimuthMode.type=IrisTreeAzimuthMode
branches.azimuthMode.description=How the compass direction of each branch is chosen.
branches.azimuthMode.default=RANDOM
branches.azimuthMode.choices=CONSTANT,LINEAR,SPIRAL,SINE,NOISE,RANDOM,GOLDEN_ANGLE,ALTERNATING,WHORL,ZIGZAG
branches.azimuthMode.CONSTANT.description=A single fixed azimuth.
branches.azimuthMode.LINEAR.description=Azimuth ramps straight from start to end with height.
branches.azimuthMode.SPIRAL.description=Azimuth winds around the trunk a number of turns (corkscrew).
branches.azimuthMode.SINE.description=Azimuth oscillates with a sine wave.
branches.azimuthMode.NOISE.description=Azimuth wanders using deterministic noise.
branches.azimuthMode.RANDOM.description=Each branch picks a uniformly random azimuth (falls back to constant for trunk lean).
branches.azimuthMode.GOLDEN_ANGLE.description=Phyllotaxis: each successive branch is offset by the 137.5 degree golden angle for the most natural spiral packing (branches).
branches.azimuthMode.ALTERNATING.description=Each successive branch is thrown to the opposite side (180 degrees apart).
branches.azimuthMode.WHORL.description=Branches are grouped into evenly spaced whorls of azimuthWhorlCount around each ring.
branches.azimuthMode.ZIGZAG.description=Azimuth zigzags by +/- amplitude on alternating branches.
branches.azimuth.type=double
branches.azimuth.description=Fixed azimuth in degrees when azimuthMode is CONSTANT.
branches.azimuth.default=0
branches.elevation.type=double
branches.elevation.description=Elevation angle in degrees from horizontal. 0 is flat, positive points up, negative droops down.
branches.elevation.default=0
branches.sag.type=double
branches.sag.description=How much each branch sags/droops along its length (catenary). 0 is a straight branch; higher values arc the branch and its tip downward.
