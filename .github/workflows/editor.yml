          Invoke-WebRequest 'https://raw.githubusercontent.com/VolmitSoftware/Iris/c3359e0a16438b1bb8468901c6171dcefdf63f7f/core/src/main/java/art/arcane/iris/generation/cave/IrisCaveProfile.java' -OutFile IrisCaveProfile.java
          python editor/tools/test_cave_fields.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python editor/tools/extract_cave_fields.py IrisCaveProfile.java IrisDimension.java IrisRegion.java IrisBiome.java generated-cave.properties IrisGeneratorStyle.java
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash generated-cave.properties).Hash -ne (Get-FileHash editor/src/main/resources/cave-profile-fields.properties).Hash) { throw 'Pinned cave definitions differ' }
      - name: Verify pinned cave bounds and placement definitions
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://raw.githubusercontent.com/VolmitSoftware/Iris/c3359e0a16438b1bb8468901c6171dcefdf63f7f/core/src/main/java/art/arcane/iris/pack/value/IrisRange.java' -OutFile IrisRange.java
          Invoke-WebRequest 'https://raw.githubusercontent.com/VolmitSoftware/Iris/c3359e0a16438b1bb8468901c6171dcefdf63f7f/core/src/main/java/art/arcane/iris/generation/cave/IrisCaveAnchorMode.java' -OutFile IrisCaveAnchorMode.java
          Invoke-WebRequest 'https://raw.githubusercontent.com/VolmitSoftware/Iris/c3359e0a16438b1bb8468901c6171dcefdf63f7f/core/src/main/java/art/arcane/iris/structure/object/ObjectPlaceMode.java' -OutFile ObjectPlaceMode.java
          python editor/tools/test_cave_placement_fields.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python editor/tools/extract_cave_placement_fields.py IrisCaveProfile.java IrisRange.java IrisCaveAnchorMode.java ObjectPlaceMode.java generated-cave-placement.properties
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash generated-cave-placement.properties).Hash -ne (Get-FileHash editor/src/main/resources/cave-placement-fields.properties).Hash) { throw 'Pinned cave placement definitions differ' }
      - name: Verify pinned cave density threshold definitions
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://raw.githubusercontent.com/VolmitSoftware/Iris/c3359e0a16438b1bb8468901c6171dcefdf63f7f/core/src/main/java/art/arcane/iris/generation/noise/IrisStyledRange.java' -OutFile IrisStyledRange.java
          python editor/tools/test_cave_threshold_fields.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python editor/tools/extract_cave_threshold_fields.py IrisCaveProfile.java IrisStyledRange.java IrisGeneratorStyle.java generated-cave-threshold.properties
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash generated-cave-threshold.properties).Hash -ne (Get-FileHash editor/src/main/resources/cave-threshold-fields.properties).Hash) { throw 'Pinned cave threshold definitions differ' }
      - name: Verify pinned cave module definitions
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://raw.githubusercontent.com/VolmitSoftware/Iris/c3359e0a16438b1bb8468901c6171dcefdf63f7f/core/src/main/java/art/arcane/iris/generation/cave/IrisCaveFieldModule.java' -OutFile IrisCaveFieldModule.java
          python editor/tools/test_cave_module_fields.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python editor/tools/extract_cave_module_fields.py IrisCaveProfile.java IrisCaveFieldModule.java IrisRange.java IrisGeneratorStyle.java generated-cave-module.properties
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash generated-cave-module.properties).Hash -ne (Get-FileHash editor/src/main/resources/cave-module-fields.properties).Hash) { throw 'Pinned cave module definitions differ' }
      - name: Verify pinned river policy definitions
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://raw.githubusercontent.com/VolmitSoftware/Iris/c3359e0a16438b1bb8468901c6171dcefdf63f7f/core/src/main/java/art/arcane/iris/generation/hydrology/IrisRiverPolicy.java' -OutFile IrisRiverPolicy.java
          Invoke-WebRequest 'https://raw.githubusercontent.com/VolmitSoftware/Iris/c3359e0a16438b1bb8468901c6171dcefdf63f7f/core/src/main/java/art/arcane/iris/generation/hydrology/IrisRiverPlacementMode.java' -OutFile IrisRiverPlacementMode.java
          Invoke-WebRequest 'https://raw.githubusercontent.com/VolmitSoftware/Iris/c3359e0a16438b1bb8468901c6171dcefdf63f7f/core/src/main/java/art/arcane/iris/generation/hydrology/IrisRiverRoutingMode.java' -OutFile IrisRiverRoutingMode.java
          python editor/tools/test_river_policy_fields.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python editor/tools/extract_river_policy_fields.py IrisRiverPolicy.java IrisDimension.java IrisRegion.java IrisBiome.java IrisRiverPlacementMode.java IrisRiverRoutingMode.java generated-river-policy.properties
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash generated-river-policy.properties).Hash -ne (Get-FileHash editor/src/main/resources/river-policy-fields.properties).Hash) { throw 'Pinned river policy definitions differ' }
      - name: Verify pinned dimension river ID catalog definitions
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://raw.githubusercontent.com/VolmitSoftware/Iris/c3359e0a16438b1bb8468901c6171dcefdf63f7f/core/src/main/java/art/arcane/iris/generation/hydrology/IrisHydrology.java' -OutFile IrisHydrology.java
          Invoke-WebRequest 'https://raw.githubusercontent.com/VolmitSoftware/Iris/c3359e0a16438b1bb8468901c6171dcefdf63f7f/core/src/main/java/art/arcane/iris/generation/hydrology/IrisRiverHydrology.java' -OutFile IrisRiverHydrology.java
          Invoke-WebRequest 'https://raw.githubusercontent.com/VolmitSoftware/Iris/c3359e0a16438b1bb8468901c6171dcefdf63f7f/core/src/main/java/art/arcane/iris/generation/hydrology/IrisRiverProfile.java' -OutFile IrisRiverProfile.java
          Invoke-WebRequest 'https://raw.githubusercontent.com/VolmitSoftware/Iris/c3359e0a16438b1bb8468901c6171dcefdf63f7f/core/src/main/java/art/arcane/iris/generation/hydrology/IrisSurfacePoolConfig.java' -OutFile IrisSurfacePoolConfig.java
          python editor/tools/test_river_id_fields.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python editor/tools/extract_river_id_fields.py IrisRiverPolicy.java IrisDimension.java IrisHydrology.java IrisRiverHydrology.java IrisRiverProfile.java IrisSurfacePoolConfig.java generated-river-id.properties
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash generated-river-id.properties).Hash -ne (Get-FileHash editor/src/main/resources/river-id-fields.properties).Hash) { throw 'Pinned river ID definitions differ' }
      - name: Verify pinned physical hydrology routing definitions
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://raw.githubusercontent.com/VolmitSoftware/Iris/c3359e0a16438b1bb8468901c6171dcefdf63f7f/core/src/main/java/art/arcane/iris/generation/hydrology/IrisRiverRoutingConfig.java' -OutFile IrisRiverRoutingConfig.java
          python editor/tools/test_hydrology_fields.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python editor/tools/extract_hydrology_fields.py IrisDimension.java IrisHydrology.java IrisRiverHydrology.java IrisRiverRoutingConfig.java generated-hydrology.properties
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash generated-hydrology.properties).Hash -ne (Get-FileHash editor/src/main/resources/hydrology-fields.properties).Hash) { throw 'Pinned hydrology definitions differ' }
