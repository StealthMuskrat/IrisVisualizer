name: Windows editor
on:
  pull_request:
    paths: ['editor/**', '.github/workflows/editor.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  editor:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          architecture: x64
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Verify source-derived field definitions
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://raw.githubusercontent.com/VolmitSoftware/Iris/c3359e0a16438b1bb8468901c6171dcefdf63f7f/core/src/main/java/art/arcane/iris/generation/terrain/IrisDimension.java' -OutFile IrisDimension.java
          Invoke-WebRequest 'https://raw.githubusercontent.com/VolmitSoftware/Iris/c3359e0a16438b1bb8468901c6171dcefdf63f7f/core/src/main/java/art/arcane/iris/structure/nativegen/IrisImportedStructureControl.java' -OutFile IrisImportedStructureControl.java
          Invoke-WebRequest 'https://raw.githubusercontent.com/VolmitSoftware/Iris/c3359e0a16438b1bb8468901c6171dcefdf63f7f/core/src/main/java/art/arcane/iris/structure/nativegen/IrisImportedFeatureControl.java' -OutFile IrisImportedFeatureControl.java
          python editor/tools/extract_dimension_fields.py IrisDimension.java generated-fields.properties IrisImportedStructureControl.java IrisImportedFeatureControl.java
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash generated-fields.properties).Hash -ne (Get-FileHash editor/src/main/resources/dimension-fields.properties).Hash) { throw 'Pinned Iris field definitions differ' }
      - name: Verify pinned official starter templates
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://raw.githubusercontent.com/VolmitSoftware/Iris/c3359e0a16438b1bb8468901c6171dcefdf63f7f/core/src/main/java/art/arcane/iris/studio/StudioSVC.java' -OutFile StudioSVC.java
          python editor/tools/extract_starter.py StudioSVC.java generated-starter
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($file in Get-ChildItem generated-starter -File) {
            $expected = Join-Path 'editor/src/main/resources/starter' $file.Name
            if ((Get-FileHash $file.FullName).Hash -ne (Get-FileHash $expected).Hash) { throw "Pinned starter differs: $($file.Name)" }
          }
      - name: Verify pinned biome field definitions
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://raw.githubusercontent.com/VolmitSoftware/Iris/c3359e0a16438b1bb8468901c6171dcefdf63f7f/core/src/main/java/art/arcane/iris/generation/biome/IrisBiome.java' -OutFile IrisBiome.java
          Invoke-WebRequest 'https://raw.githubusercontent.com/VolmitSoftware/Iris/c3359e0a16438b1bb8468901c6171dcefdf63f7f/core/src/main/java/art/arcane/iris/generation/biome/IrisBiomeGeneratorLink.java' -OutFile IrisBiomeGeneratorLink.java
          python editor/tools/extract_biome_fields.py IrisBiome.java IrisBiomeGeneratorLink.java generated-biome.properties
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash generated-biome.properties).Hash -ne (Get-FileHash editor/src/main/resources/biome-fields.properties).Hash) { throw 'Pinned biome definitions differ' }
      - name: Verify pinned generator field definitions
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://raw.githubusercontent.com/VolmitSoftware/Iris/c3359e0a16438b1bb8468901c6171dcefdf63f7f/core/src/main/java/art/arcane/iris/generation/noise/IrisGenerator.java' -OutFile IrisGenerator.java
          Invoke-WebRequest 'https://raw.githubusercontent.com/VolmitSoftware/Iris/c3359e0a16438b1bb8468901c6171dcefdf63f7f/core/src/main/java/art/arcane/iris/generation/noise/IrisInterpolator.java' -OutFile IrisInterpolator.java
          python editor/tools/extract_generator_fields.py IrisGenerator.java IrisInterpolator.java generated-generator.properties
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash generated-generator.properties).Hash -ne (Get-FileHash editor/src/main/resources/generator-fields.properties).Hash) { throw 'Pinned generator definitions differ' }
      - name: Verify pinned interpolation methods
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://raw.githubusercontent.com/VolmitSoftware/VolmLib/210705c5ab1321dc74b86b48457fd6d5e0452944/shared/src/main/java/art/arcane/volmlib/util/interpolation/InterpolationMethod.java' -OutFile InterpolationMethod.java
          python editor/tools/test_interpolation_fields.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python editor/tools/extract_interpolation_fields.py IrisInterpolator.java InterpolationMethod.java generated-interpolation.properties
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash generated-interpolation.properties).Hash -ne (Get-FileHash editor/src/main/resources/interpolation-fields.properties).Hash) { throw 'Pinned interpolation definitions differ' }
      - name: Verify pinned region field definitions
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://raw.githubusercontent.com/VolmitSoftware/Iris/c3359e0a16438b1bb8468901c6171dcefdf63f7f/core/src/main/java/art/arcane/iris/generation/terrain/IrisRegion.java' -OutFile IrisRegion.java
          python editor/tools/extract_region_fields.py IrisRegion.java generated-region.properties
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash generated-region.properties).Hash -ne (Get-FileHash editor/src/main/resources/region-fields.properties).Hash) { throw 'Pinned region definitions differ' }
      - name: Verify pinned composite noise definitions
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://raw.githubusercontent.com/VolmitSoftware/Iris/c3359e0a16438b1bb8468901c6171dcefdf63f7f/core/src/main/java/art/arcane/iris/generation/noise/IrisNoiseGenerator.java' -OutFile IrisNoiseGenerator.java
          python editor/tools/extract_noise_fields.py IrisNoiseGenerator.java generated-noise.properties
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash generated-noise.properties).Hash -ne (Get-FileHash editor/src/main/resources/noise-fields.properties).Hash) { throw 'Pinned noise definitions differ' }
      - name: Verify pinned noise style definitions
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://raw.githubusercontent.com/VolmitSoftware/Iris/c3359e0a16438b1bb8468901c6171dcefdf63f7f/core/src/main/java/art/arcane/iris/generation/noise/IrisGeneratorStyle.java' -OutFile IrisGeneratorStyle.java
          Invoke-WebRequest 'https://raw.githubusercontent.com/VolmitSoftware/Iris/c3359e0a16438b1bb8468901c6171dcefdf63f7f/core/src/main/java/art/arcane/iris/generation/noise/NoiseStyle.java' -OutFile NoiseStyle.java
          python editor/tools/test_style_fields.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python editor/tools/extract_style_fields.py IrisNoiseGenerator.java IrisGeneratorStyle.java NoiseStyle.java generated-styles.properties IrisDimension.java IrisBiome.java
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash generated-styles.properties).Hash -ne (Get-FileHash editor/src/main/resources/style-fields.properties).Hash) { throw 'Pinned noise style definitions differ' }
      - name: Verify pinned 3D terrain profile definitions
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://raw.githubusercontent.com/VolmitSoftware/Iris/c3359e0a16438b1bb8468901c6171dcefdf63f7f/core/src/main/java/art/arcane/iris/generation/terrain/IrisTerrain3D.java' -OutFile IrisTerrain3D.java
          python editor/tools/test_terrain3d_fields.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python editor/tools/extract_terrain3d_fields.py IrisBiome.java IrisTerrain3D.java generated-terrain3d.properties
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash generated-terrain3d.properties).Hash -ne (Get-FileHash editor/src/main/resources/terrain3d-fields.properties).Hash) { throw 'Pinned terrain definitions differ' }
      - name: Verify pinned cave profile definitions
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://raw.githubusercontent.com/VolmitSoftware/Iris/c3359e0a16438b1bb8468901c6171dcefdf63f7f/core/src/main/java/art/arcane/iris/generation/cave/IrisCaveProfile.java' -OutFile IrisCaveProfile.java
          python editor/tools/test_cave_fields.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python editor/tools/extract_cave_fields.py IrisCaveProfile.java IrisDimension.java IrisRegion.java IrisBiome.java generated-cave.properties IrisGeneratorStyle.java
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash generated-cave.properties).Hash -ne (Get-FileHash editor/src/main/resources/cave-profile-fields.properties).Hash) { throw 'Pinned cave definitions differ' }
      - name: Verify pinned cave bounds and placement definitions
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://raw.githubusercontent.com/VolmitSoftware/Iris/c3359e0a16438b1bb8468901c6171dcefdf63f7f/core/src/main/java/art/arcane/iris/pack/value/IrisRange.java' -OutFile IrisRange.java
          Invoke-WebRequest 'https://raw.githubusercontent.com/VolmitSoftware/Iris/c3359e0a16438b1bb8468901c6171dcefdf63f7f/core/src/main/java/art/arcane/iris/generation/cave/IrisCaveAnchorMode.java' -OutFile IrisCaveAnchorMode.java
          Invoke-WebRequest 'https://raw.githubusercontent.com/VolmitSoftware/Iris/c3359e0a16438b1bb8468901c6171dcefdf63f7f/core/src/main/java/art/arcane/iris/structure/object/ObjectPlaceMode.java' -OutFile ObjectPlaceMode.java
          python editor/tools/test_cave_placement_fields.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python editor/tools/extract_cave_placement_fields.py IrisCaveProfile.java IrisRange.java IrisCaveAnchorMode.java ObjectPlaceMode.java generated-cave-placement.properties
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash generated-cave-placement.properties).Hash -ne (Get-FileHash editor/src/main/resources/cave-placement-fields.properties).Hash) { throw 'Pinned cave placement definitions differ' }
      - name: Verify pinned cave density threshold definitions
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://raw.githubusercontent.com/VolmitSoftware/Iris/c3359e0a16438b1bb8468901c6171dcefdf63f7f/core/src/main/java/art/arcane/iris/generation/noise/IrisStyledRange.java' -OutFile IrisStyledRange.java
          python editor/tools/test_cave_threshold_fields.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python editor/tools/extract_cave_threshold_fields.py IrisCaveProfile.java IrisStyledRange.java IrisGeneratorStyle.java generated-cave-threshold.properties
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash generated-cave-threshold.properties).Hash -ne (Get-FileHash editor/src/main/resources/cave-threshold-fields.properties).Hash) { throw 'Pinned cave threshold definitions differ' }
      - name: Verify pinned cave module definitions
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://raw.githubusercontent.com/VolmitSoftware/Iris/c3359e0a16438b1bb8468901c6171dcefdf63f7f/core/src/main/java/art/arcane/iris/generation/cave/IrisCaveFieldModule.java' -OutFile IrisCaveFieldModule.java
          python editor/tools/test_cave_module_fields.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python editor/tools/extract_cave_module_fields.py IrisCaveProfile.java IrisCaveFieldModule.java IrisRange.java IrisGeneratorStyle.java generated-cave-module.properties
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash generated-cave-module.properties).Hash -ne (Get-FileHash editor/src/main/resources/cave-module-fields.properties).Hash) { throw 'Pinned cave module definitions differ' }
      - name: Verify pinned river policy definitions
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://raw.githubusercontent.com/VolmitSoftware/Iris/c3359e0a16438b1bb8468901c6171dcefdf63f7f/core/src/main/java/art/arcane/iris/generation/hydrology/IrisRiverPolicy.java' -OutFile IrisRiverPolicy.java
          Invoke-WebRequest 'https://raw.githubusercontent.com/VolmitSoftware/Iris/c3359e0a16438b1bb8468901c6171dcefdf63f7f/core/src/main/java/art/arcane/iris/generation/hydrology/IrisRiverPlacementMode.java' -OutFile IrisRiverPlacementMode.java
          Invoke-WebRequest 'https://raw.githubusercontent.com/VolmitSoftware/Iris/c3359e0a16438b1bb8468901c6171dcefdf63f7f/core/src/main/java/art/arcane/iris/generation/hydrology/IrisRiverRoutingMode.java' -OutFile IrisRiverRoutingMode.java
          python editor/tools/test_river_policy_fields.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python editor/tools/extract_river_policy_fields.py IrisRiverPolicy.java IrisDimension.java IrisRegion.java IrisBiome.java IrisRiverPlacementMode.java IrisRiverRoutingMode.java generated-river-policy.properties
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash generated-river-policy.properties).Hash -ne (Get-FileHash editor/src/main/resources/river-policy-fields.properties).Hash) { throw 'Pinned river policy definitions differ' }
      - name: Verify pinned dimension river ID catalog definitions
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://raw.githubusercontent.com/VolmitSoftware/Iris/c3359e0a16438b1bb8468901c6171dcefdf63f7f/core/src/main/java/art/arcane/iris/generation/hydrology/IrisHydrology.java' -OutFile IrisHydrology.java
          Invoke-WebRequest 'https://raw.githubusercontent.com/VolmitSoftware/Iris/c3359e0a16438b1bb8468901c6171dcefdf63f7f/core/src/main/java/art/arcane/iris/generation/hydrology/IrisRiverHydrology.java' -OutFile IrisRiverHydrology.java
          Invoke-WebRequest 'https://raw.githubusercontent.com/VolmitSoftware/Iris/c3359e0a16438b1bb8468901c6171dcefdf63f7f/core/src/main/java/art/arcane/iris/generation/hydrology/IrisRiverProfile.java' -OutFile IrisRiverProfile.java
          Invoke-WebRequest 'https://raw.githubusercontent.com/VolmitSoftware/Iris/c3359e0a16438b1bb8468901c6171dcefdf63f7f/core/src/main/java/art/arcane/iris/generation/hydrology/IrisSurfacePoolConfig.java' -OutFile IrisSurfacePoolConfig.java
          python editor/tools/test_river_id_fields.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python editor/tools/extract_river_id_fields.py IrisRiverPolicy.java IrisDimension.java IrisHydrology.java IrisRiverHydrology.java IrisRiverProfile.java IrisSurfacePoolConfig.java generated-river-id.properties
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash generated-river-id.properties).Hash -ne (Get-FileHash editor/src/main/resources/river-id-fields.properties).Hash) { throw 'Pinned river ID definitions differ' }
      - name: Verify pinned physical hydrology routing definitions
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://raw.githubusercontent.com/VolmitSoftware/Iris/c3359e0a16438b1bb8468901c6171dcefdf63f7f/core/src/main/java/art/arcane/iris/generation/hydrology/IrisRiverRoutingConfig.java' -OutFile IrisRiverRoutingConfig.java
          python editor/tools/test_hydrology_fields.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python editor/tools/extract_hydrology_fields.py IrisDimension.java IrisHydrology.java IrisRiverHydrology.java IrisRiverRoutingConfig.java generated-hydrology.properties
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash generated-hydrology.properties).Hash -ne (Get-FileHash editor/src/main/resources/hydrology-fields.properties).Hash) { throw 'Pinned hydrology definitions differ' }
      - name: Verify pinned regional routing and inland outlet definitions
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://raw.githubusercontent.com/VolmitSoftware/Iris/c3359e0a16438b1bb8468901c6171dcefdf63f7f/core/src/main/java/art/arcane/iris/generation/hydrology/IrisRiverRegionalConfig.java' -OutFile IrisRiverRegionalConfig.java
          Invoke-WebRequest 'https://raw.githubusercontent.com/VolmitSoftware/Iris/c3359e0a16438b1bb8468901c6171dcefdf63f7f/core/src/main/java/art/arcane/iris/generation/hydrology/IrisRiverInlandOutlet.java' -OutFile IrisRiverInlandOutlet.java
          python editor/tools/test_routing_extras.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python editor/tools/extract_routing_extras.py IrisRiverRoutingConfig.java IrisRiverRegionalConfig.java IrisRiverInlandOutlet.java generated-routing-extras.properties
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash generated-routing-extras.properties).Hash -ne (Get-FileHash editor/src/main/resources/routing-extras.properties).Hash) { throw 'Pinned routing extras differ' }
      - name: Verify pinned river meander and surface geometry definitions
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://raw.githubusercontent.com/VolmitSoftware/Iris/c3359e0a16438b1bb8468901c6171dcefdf63f7f/core/src/main/java/art/arcane/iris/generation/hydrology/IrisRiverGeometryConfig.java' -OutFile IrisRiverGeometryConfig.java
          Invoke-WebRequest 'https://raw.githubusercontent.com/VolmitSoftware/Iris/c3359e0a16438b1bb8468901c6171dcefdf63f7f/core/src/main/java/art/arcane/iris/generation/hydrology/IrisRiverMeanderConfig.java' -OutFile IrisRiverMeanderConfig.java
          Invoke-WebRequest 'https://raw.githubusercontent.com/VolmitSoftware/Iris/c3359e0a16438b1bb8468901c6171dcefdf63f7f/core/src/main/java/art/arcane/iris/generation/hydrology/IrisSurfaceRiverShapeConfig.java' -OutFile IrisSurfaceRiverShapeConfig.java
          python editor/tools/test_river_geometry_fields.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python editor/tools/extract_river_geometry_fields.py IrisRiverHydrology.java IrisRiverGeometryConfig.java IrisRiverMeanderConfig.java IrisSurfaceRiverShapeConfig.java generated-river-geometry.properties
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash generated-river-geometry.properties).Hash -ne (Get-FileHash editor/src/main/resources/river-geometry-fields.properties).Hash) { throw 'Pinned river geometry definitions differ' }
      - name: Verify pinned river channel and drop geometry definitions
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://raw.githubusercontent.com/VolmitSoftware/Iris/c3359e0a16438b1bb8468901c6171dcefdf63f7f/core/src/main/java/art/arcane/iris/generation/hydrology/IrisRiverChannelShapeConfig.java' -OutFile IrisRiverChannelShapeConfig.java
          Invoke-WebRequest 'https://raw.githubusercontent.com/VolmitSoftware/Iris/c3359e0a16438b1bb8468901c6171dcefdf63f7f/core/src/main/java/art/arcane/iris/generation/hydrology/IrisRiverDropShapeConfig.java' -OutFile IrisRiverDropShapeConfig.java
          python editor/tools/test_river_passage_fields.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python editor/tools/extract_river_passage_fields.py IrisRiverGeometryConfig.java IrisRiverChannelShapeConfig.java IrisRiverDropShapeConfig.java generated-river-passage.properties
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash generated-river-passage.properties).Hash -ne (Get-FileHash editor/src/main/resources/river-passage-fields.properties).Hash) { throw 'Pinned river passage definitions differ' }
      - name: Verify pinned bank geometry and density style definitions
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://raw.githubusercontent.com/VolmitSoftware/Iris/c3359e0a16438b1bb8468901c6171dcefdf63f7f/core/src/main/java/art/arcane/iris/generation/hydrology/IrisRiverBank3DConfig.java' -OutFile IrisRiverBank3DConfig.java
          python editor/tools/test_river_bank_fields.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python editor/tools/extract_river_bank_fields.py IrisRiverGeometryConfig.java IrisRiverBank3DConfig.java generated-river-bank.properties
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash generated-river-bank.properties).Hash -ne (Get-FileHash editor/src/main/resources/river-bank-fields.properties).Hash) { throw 'Pinned bank geometry definitions differ' }
      - name: Audit pinned field coverage and editor classifications
        shell: pwsh
        run: |
          python editor/tools/test_field_coverage.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python editor/tools/field_coverage.py . editor/policy/field-policy.json editor/src/main/java/dev/irisvisualizer/editor generated-coverage
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash generated-coverage/field-coverage.properties).Hash -ne (Get-FileHash editor/src/main/resources/field-coverage.properties).Hash) { throw 'Coverage metadata differs' }
          if ((Get-FileHash generated-coverage/coverage-report.md).Hash -ne (Get-FileHash editor/coverage-report.md).Hash) { throw 'Coverage report differs' }
          Get-Content generated-coverage/coverage-report.md
      - name: Compile editor and verify workspace
        run: gradle -p editor --no-daemon workspaceTest classes
      - name: Build Windows x64 package
        run: gradle -p editor --no-daemon windowsZip
      - name: Verify launcher runtime check and missing-runtime message
        shell: pwsh
        run: |
          $launcher = Join-Path $PWD 'editor/build/windows/IrisVisualizer/Start-IrisVisualizer.ps1'
          $pwsh = (Get-Command pwsh).Source
          & $pwsh -NoProfile -File $launcher -CheckRuntime
          if ($LASTEXITCODE -ne 0) { throw 'Valid Java 25 x64 runtime rejected' }
          & $pwsh -NoProfile -File $launcher -CheckInstallation
          if ($LASTEXITCODE -ne 0) { throw 'Packaged ImGui/GLFW installation check failed' }
          $originalPath = $env:PATH
          $originalJavaHome = $env:JAVA_HOME
          try {
            $env:JAVA_HOME = Join-Path $PWD 'missing-java-runtime'
            $env:PATH = Join-Path $env:SystemRoot 'System32'
            $output = (& $pwsh -NoProfile -File $launcher -CheckRuntime 2>&1 | Out-String)
            if ($LASTEXITCODE -eq 0 -or $output -notmatch 'Java 25 x64 runtime was not found') { throw 'Missing runtime was not clearly rejected' }
          } finally { $env:PATH = $originalPath; $env:JAVA_HOME = $originalJavaHome }
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: IrisVisualizer-windows-x64
          path: editor/build/distributions/IrisVisualizer-windows-x64.zip
          if-no-files-found: error
