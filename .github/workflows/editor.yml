name: Windows editor
on:
  pull_request:
    paths: ['editor/**', '.github/workflows/editor.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  editor:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          architecture: x64
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Verify source-derived field definitions
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://raw.githubusercontent.com/VolmitSoftware/Iris/c3359e0a16438b1bb8468901c6171dcefdf63f7f/core/src/main/java/art/arcane/iris/generation/terrain/IrisDimension.java' -OutFile IrisDimension.java
          Invoke-WebRequest 'https://raw.githubusercontent.com/VolmitSoftware/Iris/c3359e0a16438b1bb8468901c6171dcefdf63f7f/core/src/main/java/art/arcane/iris/structure/nativegen/IrisImportedStructureControl.java' -OutFile IrisImportedStructureControl.java
          Invoke-WebRequest 'https://raw.githubusercontent.com/VolmitSoftware/Iris/c3359e0a16438b1bb8468901c6171dcefdf63f7f/core/src/main/java/art/arcane/iris/structure/nativegen/IrisImportedFeatureControl.java' -OutFile IrisImportedFeatureControl.java
          python editor/tools/extract_dimension_fields.py IrisDimension.java generated-fields.properties IrisImportedStructureControl.java IrisImportedFeatureControl.java
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash generated-fields.properties).Hash -ne (Get-FileHash editor/src/main/resources/dimension-fields.properties).Hash) { throw 'Pinned Iris field definitions differ' }
      - name: Verify pinned official starter templates
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://raw.githubusercontent.com/VolmitSoftware/Iris/c3359e0a16438b1bb8468901c6171dcefdf63f7f/core/src/main/java/art/arcane/iris/studio/StudioSVC.java' -OutFile StudioSVC.java
          python editor/tools/extract_starter.py StudioSVC.java generated-starter
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($file in Get-ChildItem generated-starter -File) {
            $expected = Join-Path 'editor/src/main/resources/starter' $file.Name
            if ((Get-FileHash $file.FullName).Hash -ne (Get-FileHash $expected).Hash) { throw "Pinned starter differs: $($file.Name)" }
          }
      - name: Verify pinned biome field definitions
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://raw.githubusercontent.com/VolmitSoftware/Iris/c3359e0a16438b1bb8468901c6171dcefdf63f7f/core/src/main/java/art/arcane/iris/generation/biome/IrisBiome.java' -OutFile IrisBiome.java
          Invoke-WebRequest 'https://raw.githubusercontent.com/VolmitSoftware/Iris/c3359e0a16438b1bb8468901c6171dcefdf63f7f/core/src/main/java/art/arcane/iris/generation/biome/IrisBiomeGeneratorLink.java' -OutFile IrisBiomeGeneratorLink.java
          python editor/tools/extract_biome_fields.py IrisBiome.java IrisBiomeGeneratorLink.java generated-biome.properties
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash generated-biome.properties).Hash -ne (Get-FileHash editor/src/main/resources/biome-fields.properties).Hash) { throw 'Pinned biome definitions differ' }
      - name: Verify pinned generator field definitions
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://raw.githubusercontent.com/VolmitSoftware/Iris/c3359e0a16438b1bb8468901c6171dcefdf63f7f/core/src/main/java/art/arcane/iris/generation/noise/IrisGenerator.java' -OutFile IrisGenerator.java
          Invoke-WebRequest 'https://raw.githubusercontent.com/VolmitSoftware/Iris/c3359e0a16438b1bb8468901c6171dcefdf63f7f/core/src/main/java/art/arcane/iris/generation/noise/IrisInterpolator.java' -OutFile IrisInterpolator.java
          python editor/tools/extract_generator_fields.py IrisGenerator.java IrisInterpolator.java generated-generator.properties
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash generated-generator.properties).Hash -ne (Get-FileHash editor/src/main/resources/generator-fields.properties).Hash) { throw 'Pinned generator definitions differ' }
      - name: Verify pinned region field definitions
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://raw.githubusercontent.com/VolmitSoftware/Iris/c3359e0a16438b1bb8468901c6171dcefdf63f7f/core/src/main/java/art/arcane/iris/generation/terrain/IrisRegion.java' -OutFile IrisRegion.java
          python editor/tools/extract_region_fields.py IrisRegion.java generated-region.properties
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash generated-region.properties).Hash -ne (Get-FileHash editor/src/main/resources/region-fields.properties).Hash) { throw 'Pinned region definitions differ' }
      - name: Compile editor and verify workspace
        run: gradle -p editor --no-daemon workspaceTest classes
      - name: Build Windows x64 package
        run: gradle -p editor --no-daemon windowsZip
      - name: Verify launcher runtime check and missing-runtime message
        shell: pwsh
        run: |
          $launcher = Join-Path $PWD 'editor/build/windows/IrisVisualizer/Start-IrisVisualizer.ps1'
          $pwsh = (Get-Command pwsh).Source
          & $pwsh -NoProfile -File $launcher -CheckRuntime
          if ($LASTEXITCODE -ne 0) { throw 'Valid Java 25 x64 runtime rejected' }
          & $pwsh -NoProfile -File $launcher -CheckInstallation
          if ($LASTEXITCODE -ne 0) { throw 'Packaged ImGui/GLFW installation check failed' }
          $originalPath = $env:PATH
          $originalJavaHome = $env:JAVA_HOME
          try {
            $env:JAVA_HOME = Join-Path $PWD 'missing-java-runtime'
            $env:PATH = Join-Path $env:SystemRoot 'System32'
            $output = (& $pwsh -NoProfile -File $launcher -CheckRuntime 2>&1 | Out-String)
            if ($LASTEXITCODE -eq 0 -or $output -notmatch 'Java 25 x64 runtime was not found') { throw 'Missing runtime was not clearly rejected' }
          } finally { $env:PATH = $originalPath; $env:JAVA_HOME = $originalJavaHome }
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: IrisVisualizer-windows-x64
          path: editor/build/distributions/IrisVisualizer-windows-x64.zip
          if-no-files-found: error
