name: Windows Iris feasibility
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: iris-feasibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  official-core:
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: [core, native-boundaries, native-fixture, overworld-context, overworld-structures]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          architecture: x64
      - name: Check feasibility contracts on Java 25
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/contracts | Out-Null
          $sources = Get-ChildItem feasibility/src/main/java/dev/irisvisualizer/feasibility/*.java
          $engineSources = Get-ChildItem engine/src/main/java/dev/irisvisualizer/engine/*.java
          & javac -d build/contracts $sources.FullName $engineSources.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & java -cp build/contracts dev.irisvisualizer.feasibility.ContractTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare pinned sources
        shell: pwsh
        run: ./scripts/Prepare-Sources.ps1
      - name: Check official core
        if: matrix.suite == 'core'
        shell: pwsh
        run: ./scripts/Test-Feasibility.ps1
      - name: Check native boundaries independently
        if: matrix.suite == 'native-boundaries'
        shell: pwsh
        run: ./scripts/Test-Feasibility.ps1 -NativeOnly
      - name: Check native states and full-size fixture
        if: matrix.suite == 'native-fixture'
        shell: pwsh
        run: ./scripts/Test-NativeFixture.ps1
      - name: Audit native Overworld context and readiness
        if: matrix.suite == 'overworld-context'
        shell: pwsh
        run: ./scripts/Test-OverworldContext.ps1
      - name: Check real Overworld structure planning and block boundaries
        if: matrix.suite == 'overworld-structures'
        shell: pwsh
        run: ./scripts/Test-OverworldContext.ps1 -StructureBlocks
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-feasibility-${{ matrix.suite }}
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            build/feasibility/
            build/native-fixture/
            build/overworld-context/
            build/overworld-structures/
            build/overworld-blocks/
            .work/iris/adapters/bukkit/nms/v26_3_R1/build/reports/tests/
            .work/iris/adapters/bukkit/nms/v26_3_R1/build/test-results/
