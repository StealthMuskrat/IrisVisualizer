name: Windows Iris feasibility
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official-core:
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: [core, native-boundaries]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          architecture: x64
      - name: Prepare pinned sources
        shell: pwsh
        run: ./scripts/Prepare-Sources.ps1
      - name: Check official core
        if: matrix.suite == 'core'
        shell: pwsh
        run: ./scripts/Test-Feasibility.ps1
      - name: Check native boundaries independently
        if: matrix.suite == 'native-boundaries'
        shell: pwsh
        run: ./scripts/Test-Feasibility.ps1 -NativeOnly
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-feasibility-${{ matrix.suite }}
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            build/feasibility/
            .work/iris/adapters/bukkit/nms/v26_3_R1/build/reports/tests/
            .work/iris/adapters/bukkit/nms/v26_3_R1/build/test-results/
