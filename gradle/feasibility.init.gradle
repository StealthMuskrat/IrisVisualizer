// Adds integration sources to the official probe module without editing Iris sources.
gradle.projectsEvaluated {
    if (gradle.rootProject.name == 'VolmLib') {
        def root = System.getenv('IRIS_VISUALIZER_ROOT')
        if (!root) throw new GradleException('Use scripts/Test-Feasibility.ps1')
        def shared = gradle.rootProject.project(':shared')
        // Compile one official Windows I/O helper from a later revision, keeping the native API pinned.
        shared.sourceSets.main.java.exclude('art/arcane/volmlib/util/mantle/io/IOWorkerSupport.java')
        shared.tasks.named('compileJava').configure {
            source(new File(root, 'compatibility/volmlib/src/main/java/art/arcane/volmlib/util/mantle/io/IOWorkerSupport.java'))
        }
        return
    }
    // Init scripts also run for buildSrc and included builds; touch only the Iris root.
    if (gradle.rootProject.name != 'Iris') return
    def root = System.getenv('IRIS_VISUALIZER_ROOT')
    if (!root) throw new GradleException('Use scripts/Test-Feasibility.ps1')
    def probe = gradle.rootProject.project(':probe')
    probe.sourceSets.main.java.srcDir(new File(root, 'feasibility/src/main/java'))
    probe.sourceSets.main.java.srcDir(new File(root, 'engine/src/main/java'))
    probe.tasks.register('visualizerFeasibility', JavaExec) {
        dependsOn(probe.tasks.named('classes'))
        classpath = probe.sourceSets.main.runtimeClasspath + probe.configurations.studioProbeApi
        mainClass = 'art.arcane.iris.probe.VisualizerFeasibility'
        jvmArgs('--add-modules=jdk.incubator.vector', '-Djava.awt.headless=true', '-XX:+ExitOnOutOfMemoryError')
        minHeapSize = '1g'
        maxHeapSize = '4g'
        args(System.getenv('IRIS_VISUALIZER_PACK'), 'overworld', System.getenv('IRIS_VISUALIZER_REPORT'))
    }
    probe.tasks.register('visualizerContractTest', JavaExec) {
        dependsOn(probe.tasks.named('classes'))
        classpath = probe.sourceSets.main.runtimeClasspath
        mainClass = 'dev.irisvisualizer.feasibility.ContractTests'
    }
    def nativeProject = gradle.rootProject.project(':adapters:bukkit:nms:v26_3_R1')
    nativeProject.sourceSets.offline.java.srcDir(new File(root, 'native-feasibility/src/main/java'))
    // Reuse the pinned official finite WorldGenLevel fixture unchanged; no server is installed.
    nativeProject.tasks.named('compileOfflineJava').configure {
        source(nativeProject.file('src/test/java/art/arcane/iris/probe/OfflineFeatureWorld.java'))
    }
    nativeProject.tasks.register('visualizerNativeFixture', JavaExec) {
        dependsOn(nativeProject.tasks.named('offlineClasses'))
        classpath = nativeProject.sourceSets.offline.runtimeClasspath
        mainClass = 'art.arcane.iris.probe.NativeFixtureProof'
        minHeapSize = '1g'
        maxHeapSize = '4g'
        jvmArgs('--add-modules=jdk.incubator.vector', '-Djava.awt.headless=true', '-XX:+ExitOnOutOfMemoryError')
        doFirst {
            args(System.getenv('IRIS_VISUALIZER_NATIVE_FIXTURE'), System.getenv('IRIS_VISUALIZER_NATIVE_REPORT'), '1337')
        }
    }
    nativeProject.tasks.register('visualizerOverworldContext', JavaExec) {
        dependsOn(nativeProject.tasks.named('offlineClasses'))
        classpath = nativeProject.sourceSets.offline.runtimeClasspath
        mainClass = 'art.arcane.iris.probe.NativeOverworldContextAudit'
        minHeapSize = '1g'
        maxHeapSize = '4g'
        jvmArgs('--add-modules=jdk.incubator.vector', '-Djava.awt.headless=true', '-XX:+ExitOnOutOfMemoryError')
        doFirst {
            args(System.getenv('IRIS_VISUALIZER_PACK'), System.getenv('IRIS_VISUALIZER_OVERWORLD_REPORT'))
            if (System.getenv('IRIS_VISUALIZER_STRUCTURE_BLOCKS') == 'true') args('blocks')
            else if (System.getenv('IRIS_VISUALIZER_STRUCTURE_PLANNING') == 'true') args('structures')
        }
    }
}
